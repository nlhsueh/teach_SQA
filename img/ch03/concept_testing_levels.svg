<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Ambient field -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Top Banner Tag -->
  <g transform="translate(400, 115)">
    <rect x="-190" y="-40" width="380" height="65" rx="32" fill="rgba(255, 255, 255, 0.9)" stroke="#64748b" stroke-width="2" />
    <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
      TESTING LEVELS
    </text>
  </g>

  <!-- Level 3 (Top): System Testing (E2E / Full System) -->
  <g transform="translate(400, 260)">
    <!-- Plate Container -->
    <rect x="-260" y="-45" width="520" height="90" rx="14" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="2.5" />
    <!-- Icon: Globe / System -->
    <g transform="translate(-195, 0)">
      <circle cx="0" cy="0" r="24" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="24" ry="10" fill="none" stroke="#f43f5e" stroke-width="1.5" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#f43f5e" stroke-width="1.5" />
    </g>
    <!-- Text two lines -->
    <text x="-145" y="-5" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#be123c">Level 3: System Testing</text>
    <text x="-145" y="24" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748b">End-to-End User Journeys &amp; Performance</text>
  </g>

  <!-- Connecting Upward Flow Arrows -->
  <g transform="translate(400, 335)">
    <line x1="0" y1="-10" x2="0" y2="15" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="-6,15 6,15 0,23" fill="#94a3b8" transform="rotate(180, 0, 15)" />
  </g>

  <!-- Level 2 (Middle): Integration Testing (API / Cross-module Interface) -->
  <g transform="translate(400, 420)">
    <!-- Plate Container -->
    <rect x="-260" y="-45" width="520" height="90" rx="14" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="2.5" />
    <!-- Icon: API Puzzle -->
    <g transform="translate(-195, 0)">
      <rect x="-22" y="-18" width="20" height="36" rx="4" fill="rgba(2, 132, 199, 0.2)" stroke="#0284c7" stroke-width="2" />
      <rect x="2" y="-18" width="20" height="36" rx="4" fill="rgba(2, 132, 199, 0.2)" stroke="#0284c7" stroke-width="2" />
      <path d="M -2 0 L 2 0" stroke="#0284c7" stroke-width="4" />
    </g>
    <!-- Text two lines -->
    <text x="-145" y="-5" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#0369a1">Level 2: Integration Testing</text>
    <text x="-145" y="24" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748b">Cross-Module Interfaces &amp; DB Contracts</text>
  </g>

  <!-- Connecting Upward Flow Arrows -->
  <g transform="translate(400, 495)">
    <line x1="0" y1="-10" x2="0" y2="15" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="-6,15 6,15 0,23" fill="#94a3b8" transform="rotate(180, 0, 15)" />
  </g>

  <!-- Level 1 (Bottom): Unit Testing (Class / Method isolation) -->
  <g transform="translate(400, 580)">
    <!-- Plate Container -->
    <rect x="-260" y="-45" width="520" height="90" rx="14" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="2.5" />
    <!-- Icon: Method brackets -->
    <g transform="translate(-195, 0)" stroke="#10b981" stroke-width="2.5" fill="none">
      <rect x="-20" y="-20" width="40" height="40" rx="8" fill="rgba(16, 185, 129, 0.2)" />
      <path d="M -10 -8 L -16 0 L -10 8" />
      <path d="M 10 -8 L 16 0 L 10 8" />
    </g>
    <!-- Text two lines -->
    <text x="-145" y="-5" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#047857">Level 1: Unit Testing</text>
    <text x="-145" y="24" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748b">Isolated Classes, Methods &amp; Fast Logic</text>
  </g>
</svg>
