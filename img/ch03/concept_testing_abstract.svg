<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Rich Gradients for Facets -->
    <linearGradient id="facetShield1" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="facetShield2" x1="90%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="prismLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="emeraldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Shadow for floating elements -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- NO background rect: 100% transparent canvas for seamless slide integration -->

  <!-- Dynamic Abstract Orbit Rings & Laser Testing Beams -->
  <g opacity="0.6">
    <!-- Big outer calibration ellipse -->
    <ellipse cx="400" cy="400" rx="340" ry="180"
             fill="none"
             stroke="#94a3b8"
             stroke-width="1.8"
             stroke-dasharray="8 12"
             transform="rotate(-25, 400, 400)" />
    
    <!-- Secondary testing trajectory ring -->
    <circle cx="400" cy="400" r="260"
            fill="none"
            stroke="url(#cyanArc)"
            stroke-width="3"
            transform="rotate(35, 400, 400)" />
  </g>

  <!-- Glowing Nodes on the orbital paths -->
  <g>
    <circle cx="160" cy="280" r="6" fill="#38bdf8" opacity="0.8" />
    <circle cx="640" cy="520" r="7" fill="#6366f1" opacity="0.8" />
    <circle cx="230" cy="560" r="5" fill="#0284c7" opacity="0.7" />
    <circle cx="580" cy="250" r="8" fill="#0ea5e9" opacity="0.8" />
  </g>

  <!-- Main Abstract Geometric Crystal Shield (Grand & Minimalist) -->
  <g filter="url(#softGlow)">
    <!-- Left facet of the crest -->
    <path d="M 400 120
             L 220 220
             C 210 380, 290 520, 400 660
             L 400 120 Z"
          fill="url(#facetShield1)" />

    <!-- Right facet of the crest (deeper tone for 3D geometric depth) -->
    <path d="M 400 120
             L 580 220
             C 590 380, 510 520, 400 660
             L 400 120 Z"
          fill="url(#facetShield2)" />

    <!-- Crystal Central Ridge Highlight Line -->
    <line x1="400" y1="120" x2="400" y2="660"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.9" />

    <!-- Glassmorphic Translucent Facet Overlays (Prism refraction) -->
    <polygon points="400,120 220,220 330,380 400,300"
             fill="url(#prismLight)" />
    <polygon points="400,300 480,420 400,660 320,490"
             fill="#ffffff"
             opacity="0.12" />
  </g>

  <!-- Abstract Inspection Rings (Clean, Bold, Focused) -->
  <g filter="url(#softGlow)">
    <!-- Inner Lens Ring -->
    <circle cx="450" cy="380" r="140"
            fill="none"
            stroke="url(#lensRing)"
            stroke-width="14" />
    
    <!-- Lens Glass Reflection Arc -->
    <path d="M 370 290
             C 430 250, 520 270, 560 320"
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.75" />

    <!-- Lens Specular Glint -->
    <circle cx="365" cy="300" r="6" fill="#ffffff" opacity="0.9" />

    <!-- Inner Abstract Grid Crosshair (Inspection Scope) -->
    <circle cx="450" cy="380" r="75"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.8"
            stroke-dasharray="6 6"
            opacity="0.5" />
    <line x1="450" y1="285" x2="450" y2="330" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="450" y1="430" x2="450" y2="475" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="355" y1="380" x2="400" y2="380" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="500" y1="380" x2="545" y2="380" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Big Bold Verified Emerald Badge (Floating Top Right - Pure Symbol, NO Text) -->
  <g filter="url(#badgeShadow)">
    <circle cx="580" cy="230" r="54"
            fill="url(#emeraldBadge)"
            stroke="#ffffff"
            stroke-width="4" />
    
    <!-- Bold Pristine Checkmark -->
    <path d="M 558 230 L 574 246 L 606 214"
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Outer energetic pulse ring -->
    <circle cx="580" cy="230" r="68"
            fill="none"
            stroke="#34d399"
            stroke-width="2"
            stroke-dasharray="4 6"
            opacity="0.6" />
  </g>

  <!-- Abstract Floating Precision Cubes / Quality Nodes (Bottom Left) -->
  <g filter="url(#softGlow)" opacity="0.85">
    <!-- Floating Node 1 -->
    <rect x="200" y="470" width="36" height="36" rx="10"
          fill="#0284c7"
          stroke="#ffffff"
          stroke-width="2"
          transform="rotate(18, 218, 488)" />
    <!-- Floating Node 2 -->
    <rect x="250" y="540" width="26" height="26" rx="7"
          fill="#38bdf8"
          stroke="#ffffff"
          stroke-width="1.8"
          transform="rotate(-12, 263, 553)" />
  </g>
</svg>