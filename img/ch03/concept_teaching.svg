<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Subtle circular horizon -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 10" opacity="0.35" />

  <!-- Presentation Easel / Board Stand -->
  <!-- Board Back Plate -->
  <rect x="200" y="180" width="400" height="290" rx="20"
        fill="rgba(148, 163, 184, 0.08)"
        stroke="#64748b"
        stroke-width="3" />
  
  <!-- Easel Legs -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <!-- Left Leg -->
    <line x1="260" y1="470" x2="200" y2="670" />
    <!-- Right Leg -->
    <line x1="540" y1="470" x2="600" y2="670" />
    <!-- Rear/Center Leg -->
    <line x1="400" y1="470" x2="400" y2="685" stroke-dasharray="6 6" opacity="0.6" />
    <!-- Support shelf crossbar -->
    <line x1="170" y1="475" x2="630" y2="475" stroke-width="4" />
  </g>

  <!-- Architectural Framework Schema on Board (Pure Geometry, NO text) -->
  <!-- Top Root Node -->
  <rect x="360" y="215" width="80" height="38" rx="8" fill="rgba(100, 116, 139, 0.12)" stroke="#64748b" stroke-width="2" />
  <!-- Connecting lines -->
  <line x1="400" y1="253" x2="400" y2="280" stroke="#94a3b8" stroke-width="2" />
  <line x1="280" y1="280" x2="520" y2="280" stroke="#94a3b8" stroke-width="2" />
  <line x1="280" y1="280" x2="280" y2="305" stroke="#94a3b8" stroke-width="2" />
  <line x1="520" y1="280" x2="520" y2="305" stroke="#94a3b8" stroke-width="2" />

  <!-- Sub Nodes (Middle Tier) -->
  <rect x="240" y="305" width="80" height="34" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" />
  <rect x="480" y="305" width="80" height="34" rx="8" fill="none" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Flow Arrow Curve from Left to Right -->
  <path d="M 280 375 C 340 420, 460 420, 520 375" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="520,375 508,380 514,392" fill="#64748b" />

  <!-- Growth / Trend Line Arrow (Bottom of board) -->
  <polyline points="240,430 320,410 380,425 460,385 530,360" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="530" cy="360" r="5" fill="#64748b" />

  <!-- Pointer / Teacher Wand Floating -->
  <g transform="rotate(-35, 490, 360)">
    <line x1="490" y1="180" x2="490" y2="440" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <circle cx="490" cy="180" r="6" fill="#64748b" />
  </g>
</svg>