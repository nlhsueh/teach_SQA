<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Subtle Mind Radiance Rings -->
  <circle cx="400" cy="380" r="310" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
  <circle cx="400" cy="380" r="260" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Radiating Insight Spark Rays -->
  <g stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <!-- North rays -->
    <line x1="400" y1="120" x2="400" y2="170" />
    <line x1="400" y1="90" x2="400" y2="105" stroke-dasharray="2 4" />
    <!-- North-East rays -->
    <line x1="570" y1="190" x2="535" y2="225" />
    <!-- East rays -->
    <line x1="640" y1="360" x2="590" y2="360" />
    <!-- North-West rays -->
    <line x1="230" y1="190" x2="265" y2="225" />
    <!-- West rays -->
    <line x1="160" y1="360" x2="210" y2="360" />
    <!-- Accent sparks -->
    <circle cx="560" cy="150" r="4" fill="#94a3b8" />
    <circle cx="240" cy="150" r="3.5" fill="#94a3b8" />
    <circle cx="650" cy="270" r="4.5" fill="#94a3b8" />
    <circle cx="150" cy="270" r="4.5" fill="#94a3b8" />
  </g>

  <!-- Big Minimalist Lightbulb Outline -->
  <g>
    <!-- Bulb Glass Outline -->
    <path d="M 280 340
             C 280 260, 335 200, 400 200
             C 465 200, 520 260, 520 340
             C 520 405, 475 455, 455 490
             C 450 500, 450 520, 450 530
             L 350 530
             C 350 520, 350 500, 345 490
             C 325 455, 280 405, 280 340 Z"
          fill="rgba(148, 163, 184, 0.08)"
          stroke="#64748b"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Bulb Screw Base Threads -->
    <line x1="360" y1="550" x2="440" y2="550" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="365" y1="575" x2="435" y2="575" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="375" y1="600" x2="425" y2="600" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Base contact point -->
    <path d="M 385 600 C 385 620, 415 620, 415 600" fill="rgba(100, 116, 139, 0.12)" stroke="#64748b" stroke-width="2.5" />

    <!-- Glowing Filament Spark (Pure Geometry) -->
    <!-- Filament vertical stems -->
    <line x1="375" y1="530" x2="375" y2="410" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    <line x1="425" y1="530" x2="425" y2="410" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    
    <!-- Geometric Heart / Star Filament Core -->
    <path d="M 375 410
             C 375 360, 390 320, 400 320
             C 410 320, 425 360, 425 410
             L 400 370 Z"
          fill="rgba(100, 116, 139, 0.12)"
          stroke="#64748b"
          stroke-width="2.5"
          stroke-linejoin="round" />
    <circle cx="400" cy="320" r="5" fill="#64748b" />
  </g>
</svg>