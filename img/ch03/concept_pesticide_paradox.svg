<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Subtle ambient field -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Top Banner Tag -->
  <g transform="translate(400, 115)">
    <rect x="-190" y="-40" width="380" height="65" rx="32" fill="rgba(255, 255, 255, 0.9)" stroke="#64748b" stroke-width="2" />
    <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
      PESTICIDE PARADOX
    </text>
  </g>

  <!-- Left: Pesticide Spray Can -->
  <g transform="translate(230, 430) rotate(22)">
    <!-- Spray Nozzle -->
    <rect x="-18" y="-180" width="36" height="30" rx="4" fill="rgba(100, 116, 139, 0.2)" stroke="#475569" stroke-width="2.5" />
    <path d="M 18 -165 L 35 -165" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <path d="M -8 -150 L -8 -130 L 8 -130 L 8 -150" fill="none" stroke="#475569" stroke-width="2.5" />

    <!-- Can Cap / Dome -->
    <path d="M -50 -70 C -50 -130 50 -130 50 -70" fill="rgba(148, 163, 184, 0.15)" stroke="#475569" stroke-width="3" />

    <!-- Can Main Cylinder Body -->
    <rect x="-50" y="-70" width="100" height="230" rx="14" fill="rgba(148, 163, 184, 0.12)" stroke="#475569" stroke-width="3.5" />

    <!-- Label band on can -->
    <rect x="-50" y="-15" width="100" height="90" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1.8" />
    <!-- Skull / Danger symbol or Test label on can -->
    <circle cx="0" cy="20" r="14" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M -7 20 L 7 20" stroke="#0284c7" stroke-width="2" />
    <path d="M 0 13 L 0 27" stroke="#0284c7" stroke-width="2" />
    <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#0284c7" text-anchor="middle">TEST SUITE</text>

    <!-- Spray Mist Emitting -->
    <g transform="translate(45, -165) rotate(-22)" opacity="0.75">
      <path d="M 10 -5 Q 70 -50 140 -30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 6" />
      <path d="M 15 0 Q 80 -10 150 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" />
      <path d="M 10 5 Q 70 30 130 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 6" />
      
      <!-- Mist Particles -->
      <circle cx="60" cy="-25" r="4" fill="#7dd3fc" />
      <circle cx="110" cy="-10" r="5" fill="#7dd3fc" />
      <circle cx="90" cy="25" r="3.5" fill="#7dd3fc" />
      <circle cx="140" cy="40" r="6" fill="#38bdf8" opacity="0.6" />
    </g>
  </g>

  <!-- Right: Immune / Resistant Bug with Shield & Sunglasses -->
  <g transform="translate(530, 440)">
    <!-- Protective Aura around immune bug -->
    <circle cx="0" cy="10" r="140" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 6" opacity="0.5" />

    <!-- Bug Legs (Right side) -->
    <path d="M 30 -20 Q 75 -40 95 -20" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 15 Q 90 20 105 45" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <path d="M 30 50 Q 80 80 90 115" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Bug Antennae -->
    <path d="M -15 -65 Q -25 -115 -55 -125" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-55" cy="-125" r="4" fill="#475569" />
    <path d="M 15 -65 Q 25 -115 55 -125" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="55" cy="-125" r="4" fill="#475569" />

    <!-- Bug Body -->
    <!-- Abdomen -->
    <ellipse cx="0" cy="40" rx="55" ry="70" fill="rgba(16, 185, 129, 0.15)" stroke="#059669" stroke-width="3.5" />
    <line x1="0" y1="-25" x2="0" y2="105" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" />
    <!-- Head -->
    <ellipse cx="0" cy="-40" rx="35" ry="28" fill="rgba(16, 185, 129, 0.2)" stroke="#059669" stroke-width="3" />

    <!-- Cool Sunglasses (Immune to repeated tests) -->
    <g transform="translate(0, -42)">
      <!-- Left lens -->
      <polygon points="-28,-8 -6,-8 -9,8 -25,8" fill="#1e293b" />
      <!-- Right lens -->
      <polygon points="6,-8 28,-8 25,8 9,8" fill="#1e293b" />
      <!-- Bridge -->
      <line x1="-7" y1="-5" x2="7" y2="-5" stroke="#1e293b" stroke-width="2.5" />
      <!-- Glare reflection lines -->
      <line x1="-22" y1="-4" x2="-14" y2="4" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
      <line x1="12" y1="-4" x2="20" y2="4" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- Smug Grin -->
    <path d="M -12 -18 Q 0 -8 14 -20" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

    <!-- Shield in Left Hand Deflecting Spray -->
    <g transform="translate(-75, 15)">
      <!-- Arm holding shield -->
      <path d="M 40 10 L 0 0" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
      <!-- Shield Body -->
      <path d="M 0 -70 C 40 -60 40 -20 0 70 C -40 -20 -40 -60 0 -70 Z" 
            fill="rgba(16, 185, 129, 0.25)" stroke="#059669" stroke-width="3.5" />
      <!-- Shield Checkmark / Emblem -->
      <path d="M -12 -5 L -3 5 L 14 -12" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
