<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Ambient Dashed Rings -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Monkey Testing Banner Tag -->
  <g transform="translate(400, 115)">
    <rect x="-190" y="-40" width="380" height="65" rx="32" fill="rgba(255, 255, 255, 0.9)" stroke="#64748b" stroke-width="2" />
    <text x="0" y="4" font-family="-apple-system, sans-serif" font-size="26" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">
      MONKEY TESTING
    </text>
  </g>

  <!-- Laptop / Computer Setup -->
  <g transform="translate(320, 520)">
    <!-- Desk Surface -->
    <line x1="-220" y1="120" x2="380" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round" />

    <!-- Screen (Displaying chaotic random glitch output) -->
    <rect x="-160" y="-140" width="240" height="180" rx="14" fill="rgba(15, 23, 42, 0.08)" stroke="#334155" stroke-width="3.5" />
    <!-- Screen content: random chaos symbols -->
    <g fill="#0284c7" font-family="Courier, monospace" font-size="22" font-weight="700">
      <text x="-140" y="-95">#@&amp;!%?^</text>
      <text x="-140" y="-60">RANDOM_EVT()</text>
      <text x="-140" y="-25">&gt;&gt; STRESS_09</text>
      <text x="-140" y="10">&gt; CRASH_TEST</text>
    </g>

    <!-- Flying Keys popped off keyboard from frantic monkey tapping -->
    <g transform="translate(40, 20)">
      <rect x="0" y="-60" width="28" height="24" rx="5" fill="rgba(255, 255, 255, 0.95)" stroke="#64748b" stroke-width="2" transform="rotate(-15)" />
      <text x="7" y="-44" font-family="monospace" font-size="14" font-weight="700" fill="#475569">A</text>
      
      <rect x="50" y="-80" width="28" height="24" rx="5" fill="rgba(255, 255, 255, 0.95)" stroke="#64748b" stroke-width="2" transform="rotate(25)" />
      <text x="59" y="-64" font-family="monospace" font-size="14" font-weight="700" fill="#475569">?</text>

      <rect x="25" y="-115" width="28" height="24" rx="5" fill="rgba(255, 255, 255, 0.95)" stroke="#64748b" stroke-width="2" transform="rotate(-30)" />
      <text x="32" y="-99" font-family="monospace" font-size="14" font-weight="700" fill="#475569">#</text>
    </g>

    <!-- Keyboard Base (Being pounded) -->
    <polygon points="-190,120 70,120 40,40 -160,40" fill="rgba(148, 163, 184, 0.15)" stroke="#475569" stroke-width="3" stroke-linejoin="round" />
    <!-- Keyboard key rows -->
    <line x1="-165" y1="65" x2="30" y2="65" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
    <line x1="-175" y1="90" x2="45" y2="90" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
  </g>

  <!-- The Energetic Monkey Character -->
  <g transform="translate(540, 470)">
    <!-- Curled Tail -->
    <path d="M 60 70 C 130 90 170 -10 130 -30 C 105 -40 100 0 120 10" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" />

    <!-- Monkey Body -->
    <ellipse cx="20" cy="50" rx="60" ry="70" fill="rgba(100, 116, 139, 0.16)" stroke="#475569" stroke-width="3" />
    <!-- Tummy circle -->
    <ellipse cx="5" cy="55" rx="35" ry="45" fill="rgba(203, 213, 225, 0.25)" stroke="none" />

    <!-- Monkey Head -->
    <circle cx="-10" cy="-40" r="55" fill="rgba(100, 116, 139, 0.18)" stroke="#475569" stroke-width="3" />
    
    <!-- Ears -->
    <!-- Right Ear -->
    <circle cx="45" cy="-45" r="22" fill="rgba(100, 116, 139, 0.18)" stroke="#475569" stroke-width="3" />
    <circle cx="45" cy="-45" r="12" fill="rgba(203, 213, 225, 0.4)" stroke="none" />
    <!-- Left Ear -->
    <circle cx="-65" cy="-45" r="22" fill="rgba(100, 116, 139, 0.18)" stroke="#475569" stroke-width="3" />
    <circle cx="-65" cy="-45" r="12" fill="rgba(203, 213, 225, 0.4)" stroke="none" />

    <!-- Face details -->
    <!-- Muzzle / Snout -->
    <ellipse cx="-20" cy="-25" rx="36" ry="26" fill="rgba(255, 255, 255, 0.7)" stroke="#64748b" stroke-width="2" />
    <!-- Nostrils -->
    <circle cx="-26" cy="-28" r="3" fill="#475569" />
    <circle cx="-14" cy="-28" r="3" fill="#475569" />
    <!-- Cheerful Open Grin / Mischievous Smile -->
    <path d="M -35 -20 Q -20 -5 -5 -20" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Enthusiastic testing expression ^_^) -->
    <path d="M -38 -52 Q -30 -62 -22 -52" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />
    <path d="M -14 -52 Q -6 -62 2 -52" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" />

    <!-- Arms Pounding / Typing frantically on keyboard -->
    <!-- Left Arm slamming down -->
    <path d="M -30 20 Q -100 40 -160 85" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-160" cy="85" r="11" fill="rgba(100, 116, 139, 0.3)" stroke="#475569" stroke-width="2.5" />

    <!-- Right Arm raised in air ready to slam -->
    <path d="M 0 10 Q -60 -20 -110 30" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="-110" cy="30" r="11" fill="rgba(100, 116, 139, 0.3)" stroke="#475569" stroke-width="2.5" />

    <!-- Impact shockwaves on keyboard -->
    <path d="M -180 80 A 15 15 0 0 1 -150 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <path d="M -145 95 A 15 15 0 0 1 -135 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
