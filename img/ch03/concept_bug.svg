<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Ambient Dashed Rings -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="400" cy="400" r="350" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6" opacity="0.25" />

  <!-- Target Crosshairs (Subtle testing scanner) -->
  <line x1="160" y1="400" x2="260" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="540" y1="400" x2="640" y2="400" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="400" y1="160" x2="400" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
  <line x1="400" y1="540" x2="400" y2="640" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Bug Entity -->
  <g transform="translate(370, 360)">
    <!-- Bug Legs (Left) -->
    <path d="M -30 -30 Q -80 -60 -110 -40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M -40 10 Q -100 10 -120 40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M -30 50 Q -90 90 -105 130" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Bug Legs (Right) -->
    <path d="M 30 -30 Q 80 -60 110 -40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 10 Q 100 10 120 40" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path d="M 30 50 Q 90 90 105 130" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Bug Antennae -->
    <path d="M -15 -85 Q -35 -145 -70 -160" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-70" cy="-160" r="4" fill="#64748b" />
    <path d="M 15 -85 Q 35 -145 70 -160" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="70" cy="-160" r="4" fill="#64748b" />

    <!-- Bug Body (Thorax & Abdomen) -->
    <!-- Abdomen -->
    <ellipse cx="0" cy="40" rx="55" ry="75" fill="rgba(148, 163, 184, 0.12)" stroke="#475569" stroke-width="3" />
    <line x1="0" y1="-30" x2="0" y2="110" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M -48 20 Q 0 45 48 20" fill="none" stroke="#94a3b8" stroke-width="1.8" />
    <path d="M -40 65 Q 0 85 40 65" fill="none" stroke="#94a3b8" stroke-width="1.8" />

    <!-- Thorax / Head -->
    <ellipse cx="0" cy="-55" rx="35" ry="30" fill="rgba(100, 116, 139, 0.18)" stroke="#475569" stroke-width="3" />
    <!-- Eyes -->
    <circle cx="-16" cy="-65" r="5" fill="#475569" />
    <circle cx="16" cy="-65" r="5" fill="#475569" />
  </g>

  <!-- Magnifying Glass (Inspection / Detection Overlay) -->
  <g transform="rotate(-25, 410, 390)">
    <!-- Lens Rim Outer -->
    <circle cx="410" cy="360" r="175" fill="none" stroke="#0284c7" stroke-width="6" opacity="0.85" />
    <!-- Lens Rim Inner -->
    <circle cx="410" cy="360" r="162" fill="rgba(2, 132, 199, 0.04)" stroke="#38bdf8" stroke-width="1.8" opacity="0.7" />
    
    <!-- Lens Flare / Glare reflection -->
    <path d="M 300 280 A 150 150 0 0 1 480 230" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 500 240 A 150 150 0 0 1 535 270" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.6" />

    <!-- Handle -->
    <path d="M 410 535 L 410 680" stroke="#334155" stroke-width="18" stroke-linecap="round" />
    <path d="M 410 535 L 410 565" stroke="#94a3b8" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
