<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Subtle ambient aura -->
  <circle cx="400" cy="400" r="330" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" />

  <!-- Base Baseline -->
  <line x1="90" y1="630" x2="710" y2="630" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- 1 : 10 : 100 Big Formula Tag at Top Left/Center -->
  <g transform="translate(320, 110)">
    <rect x="-170" y="-40" width="340" height="65" rx="32" fill="rgba(255, 255, 255, 0.9)" stroke="#64748b" stroke-width="2" />
    <text x="0" y="6" font-family="-apple-system, sans-serif" font-size="30" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="3">
      1 : 10 : 100+
    </text>
  </g>

  <!-- Exponential Cost Curve (Rising from left to right) -->
  <path d="M 160 575 Q 360 550 440 430 T 630 205" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" />
  <!-- Arrow Head at the top of the curve -->
  <polygon points="630,205 608,228 640,230" fill="#f43f5e" transform="rotate(25, 630, 205)" />

  <!-- Step 1: $1 (Requirements / Early Stage) -->
  <g transform="translate(160, 630)">
    <!-- Column Bar -->
    <rect x="-45" y="-70" width="90" height="70" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2.5" />
    <!-- Cost Label $1 -->
    <text x="0" y="-85" font-family="-apple-system, sans-serif" font-size="30" font-weight="800" fill="#10b981" text-anchor="middle">$1</text>
    <!-- Stage Dot -->
    <circle cx="0" cy="-70" r="6" fill="#10b981" />
    <!-- Subtle icon: Document / Spec -->
    <rect x="-18" y="-52" width="36" height="36" rx="4" fill="none" stroke="#10b981" stroke-width="2" opacity="0.7" />
    <line x1="-10" y1="-42" x2="10" y2="-42" stroke="#10b981" stroke-width="2" opacity="0.7" />
    <line x1="-10" y1="-32" x2="6" y2="-32" stroke="#10b981" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Step 2: $10 (Development / Code Stage) -->
  <g transform="translate(380, 630)">
    <!-- Column Bar -->
    <rect x="-55" y="-220" width="110" height="220" rx="10" fill="rgba(2, 132, 199, 0.15)" stroke="#0284c7" stroke-width="3" />
    <!-- Cost Label $10 -->
    <text x="0" y="-235" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" fill="#0284c7" text-anchor="middle">$10</text>
    <!-- Stage Dot -->
    <circle cx="0" cy="-220" r="7" fill="#0284c7" />
    <!-- Subtle icon: Code brackets -->
    <g transform="translate(0, -110)" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M -16 -12 L -26 0 L -16 12" />
      <path d="M 16 -12 L 26 0 L 16 12" />
      <line x1="-5" y1="14" x2="5" y2="-14" stroke-width="2" />
    </g>
  </g>

  <!-- Step 3: $100+ (Production / Maintenance Crisis) -->
  <g transform="translate(620, 630)">
    <!-- Column Bar -->
    <rect x="-65" y="-410" width="130" height="410" rx="12" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="3.5" />
    <!-- Cost Label $100+ -->
    <text x="0" y="-425" font-family="-apple-system, sans-serif" font-size="38" font-weight="900" fill="#ef4444" text-anchor="middle">$100+</text>
    <!-- Stage Dot with Pulse -->
    <circle cx="0" cy="-410" r="14" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="0" cy="-410" r="8" fill="#ef4444" />
    <!-- Subtle icon: Warning alert flame/bug -->
    <g transform="translate(0, -205)" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M 0 -30 L 25 18 L -25 18 Z" fill="rgba(239, 68, 68, 0.1)" stroke-linejoin="round" />
      <line x1="0" y1="-14" x2="0" y2="0" stroke-width="3.5" />
      <circle cx="0" cy="9" r="2" fill="#ef4444" />
    </g>
  </g>
</svg>
