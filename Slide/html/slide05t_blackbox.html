<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-5-%E7%AB%A0%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E7%AD%89%E5%83%B9%E5%88%86%E5%89%B2%E8%88%87%E5%B1%AC%E6%80%A7%E5%9F%BA%E7%A4%8E%E6%B8%AC%E8%A9%A6-pbt">第 5 章：黑箱測試、等價分割與屬性基礎測試 (PBT)</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>系統內部就像一個黑盒子，我們不探究它「如何做」，<br />
而是嚴格驗證它在各種極端輸入下，究竟「做了什麼」。<br />
錯誤永遠隱藏在角落——掌握邊界與等價，方能以最小成本擊中最多缺陷。</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="[◄](#1) 本章大綱 (Outline) [►](#3)" data-footer="Ch05 黑箱測試" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:[◄](#1) 本章大綱 (Outline) [►](#3);--footer:Ch05 黑箱測試;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#1">◄</a> 本章大綱 (Outline) <a href="#3">►</a></header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%AD-%E8%BC%B8%E5%85%A5%E5%9F%9F%E5%8A%83%E5%88%86%E8%88%87%E7%B6%93%E5%85%B8%E6%96%B9%E6%B3%95"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 輸入域劃分與經典方法</h3>
<ul>
<li><strong>5.1 黑箱測試概念與 JUnit 5 斷言</strong>：
<ul>
<li>黑箱測試概念架構：輸入、受測系統 (SUT) 與輸出驗證</li>
<li>JUnit 5 斷言陷阱：<code>assertEquals</code> (內容) vs. <code>assertSame</code> (參照)</li>
</ul>
</li>
<li><strong>5.2 邊界值分析 (Boundary Value Analysis, BVA)</strong>：
<ul>
<li>「錯誤隱藏在角落」：單一錯誤假設與邊界點選取</li>
<li>獨立型 (4n+1 / 6n+1) vs. 非獨立最壞情況 (5ⁿ / 7ⁿ)</li>
</ul>
</li>
<li><strong>5.3 等價類分割測試 (Equivalence Partitioning, EP)</strong>：
<ul>
<li>有效等價類與無效等價類；輸入劃分與輸出反推</li>
<li>弱一般/弱強固 (Weak) vs. 強一般/強強固 (Strong 笛卡爾積)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%90-%E7%B5%84%E5%90%88%E5%84%AA%E5%8C%96%E8%88%87%E5%89%8D%E6%B2%BF%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 組合優化與前沿測試</h3>
<ul>
<li><strong>5.4 全成對組合測試 (Pairwise / All-Pairs)</strong>：
<ul>
<li>2-Way 交互作用理論（NIST 研究）與交錯法推導</li>
<li>正交表 (OATS) vs. Pairwise 工具 (PICT / ACTS)</li>
</ul>
</li>
<li><strong>5.5 測試案例優化與 5.6 決策表測試 (CAR)</strong>：
<ul>
<li>條件樁、動作樁、規則展開與布林邏輯規則化簡</li>
</ul>
</li>
<li><strong>5.7 狀態轉換測試 (State Transition Testing)</strong>：
<ul>
<li>事件驅動狀態機、狀態覆蓋 vs. 轉移覆蓋、物件狀態斷言</li>
</ul>
</li>
<li><strong>5.8 屬性基礎測試 (Property-Based Testing, PBT)</strong>：
<ul>
<li>典範轉移：數學不變量、jqwik 自動隨機測資與測資收縮 (Shrinking)</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8)" data-footer="Ch05 黑箱測試" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="3" style="--paginate:true;--header:[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8);--footer:Ch05 黑箱測試;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.1 黑箱測試概念與 JUnit 5 斷言 <a href="#8">►</a></header>

<h1 id="51-%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E6%A6%82%E5%BF%B5%E8%88%87-junit-5-%E6%96%B7%E8%A8%80"><strong>5.1 黑箱測試概念與 JUnit 5 斷言</strong></h1>
<blockquote>
<p>「不窺探程式碼內部結構，<br />
純粹依據規格契約驗證系統外顯行為。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.1 黑箱測試概念與 JUnit 5 斷言 <a href="#8">►</a></header>

<h2 id="%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6-black-box-testing-%E6%A6%82%E5%BF%B5%E6%9E%B6%E6%A7%8B">黑箱測試 (Black-Box Testing) 概念架構</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 黑箱測試（功能測試/規格測試）聚焦於系統「做什麼 (What)」，而非「如何做 (How)」。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%93%A6-%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E4%B8%89%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E4%BB%B6"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 黑箱測試三大核心要件</h3>
<ul>
<li><strong>1. 測試輸入 (Input Data)</strong>：
<ul>
<li>涵蓋合法資料 (Valid Inputs)、邊界極端值 (Boundary Values) 與格式錯誤的非法資料 (Invalid Inputs)。</li>
</ul>
</li>
<li><strong>2. 受測系統 (System Under Test, SUT)</strong>：
<ul>
<li>內部原始碼與資料結構對測試人員隱藏（不透明黑盒），完全依據介面規格操作。</li>
</ul>
</li>
<li><strong>3. 輸出驗證 (Expected vs. Actual Output)</strong>：
<ul>
<li>比對實際輸出與需求規格所定義之預期結果是否完全吻合。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/black_box_testing_concept.jpg" alt="Black-Box Testing" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:[◄](#2) 5.1 黑箱測試概念與 JUnit 5 斷言 [►](#8);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.1 黑箱測試概念與 JUnit 5 斷言 <a href="#8">►</a></header>

<h2 id="junit-5-%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E5%9F%BA%E7%A4%8E%E8%88%87%E6%96%B7%E8%A8%80%E6%A9%9F%E5%88%B6">JUnit 5 單元測試基礎與斷言機制</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Java 單元測試中最經典的踩坑陷阱：內容等價性與物件同一性的本質差別。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%96%EF%B8%8F-assertequals%E5%85%A7%E5%AE%B9%E5%80%BC%E7%AD%89%E5%83%B9-value-equality"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> assertEquals：內容值等價 (Value Equality)</h3>
<ul>
<li><strong>運作原理</strong>：
<ul>
<li>內部呼叫物件的 <code>a.equals(b)</code> 方法。</li>
</ul>
</li>
<li><strong>檢驗標的</strong>：
<ul>
<li>兩個物件內部的「內容資料」是否相等。</li>
</ul>
</li>
<li><strong>適用情境</strong>：
<ul>
<li>字串內容比對、自訂資料物件 (DTO)、數字運算結果驗證。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">s1</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(<span class="hljs-string">&quot;SQA&quot;</span>);
<span class="hljs-type">String</span> <span class="hljs-variable">s2</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(<span class="hljs-string">&quot;SQA&quot;</span>);
assertEquals(s1, s2); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (內容相同)</span>
</code></pre>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-assertsame%E8%A8%98%E6%86%B6%E9%AB%94%E5%90%8C%E4%B8%80%E6%80%A7-reference"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> assertSame：記憶體同一性 (Reference)</h3>
<ul>
<li><strong>運作原理</strong>：
<ul>
<li>內部比對記憶體指標位址（即 <code>a == b</code>）。</li>
</ul>
</li>
<li><strong>檢驗標的</strong>：
<ul>
<li>兩個參照變數是否指向 Heap 中的「同一記憶體實體」。</li>
</ul>
</li>
<li><strong>適用情境</strong>：
<ul>
<li>單例模式 (Singleton)、快取池重用、工廠實體驗證。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">assertSame(s1, s2);   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 失敗 (不同記憶體物件)</span>
<span class="hljs-type">String</span> <span class="hljs-variable">s3</span> <span class="hljs-operator">=</span> s1;
assertSame(s1, s3);   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (指向同一位址)</span>
</code></pre>
</li>
</ul>
</div>
</div>
</div>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 1)</strong></h4>
<p><strong>問題情境</strong>：<br />
【是非題】在 JUnit 單元測試中，<code>assertSame(a, b)</code> 斷言的作用與 <code>assertEquals(a, b)</code> 完全相同，兩者都是在驗證兩個物件的內容值是否相等（即比對 <code>a.equals(b)</code>）。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>
</div>

<img src="../../img/ch05/sqa-ch05-ccq1.png" alt="CCQ1 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch05-ccq1">課堂互動</a></p>

<h1 id="52-%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90-bva"><strong>5.2 邊界值分析 (BVA)</strong></h1>
<blockquote>
<p>「錯誤都隱藏在角落！<br />
大多數的程式缺陷，都發生在邊界條件差之毫釐的瞬間。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.2 邊界值分析 (BVA) [►](#16)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:[◄](#2) 5.2 邊界值分析 (BVA) [►](#16);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.2 邊界值分析 (BVA) <a href="#16">►</a></header>

<h2 id="%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90-bva-%E6%A0%B8%E5%BF%83%E5%93%B2%E5%AD%B8">邊界值分析 (BVA) 核心哲學</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體工程界公認：輸入範圍的邊緣（極大值、極小值）比中間值更容易觸發 Off-by-one 缺陷。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%A9-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%8C%AF%E8%AA%A4%E9%9A%B1%E8%97%8F%E5%9C%A8%E8%A7%92%E8%90%BD"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> 為什麼錯誤隱藏在角落？</h3>
<ul>
<li><strong>運算子誤用陷阱</strong>：
<ul>
<li>程式設計師常在 <code>&lt;</code> 與 <code>&lt;=</code>、<code>&gt;</code> 與 <code>&gt;=</code> 之間犯錯。</li>
</ul>
</li>
<li><strong>程式碼良劣對照</strong>：
<table>
<thead>
<tr>
<th style="text-align:left">程式碼寫法</th>
<th style="text-align:left">缺陷本質</th>
<th style="text-align:left">測試結果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>if (input &lt;= 10)</code></td>
<td style="text-align:left">無缺陷，邊界完整包含</td>
<td style="text-align:left">input=10 通過</td>
</tr>
<tr>
<td style="text-align:left"><code>if (input &lt; 10)</code></td>
<td style="text-align:left">致命缺陷：10 被遺漏</td>
<td style="text-align:left"><strong>input=10 測試失敗</strong></td>
</tr>
</tbody>
</table>
</li>
<li><strong>結論</strong>：測試邊界點能以極高精準度曝光邊界比較缺陷。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%96%AE%E4%B8%80%E9%8C%AF%E8%AA%A4%E5%81%87%E8%A8%AD-single-fault-assumption"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 單一錯誤假設 (Single Fault Assumption)</h3>
<ul>
<li><strong>核心假設前提</strong>：
<ul>
<li>在獨立變數系統中，絕大多數錯誤只需單一變數發生邊界異常即可彰顯，無需多個變數同時在邊界出錯。</li>
</ul>
</li>
<li><strong>取樣五大關鍵點</strong>：
<ul>
<li>對於範圍 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="10.866ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 4802.7 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="5B" d="M118 -250V750H255V710H158V-210H255V-250H118Z"></path></g><g data-mml-node="mi" transform="translate(278,0)"><path data-c="1D45A" d="M21 287Q22 293 24 303T36 341T56 388T88 425T132 442T175 435T205 417T221 395T229 376L231 369Q231 367 232 367L243 378Q303 442 384 442Q401 442 415 440T441 433T460 423T475 411T485 398T493 385T497 373T500 364T502 357L510 367Q573 442 659 442Q713 442 746 415T780 336Q780 285 742 178T704 50Q705 36 709 31T724 26Q752 26 776 56T815 138Q818 149 821 151T837 153Q857 153 857 145Q857 144 853 130Q845 101 831 73T785 17T716 -10Q669 -10 648 17T627 73Q627 92 663 193T700 345Q700 404 656 404H651Q565 404 506 303L499 291L466 157Q433 26 428 16Q415 -11 385 -11Q372 -11 364 -4T353 8T350 18Q350 29 384 161L420 307Q423 322 423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 181Q151 335 151 342Q154 357 154 369Q154 405 129 405Q107 405 92 377T69 316T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mi" transform="translate(1156,0)"><path data-c="1D456" d="M184 600Q184 624 203 642T247 661Q265 661 277 649T290 619Q290 596 270 577T226 557Q211 557 198 567T184 600ZM21 287Q21 295 30 318T54 369T98 420T158 442Q197 442 223 419T250 357Q250 340 236 301T196 196T154 83Q149 61 149 51Q149 26 166 26Q175 26 185 29T208 43T235 78T260 137Q263 149 265 151T282 153Q302 153 302 143Q302 135 293 112T268 61T223 11T161 -11Q129 -11 102 10T74 74Q74 91 79 106T122 220Q160 321 166 341T173 380Q173 404 156 404H154Q124 404 99 371T61 287Q60 286 59 284T58 281T56 279T53 278T49 278T41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mi" transform="translate(1 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mi" transform="translate(3952.7,0)"><path data-c="1D465" d="M52 289Q59 331 106 386T222 442Q257 442 286 424T329 379Q371 442 430 442Q467 442 494 420T522 361Q522 332 508 314T481 292T458 288Q439 288 427 299T415 328Q415 374 465 391Q454 404 425 404Q412 404 406 402Q368 386 350 336Q290 115 290 78Q290 50 306 38T341 26Q378 26 414 59T463 140Q466 150 469 151T485 153H489Q504 153 504 145Q504 144 502 134Q486 77 440 33T333 -11Q263 -11 227 52Q186 -10 133 -10H127Q78 -10 57 16T35 71Q35 103 54 123T99 143Q142 143 142 101Q142 81 130 66T107 46T94 41L91 40Q91 39 97 36T113 29T132 26Q168 26 194 71Q203 87 217 139T245 247T261 313Q266 340 266 352Q266 380 251 392T217 404Q177 404 142 372T93 290Q91 281 88 280T72 278H58Q52 284 52 289Z"></path></g><g data-mml-node="mo" transform="translate(4524.7,0)"><path data-c="5D" d="M22 710V750H159V-250H22V-210H119V710H22Z"></path></g></g></g></svg></mjx-container>，測試點取：
<ul>
<li><strong><code>min</code></strong> (最小值)</li>
<li><strong><code>min+</code></strong> (略大於最小值)</li>
<li><strong><code>norm</code></strong> (區間內正常代表值)</li>
<li><strong><code>max-</code></strong> (略小於最大值)</li>
<li><strong><code>max</code></strong> (最大值)</li>
</ul>
</li>
</ul>
</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.2 邊界值分析 (BVA) [►](#16)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:[◄](#2) 5.2 邊界值分析 (BVA) [►](#16);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.2 邊界值分析 (BVA) <a href="#16">►</a></header>

<h2 id="%E7%8D%A8%E7%AB%8B%E5%9E%8B%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A64n--1-%E5%85%AC%E5%BC%8F">獨立型邊界測試：4n + 1 公式</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 針對 n 個彼此獨立的輸入變數，每次只讓 1 個變數處於邊界，其餘變數皆維持正常值 (norm)。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-4n--1-%E8%A8%88%E7%AE%97%E5%8E%9F%E7%90%86"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 4n + 1 計算原理</h3>
<ul>
<li><strong>每個變數貢獻 4 個邊界案例</strong>：
<ul>
<li><code>min</code>, <code>min+</code>, <code>max-</code>, <code>max</code>（此時其他 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="5.254ex" height="1.692ex" role="img" focusable="false" viewBox="0 -666 2322.4 748"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g><g data-mml-node="mo" transform="translate(822.2,0)"><path data-c="2212" d="M84 237T84 250T98 270H679Q694 262 694 250T679 230H98Q84 237 84 250Z"></path></g><g data-mml-node="mn" transform="translate(1822.4,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g></g></g></svg></mjx-container> 個變數皆取 <code>norm</code>）。</li>
</ul>
</li>
<li><strong>加上 1 個全員正常中心點</strong>：
<ul>
<li>所有 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="1.357ex" height="1.025ex" role="img" focusable="false" viewBox="0 -442 600 453"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> 個變數皆取 <code>norm</code> 的基準案例。</li>

<header><a href="#2">◄</a> 5.2 邊界值分析 (BVA) <a href="#16">►</a></header>

<h2 id="%E7%8D%A8%E7%AB%8B%E5%9E%8B%E5%BC%B7%E5%9B%BA%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A66n--1-%E5%85%AC%E5%BC%8F">獨立型強固邊界測試：6n + 1 公式</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 強固邊界測試 (Robust BVA) 擴充考慮「極限例外值」，驗證系統遭遇非法越界時的防禦容錯力。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%BC%95%E5%85%A5%E4%BE%8B%E5%A4%96%E9%82%8A%E7%95%8C-min--max"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 引入例外邊界 (min-, max+)</h3>
<ul>
<li><strong>每個變數擴充為 6 個邊界點</strong>：
<ul>
<li><strong><code>min-</code></strong> (略小於合法下界，如 0) ➔ 觸發例外</li>
<li><code>min</code> (下界 1)、<code>min+</code> (2)</li>
<li><code>max-</code> (199)、<code>max</code> (上界 200)</li>
<li><strong><code>max+</code></strong> (略大於合法上界，如 201) ➔ 觸發例外</li>
</ul>
</li>

<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 2)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】假設某個受測方法接受 3 個彼此獨立的連續數值輸入參數。若採用「獨立型強固邊界測試 (Independent Robust BVA)」，其設計出的測試案例數量應為多少？</p>
<ul>
<li><strong>A)</strong> 13 個</li>
<li><strong>B)</strong> 19 個</li>
<li><strong>C)</strong> 125 個</li>
<li><strong>D)</strong> 343 個</li>
</ul>

<h1 id="53-%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E6%B8%AC%E8%A9%A6-ep"><strong>5.3 等價類分割測試 (EP)</strong></h1>
<blockquote>
<p>「把無限的輸入空間劃分為有限的等價群組；<br />
測試其中一個代表，就等於測試了整個群體。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.3 等價類分割測試 (EP) [►](#23)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:[◄](#2) 5.3 等價類分割測試 (EP) [►](#23);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.3 等價類分割測試 (EP) <a href="#23">►</a></header>

<h2 id="%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E6%B8%AC%E8%A9%A6-equivalence-partitioning">等價類分割測試 (Equivalence Partitioning)</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 等價類的核心定義：同一個群組內的任意資料，若一個能找出 Bug，其他也必定能找出 Bug。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%A9-%E7%AD%89%E5%83%B9%E5%88%86%E5%89%B2%E6%A0%B8%E5%BF%83%E5%8B%95%E6%A9%9F"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 等價分割核心動機</h3>
<ul>
<li><strong>達成完整測試</strong>：確保每個業務分支與邏輯區間都有代表被測試到，避免盲區。</li>
<li><strong>消除冗餘重複</strong>：在同一個等價區間內測試 100 次只是浪費時間，挑選 1 個代表即可。</li>
<li><strong>兩大等價類別</strong>：
<ul>
<li><strong>有效等價類 (Valid Class)</strong>：符合規格的合理合法輸入集合。</li>
<li><strong>無效等價類 (Invalid Class)</strong>：超出範圍或格式異常的非法集合。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%8A%83%E5%88%86%E7%B6%AD%E5%BA%A6%E8%88%87%E6%8A%80%E5%B7%A7"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 劃分維度與技巧</h3>

<li><strong>依輸入劃分</strong>：
<ul>

</blockquote>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3">概念核對問答 (CCQ 3)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 3)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】在等價類分割測試 (Equivalence Partitioning) 中，「弱涵蓋 (Weak Coverage)」與「強涵蓋 (Strong Coverage)」分類法的主要區別是什麼？</p>
<ul>
<li><strong>A)</strong> 弱涵蓋只測試有效等價類，而強涵蓋同時涵蓋有效與無效等價類</li>
<li><strong>B)</strong> 弱涵蓋基於單一錯誤假設（各等價類代表至少被測試一次），而強涵蓋基於多重錯誤假設（測試所有等價類的笛卡爾積全組合）</li>
<li><strong>C)</strong> 弱涵蓋不需要需求規格書，而強涵蓋必須完全依照 SRS 執行</li>
<li><strong>D)</strong> 弱涵蓋產生的測試案例數量一定比強涵蓋更多</li>
</ul>
</div>

全成對測試用數學奇蹟，抓出 90% 的交互作用缺陷。」</p>

<h2 id="%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8%E9%9B%A3%E9%A1%8C%E8%88%87-2-way-%E4%BA%A4%E4%BA%92%E4%BD%9C%E7%94%A8%E7%90%86%E8%AB%96">組合爆炸難題與 2-Way 交互作用理論</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 美國國家標準與技術研究院 (NIST) 研究：軟體系統中絕大多數缺陷皆由「單一變數」或「雙變數配對」所觸發。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A5-%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8%E7%9A%84%E6%AE%98%E9%85%B7%E7%8F%BE%E5%AF%A6"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 組合爆炸的殘酷現實</h3>
<ul>
<li><strong>多參數系統的災難</strong>：
<ul>
<li>假設系統有 10 個參數，每個參數各有 3 種可能值。</li>

<h3 id="%F0%9F%8E%AF-nist-%E5%AF%A6%E8%AD%89%E7%B6%93%E9%A9%97%E8%88%87%E6%88%90%E5%B0%8D%E5%81%87%E8%A8%AD"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> NIST 實證經驗與成對假設</h3>
<ul>
<li><strong>2-Way 交互作用理論</strong>：
<ul>
<li><strong>67% ~ 93%</strong> 的缺陷只要任意 2 個參數的交互作用就會觸發。</li>
<li>需要 3 個以上參數交互觸發的罕見缺陷不足 10%。</li>
</ul>
</li>
<li><strong>Pairwise (All-Pairs) 原則</strong>：
<ul>
<li><strong>只要任意兩個參數的所有可能取值組合都至少出現過一次即可</strong>！案例數從幾萬個劇降至數十個！</li>
</ul>
</li>
</ul>

<h2 id="%E5%85%A8%E6%88%90%E5%B0%8D%E6%B8%AC%E8%A9%A6%E5%B7%A5%E5%85%B7%E8%88%87%E6%94%BE%E6%AC%BE%E8%A8%88%E7%AE%97%E6%A1%88%E4%BE%8B">全成對測試工具與放款計算案例</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 求解最小 All-Pairs 測試集屬 NP-Hard 問題；現代工程皆採用高效率啟發式工具自動生成。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E4%B8%BB%E6%B5%81%E8%87%AA%E5%8B%95%E5%8C%96%E5%B7%A5%E5%85%B7"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 主流自動化工具</h3>
<ul>
<li><strong>PICT (微軟開源工具)</strong>：
<ul>
<li>最流行的命令列工具，支援自訂約束條件（Constraints）與權重。</li>
</ul>
</li>
<li><strong>ACTS (NIST 開源工具)</strong>：
<ul>
<li>Java 原生 JAR，支援高階 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="0.817ex" height="1.441ex" role="img" focusable="false" viewBox="0 -626 361 637"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D461" d="M26 385Q19 392 19 395Q19 399 22 411T27 425Q29 430 36 430T87 431H140L159 511Q162 522 166 540T173 566T179 586T187 603T197 615T211 624T229 626Q247 625 254 615T261 596Q261 589 252 549T232 470L222 433Q222 431 272 431H323Q330 424 330 420Q330 398 317 385H210L174 240Q135 80 135 68Q135 26 162 26Q197 26 230 60T283 144Q285 150 288 151T303 153H307Q322 153 322 145Q322 142 319 133Q314 117 301 95T267 48T216 6T155 -11Q125 -11 98 4T59 56Q57 64 57 83V101L92 241Q127 382 128 383Q128 385 77 385H26Z"></path></g></g></g></svg></mjx-container>-way 組合（如 3-way, 4-way）。</li>
</ul>
</li>
<li><strong>放款利率計算案例</strong>：
<ul>
<li>利率受貸款金額、償還年限、青年貸款、會員身分影響，透過 PICT 瞬間將數百個全乘積案例壓縮至 10 餘個高價值案例。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/loan_calculator.jpg" alt="Loan Calculator" /></p>
</div>
</div>
</div>

</section>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4">概念核對問答 (CCQ 4)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 4)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】全成對測試 (Pairwise / All-Pairs Testing) 能夠大幅縮減測試案例數量，其在軟體工程上的核心理論依據是什麼？</p>
<ul>
<li><strong>A)</strong> 軟體系統中的缺陷通常需要至少三個以上的參數交互作用才會觸發</li>
<li><strong>B)</strong> 絕大多數的軟體缺陷都是由「單一變數」或「任意兩個變數之間的交互作用 (2-way Interaction)」所引起的</li>
<li><strong>C)</strong> 配對測試是白箱測試的一種，可以直接涵蓋所有的程式碼分支路徑</li>
<li><strong>D)</strong> 成對測試可以保證 100% 涵蓋多變數系統的所有笛卡爾積組合</li>
</ul>
</div>

<h2 id="%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8B%E7%B2%BE%E5%AF%A6%E5%8C%96%E5%9B%9B%E5%A4%A7%E7%AD%96%E7%95%A5">測試案例精實化四大策略</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 面對數千個潛在案例，透過工程優化策略進行剪枝，保留最高殺傷力的測試子集。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9C%82%EF%B8%8F-1-%E5%88%86%E9%9B%A2%E4%BE%8B%E5%A4%96%E8%88%87-2-%E9%85%8D%E5%B0%8D%E7%B5%84%E5%90%88"><img class="emoji" draggable="false" alt="✂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2702.svg" data-marp-twemoji=""/> 1. 分離例外與 2. 配對組合</h3>
<ul>
<li><strong>分離等效例外</strong>：
<ul>
<li>若所有因子的非法輸入皆導向相同的錯誤處理（如拋出 400 錯誤），無需測試所有因子的例外排列組合，只需將例外抽取為獨立集合測試。</li>
</ul>
</li>
<li><strong>2-Way 配對組合</strong>：
<ul>
<li>將不相關的因子改以 Pairwise 方式結合，指數級案例瞬間降為多項式級。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-3-%E9%82%8A%E7%95%8C%E9%8E%96%E5%AE%9A%E8%88%87-4-fmea-%E9%A2%A8%E9%9A%AA%E5%84%AA%E5%85%88"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 3. 邊界鎖定與 4. FMEA 風險優先</h3>
<ul>
<li><strong>鎖定邊界替代隨機</strong>：
<ul>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5">概念核對問答 (CCQ 5)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 5)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】關於「正交表測試 (Orthogonal Array Testing, OATS)」與一般「全成對測試 (Pairwise Testing)」的比較，下列敘述何者正確？</p>
<ul>
<li><strong>A)</strong> 正交表測試是隨機產生的，而 Pairwise 必須透過數學嚴格推導</li>
<li><strong>B)</strong> 兩者都關注參數間的配對，但正交表更強調各因子組合的「均勻平衡性（正交性）」，而 Pairwise 僅要求任意兩因子的組合至少出現一次，因此案例數量通常更少且更有彈性</li>
<li><strong>C)</strong> 只要變數的個數相同，正交表與 Pairwise 產生的測試案例清單必定完全一致</li>
<li><strong>D)</strong> 正交表測試只能處理二分值（True/False）的變數組合</li>
</ul>
</div>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-6">概念核對問答 (CCQ 6)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-6"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 6)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】在軟體測試實務中，下列哪一種受測情境最適合優先採用「決策表測試 (Decision Table Testing)」來設計案例？</p>
<ul>
<li><strong>A)</strong> 系統輸入參數彼此完全獨立，且有連續性數值邊界</li>
<li><strong>B)</strong> 輸入參數之間存在複雜的商務邏輯與制約關係，不同的條件組合會觸發不同的系統動作或輸出結果</li>
<li><strong>C)</strong> 系統的輸出僅與目前輸入值有關，與輸入條件的組合邏輯無涉</li>
<li><strong>D)</strong> 系統的運作強烈依賴時間序列與物件歷史狀態的轉移</li>
</ul>
</div>

<h2 id="%E4%BA%8B%E4%BB%B6%E9%A9%85%E5%8B%95%E8%88%87%E7%8B%80%E6%85%8B%E6%A9%9F-state-machine-%E6%B8%AC%E8%A9%A6">事件驅動與狀態機 (State Machine) 測試</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 現代系統多為事件驅動 (Event-Driven)；測試重點在於：受到事件激發後，狀態轉換是否如預期反應。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%E2%9C%88%EF%B8%8F-%E8%88%AA%E7%A9%BA%E8%A8%82%E7%A5%A8%E7%8B%80%E6%85%8B%E6%A9%9F%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F"><img class="emoji" draggable="false" alt="✈️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2708.svg" data-marp-twemoji=""/> 航空訂票狀態機生命週期</h3>
<ul>

<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A3%EF%B8%8F-5-%E6%A2%9D%E5%85%A8%E8%BD%89%E7%A7%BB%E8%A6%86%E8%93%8B%E6%B8%AC%E8%A9%A6%E5%BA%8F%E5%88%97"><img class="emoji" draggable="false" alt="🛣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e3.svg" data-marp-twemoji=""/> 5 條全轉移覆蓋測試序列</h3>
<ul>
<li><strong>路徑 1</strong>：<code>giveInfo</code> ➔ <code>payMoney</code> ➔ <code>print</code> ➔ <code>giveTicket</code> (正常使用)</li>
<li><strong>路徑 2</strong>：<code>giveInfo</code> ➔ <code>payMoney</code> ➔ <code>print</code> ➔ <code>cancel</code> (開票後取消)</li>

<li><strong>路徑 4</strong>：<code>giveInfo</code> ➔ <code>cancel</code> (預約後取消)</li>
<li><strong>路徑 5</strong>：<code>giveInfo</code> ➔ <code>payTimeExpire</code> (逾期未付)</li>
</ul>
</div>

<header><a href="#2">◄</a> 5.7 狀態轉換測試 <a href="#44">►</a></header>

<h2 id="%E7%89%A9%E4%BB%B6%E7%8B%80%E6%85%8B%E6%B8%AC%E8%A9%A6stack-%E5%AF%A6%E6%88%B0">物件狀態測試：Stack 實戰</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 物件導向測試精髓：執行 void 動作（如 push/pop），斷言內部狀態變化（<code>isEmpty()</code>, <code>isFull()</code>）。</p>
</blockquote>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 測試狀態轉移至 isFull</span>
<span class="hljs-type">Stack</span> <span class="hljs-variable">s</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stack</span>(<span class="hljs-number">3</span>);
s.push(<span class="hljs-number">100</span>);
assertFalse(s.isFull()); <span class="hljs-comment">// 狀態：NotEmpty</span>
s.push(<span class="hljs-number">200</span>);
s.push(<span class="hljs-number">300</span>);
assertTrue(s.isFull());  <span class="hljs-comment">// 狀態轉移成功：isFull</span>

<span class="hljs-comment">// 測試在 isFull 狀態下再次 push 應拋出例外 (強固性)</span>
assertThrows(StackFullException.class, () -&gt; s.push(<span class="hljs-number">400</span>));
</code></pre>
<ul>
<li><strong>先設初始狀態，再激發事件</strong>：先 push 3 次建立滿狀態，再驗證越界拋錯。</li>
<li><strong>回歸狀態驗證</strong>：連續 pop 3 次後，斷言 <code>assertTrue(s.isEmpty())</code>。</li>
</ul>
</div>
<footer>Ch05 黑箱測試</footer>
</section>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-7">概念核對問答 (CCQ 7)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-7"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 7)</strong></h4>
<p><strong>問題情境</strong>：<br />
【單選題】在狀態測試 (State Testing) 中，關於「狀態覆蓋 (State Coverage)」與「轉移覆蓋 (Transition Coverage)」的強度關係，下列敘述何者正確？</p>
<ul>
<li><strong>A)</strong> 達到狀態覆蓋必定代表同時達到了轉移覆蓋</li>
<li><strong>B)</strong> 轉移覆蓋的強度大於狀態覆蓋；若測試案例達到了轉移覆蓋（驗證了所有可能的轉移路徑弧線），則必定已涵蓋了所有狀態節點</li>
<li><strong>C)</strong> 兩者互相獨立，沒有任何包含或強弱關係</li>
<li><strong>D)</strong> 狀態測試不需要考慮無效轉移（即在某狀態下輸入非法事件的系統反應）</li>
</ul>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 5.8 屬性基礎測試 (PBT) [►](#49)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:[◄](#2) 5.8 屬性基礎測試 (PBT) [►](#49);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.8 屬性基礎測試 (PBT) <a href="#49">►</a></header>

<h2 id="%E7%AF%84%E4%BE%8B%E6%B8%AC%E8%A9%A6-ebt-vs-%E5%B1%AC%E6%80%A7%E6%B8%AC%E8%A9%A6-pbt-%E5%85%B8%E7%AF%84%E8%BD%89%E7%A7%BB">範例測試 (EBT) vs. 屬性測試 (PBT) 典範轉移</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 從 Example-Based 走向 Property-Based：讓框架自動產生萬組極端隨機測資，尋找致命反例。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E5%82%B3%E7%B5%B1%E7%AF%84%E4%BE%8B%E6%B8%AC%E8%A9%A6-example-based"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 傳統範例測試 (Example-Based)</h3>
<ul>
<li><strong>手動設計特定案例</strong>：
<ul>
<li>挑選輸入 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.507ex" role="img" focusable="false" viewBox="0 -666 500 666"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g></g></svg></mjx-container> 與 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.554ex" role="img" focusable="false" viewBox="0 -665 500 687"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></svg></mjx-container>，斷言輸出必為 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.131ex" height="1.557ex" role="img" focusable="false" viewBox="0 -666 500 688"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path></g></g></g></svg></mjx-container>。</li>
</ul>
</li>
<li><strong>致命瓶頸</strong>：
<ul>
<li>覆蓋率高度取決於工程師的直覺與經驗；</li>
<li>極容易遺漏包含極大值、空字串、Unicode 特殊字元之極端漏洞。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%B2-%E5%B1%AC%E6%80%A7%E5%9F%BA%E7%A4%8E%E6%B8%AC%E8%A9%A6-property-based"><img class="emoji" draggable="false" alt="🎲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3b2.svg" data-marp-twemoji=""/> 屬性基礎測試 (Property-Based)</h3>
<ul>
<li><strong>定義通用不變量 (Invariant)</strong>：
<ul>
<li>不管輸入何值，加法必滿足「交換律 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="12.883ex" height="1.756ex" role="img" focusable="false" viewBox="0 -694 5694.4 776"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g><g data-mml-node="mo" transform="translate(751.2,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="mi" transform="translate(1751.4,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mo" transform="translate(2458.2,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mi" transform="translate(3514,0)"><path data-c="1D44F" d="M73 647Q73 657 77 670T89 683Q90 683 161 688T234 694Q246 694 246 685T212 542Q204 508 195 472T180 418L176 399Q176 396 182 402Q231 442 283 442Q345 442 383 396T422 280Q422 169 343 79T173 -11Q123 -11 82 27T40 150V159Q40 180 48 217T97 414Q147 611 147 623T109 637Q104 637 101 637H96Q86 637 83 637T76 640T73 647ZM336 325V331Q336 405 275 405Q258 405 240 397T207 376T181 352T163 330L157 322L136 236Q114 150 114 114Q114 66 138 42Q154 26 178 26Q211 26 245 58Q270 81 285 114T318 219Q336 291 336 325Z"></path></g><g data-mml-node="mo" transform="translate(4165.2,0)"><path data-c="2B" d="M56 237T56 250T70 270H369V420L370 570Q380 583 389 583Q402 583 409 568V270H707Q722 262 722 250T707 230H409V-68Q401 -82 391 -82H389H387Q375 -82 369 -68V230H70Q56 237 56 250Z"></path></g><g data-mml-node="mi" transform="translate(5165.4,0)"><path data-c="1D44E" d="M33 157Q33 258 109 349T280 441Q331 441 370 392Q386 422 416 422Q429 422 439 414T449 394Q449 381 412 234T374 68Q374 43 381 35T402 26Q411 27 422 35Q443 55 463 131Q469 151 473 152Q475 153 483 153H487Q506 153 506 144Q506 138 501 117T481 63T449 13Q436 0 417 -8Q409 -10 393 -10Q359 -10 336 5T306 36L300 51Q299 52 296 50Q294 48 292 46Q233 -10 172 -10Q117 -10 75 30T33 157ZM351 328Q351 334 346 350T323 385T277 405Q242 405 210 374T160 293Q131 214 119 129Q119 126 119 118T118 106Q118 61 136 44T179 26Q217 26 254 59T298 110Q300 114 325 217T351 328Z"></path></g></g></g></svg></mjx-container>」。</li>
</ul>
</li>
<li><strong>三大核心機制</strong>：
<ul>
<li><strong>1. 屬性 (Property)</strong>：永恆成立之數學真理。</li>
<li><strong>2. 生成器 (Generator)</strong>：自動產生數萬組隨機邊界資料。</li>
<li><strong>3. 測資收縮 (Shrinking)</strong>：遇錯自動簡化為極簡反例！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>

<header><a href="#2">◄</a> 5.8 屬性基礎測試 (PBT) <a href="#49">►</a></header>

<h2 id="jqwik-%E5%AF%A6%E6%88%B0%E8%88%87%E6%B8%AC%E8%B3%87%E6%94%B6%E7%B8%AE-shrinking-%E6%A9%9F%E5%88%B6">jqwik 實戰與測資收縮 (Shrinking) 機制</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當一萬筆測資中長度為 100 的亂碼陣列出錯時，PBT 框架能自動縮減為 <code>[0, -1]</code> 幫助工程師秒級除錯。</p>
</blockquote>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">import</span> net.jqwik.api.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AdditionProperties</span> {

    <span class="hljs-comment">// 測試加法交換律：a + b 必須等於 b + a (自動執行 1000 次隨機測試)</span>
    <span class="hljs-meta">@Property</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">additionIsCommutative</span><span class="hljs-params">(<span class="hljs-meta">@ForAll</span> <span class="hljs-type">int</span> a, <span class="hljs-meta">@ForAll</span> <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-type">int</span> <span class="hljs-variable">result1</span> <span class="hljs-operator">=</span> a + b;
        <span class="hljs-type">int</span> <span class="hljs-variable">result2</span> <span class="hljs-operator">=</span> b + a;
        <span class="hljs-keyword">assert</span> result1 == result2;
    }

    <span class="hljs-comment">// 測試恆等律：任何整數加上 0 必須等於自己</span>
    <span class="hljs-meta">@Property</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">additionWithZeroHasNoEffect</span><span class="hljs-params">(<span class="hljs-meta">@ForAll</span> <span class="hljs-type">int</span> a)</span> {
        <span class="hljs-keyword">assert</span> a + <span class="hljs-number">0</span> == a;
    }
}
</code></pre>
<ul>
<li><strong><code>@Property</code></strong>：宣告屬性測試；<strong><code>@ForAll</code></strong>：自動注入極大整數、負數與零。</li>
</ul>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="[◄](#2) 5.8 屬性基礎測試 (PBT) [►](#49)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:[◄](#2) 5.8 屬性基礎測試 (PBT) [►](#49);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 5.8 屬性基礎測試 (PBT) <a href="#49">►</a></header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-8">概念核對問答 (CCQ 8)</h2>

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-8"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 8)</strong></h4>
<p><strong>問題情境</strong>：<br />
【是非題】在屬性基礎測試 (Property-Based Testing, PBT) 中，我們不需要手動為每一組測試寫出確切的預期輸出數值，而是定義程式執行時必須永遠維持的「屬性或不變量 (Invariants)」，並交由測試框架隨機生成大量測資來自動尋找反例。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>

<script>
(function() {
  function initHeaderDropdown() {
    const sections = [];
    const seenTitles = new Set();
    const slideSections = document.querySelectorAll("section[id]");
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(sec => {
      const header = sec.querySelector("header");
      if (!header) return;
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      const wrapper = document.createElement("span");
      wrapper.className = "header-nav-wrapper";
      
      const titleSpan = document.createElement("span");
      titleSpan.className = "header-nav-title";
      titleSpan.title = "點擊固定或懸停查看所有章節快速跳轉";
      titleSpan.innerHTML = currentTitle + "<span class=\"nav-caret\"> ▾</span>";
      
      titleSpan.addEventListener("click", function(e) {
        e.stopPropagation();
        const wasOpen = wrapper.classList.contains("is-open");
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(w => w.classList.remove("is-open"));
        if (!wasOpen) {
          wrapper.classList.add("is-open");
        }
      });
      
      const dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      dropdown.addEventListener("click", function(e) {
        e.stopPropagation();
      });
      
      const dropHeader = document.createElement("div");
      dropHeader.className = "nav-dropdown-header";
      dropHeader.innerHTML = "<span>📑 快速跳轉章節目錄</span><span style=\"font-size:11px;font-weight:normal;color:#64748b;\">共 " + sections.length + " 個章節</span>";
      dropdown.appendChild(dropHeader);
      
      const grid = document.createElement("div");
      grid.className = "nav-dropdown-grid";
      
      sections.forEach(s => {
        const item = document.createElement("a");
        const isActive = (s.title === currentTitle);
        item.className = "nav-dropdown-item" + (isActive ? " active" : "");
        item.href = "#" + s.id;
        item.innerHTML = "<span class=\"badge\">#" + s.id.padStart(2, "0") + "</span><span class=\"item-text\" title=\"" + s.title + "\">" + s.title + "</span>";
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(() => { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(w => w.classList.remove("is-open"));
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(sec => {
      const header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      const links = header.querySelectorAll("a");
      let prevLink = null;
      let nextLink = null;
      
      links.forEach(a => {
        const txt = a.textContent.trim();
        if (txt === "◄" || txt === "◀") prevLink = a;
        if (txt === "►" || txt === "▶") nextLink = a;
      });
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      if (prevLink) {
        prevLink.className = "header-nav-arrow";
        prevLink.title = "上一章節";
        header.appendChild(prevLink);
        header.appendChild(document.createTextNode(" "));
      }
      
      const wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
      
      if (nextLink) {
        header.appendChild(document.createTextNode(" "));
        nextLink.className = "header-nav-arrow";
        nextLink.title = "下一章節";
        header.appendChild(nextLink);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
