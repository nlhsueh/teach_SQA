<header>軟體品質保證 (SQA)</header>
<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<ul>
<li data-marpit-fragment="1"><strong>3.1 防禦性架構與合約設計 (DbC)</strong>：Bertrand Meyer 三大契約法則（前置、後置、類別不變量）、斷言 vs. 例外。</li>
<li data-marpit-fragment="2"><strong>3.2 ISTQB 7 大測試經典原則</strong>：測試顯示缺陷存在、窮盡不可能、及早測試、缺陷群聚、殺蟲劑悖論、測試取決上下文、無錯謬誤，及 AI 時代警示。</li>
<li data-marpit-fragment="3"><strong>3.3 測試多維度分類體系</strong>：驗證 vs. 確認、黑箱 vs. 白箱、單元/整合/系統、Martin Fowler 實戰測試金字塔。</li>

</ul>

<header>3.1 防禦性架構與合約設計</header>
<h2 id="311-%E5%A5%91%E7%B4%84%E5%BC%8F%E8%A8%AD%E8%A8%88%E7%9A%84%E4%B8%89%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E7%B4%A0-bertrand-meyer">3.1.1 契約式設計的三大核心要素 (Bertrand Meyer)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dc.svg" data-marp-twemoji=""/> <strong>Preconditions (前置條件 - <code>requires</code>)</strong>：
<ul>
<li data-marpit-fragment="2">呼叫者 (Caller) 必須滿足的條件；若不滿足，被呼叫方法有權<strong>直接拒絕執行</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Postconditions (後置條件 - <code>ensures</code>)</strong>：
<ul>
<li data-marpit-fragment="4">方法正常執行完畢後，向呼叫者<strong>保證達成的狀態與輸出結果</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>Class Invariants (類別不變量 - <code>maintains</code>)</strong>：
<ul>
<li data-marpit-fragment="6">物件在任何公開方法執行前後，必須<strong>永遠維持為真的核心業務法則</strong>（如銀行帳戶 <code>balance &gt;= 0</code>、<code>totalDeposits == sum(transactions)</code>）。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>狀態不變量的重要性</strong>：
<ul>
<li data-marpit-fragment="8">任何操作若破壞了不變量，系統應立即自我熔斷，避免髒資料寫入資料庫。</li>
<li data-marpit-fragment="9">這是現代<strong>屬性基礎測試 (Property-Based Testing)</strong> 的核心基石！</li>
</ul>
</li>
</ul>

<header>3.1 防禦性架構與合約設計</header>
<h2 id="312-%E6%96%B7%E8%A8%80-assertion-vs-%E4%BE%8B%E5%A4%96%E8%99%95%E7%90%86-exception">3.1.2 斷言 (Assertion) vs 例外處理 (Exception)</h2>
<table>
<thead>
<tr>
<th style="text-align:left">機制</th>
<th style="text-align:left">目的</th>
<th style="text-align:left">適用時機</th>
<th style="text-align:left">生產環境行為</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>斷言 (Assertion)</strong></td>
<td style="text-align:left">捕捉「程式設計師自身的邏輯 Bug」或內部不變量</td>
<td style="text-align:left">私有方法參數檢查、演算法內部狀態、不可能到達的分支</td>
<td style="text-align:left">可被 <code>-ea</code> / <code>-da</code> 開關啟用或關閉</td>
</tr>
<tr>
<td style="text-align:left"><strong>例外 (Exception)</strong></td>
<td style="text-align:left">處理「執行時外部可預期的異常環境」</td>
<td style="text-align:left">公開 API 參數驗證、網路中斷、檔案不存在、使用者輸入錯誤</td>
<td style="text-align:left">永遠處於啟用狀態，需有明確捕獲處理</td>
</tr>
</tbody>
</table>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>核心界線</strong>：
<ul>
<li data-marpit-fragment="2">外部環境不穩定與非法使用者輸入 ➔ 使用 <strong>例外 (Exception)</strong>。</li>
<li data-marpit-fragment="3">內部程式設計邏輯與不可違反的約束 ➔ 使用 <strong>斷言 (Assertion)</strong>。</li>
</ul>
</li>
</ul>

<h2 id="%E6%AC%8A%E5%A8%81%E6%A8%99%E6%BA%96%E8%88%87-istqb-7-%E5%A4%A7%E7%B6%93%E5%85%B8%E5%8E%9F%E5%89%87%E7%B8%BD%E8%A6%BD">權威標準與 ISTQB 7 大經典原則總覽</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4da.svg" data-marp-twemoji=""/> <strong>國際權威文獻與標準</strong>：
<ul>
<li data-marpit-fragment="2"><strong>ISTQB CTFL v4.0</strong>：Certified Tester Foundation Level Syllabus (2023)</li>
<li data-marpit-fragment="3"><strong>Glenford J. Myers</strong>：《The Art of Software Testing》（軟體測試藝術經典）</li>
<li data-marpit-fragment="4"><strong>Martin Fowler</strong>：The Practical Test Pyramid (2018)</li>
</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9ed.svg" data-marp-twemoji=""/> <strong>ISTQB 7 大經典測試原則</strong>：
<ol>
<li>測試顯示缺陷的存在 (Testing shows presence of defects)</li>
<li>窮盡測試是不可能的 (Exhaustive testing is impossible)</li>
<li>及早測試 / 測試左移 (Early testing saves time and money)</li>
<li>缺陷群聚效應 (Defects cluster together)</li>
<li>小心殺蟲劑悖論 (Beware of pesticide paradox)</li>
<li>測試取決於上下文 (Testing is context dependent)</li>
<li>無錯謬誤 (Absence-of-errors fallacy)</li>
</ol>
</li>
</ul>

<header>3.2 ISTQB 軟體測試 7 大經典原則</header>
<h2 id="%E5%8E%9F%E5%89%87-1%E6%B8%AC%E8%A9%A6%E9%A1%AF%E7%A4%BA%E7%BC%BA%E9%99%B7%E7%9A%84%E5%AD%98%E5%9C%A8%E8%80%8C%E9%9D%9E%E4%B8%8D%E5%AD%98%E5%9C%A8">原則 1：測試顯示缺陷的存在，而非不存在</h2>
<ul>
<li data-marpit-fragment="1"><strong>核心意涵</strong>：
<ul>
<li data-marpit-fragment="2">測試能夠證明軟體中**「存在缺陷」<strong>，但無論執行了多少萬筆測試且全部通過，都</strong>「無法證明軟體絕對零缺陷」**。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>測試的真正目的</strong>：
<ul>
<li data-marpit-fragment="4">測試不是為了證明程式完美無瑕，而是為了<strong>降低未被發現缺陷的風險</strong>，提供軟體品質的客觀度量與發布信心。</li>
</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> <strong>AI 時代警示【流暢性偏誤 (Fluency Bias)】</strong>：
<ul>
<li data-marpit-fragment="6">AI 生成的程式碼通常語法優美、排版工整，極易給人「絕對沒錯」的錯覺。</li>
<li data-marpit-fragment="7">但 AI 程式碼常潛伏並發競爭條件 (Race Conditions) 或隱蔽邊界例外，跑過幾次 Happy Path 綠燈絕不能保證其無錯！</li>
</ul>
</li>
</ul>
<footer>Ch03 軟體測試基礎</footer>

<header>3.2 ISTQB 軟體測試 7 大經典原則</header>
<h2 id="%E5%8E%9F%E5%89%87-4%E7%BC%BA%E9%99%B7%E7%BE%A4%E8%81%9A%E6%95%88%E6%87%89-defects-cluster-together">原則 4：缺陷群聚效應 (Defects Cluster Together)</h2>
<ul>
<li data-marpit-fragment="1"><strong>核心意涵（80/20 法則）</strong>：
<ul>
<li data-marpit-fragment="2">軟體系統中絕大多數的重大缺陷，往往高度集中在<strong>少數幾個複雜度最高、變更最頻繁、或涉及多方外部整合的模組中</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>工程實務啟示</strong>：
<ul>
<li data-marpit-fragment="4">當在某個模組發現了大量 Bug 時，不要以為抓完就沒事了；</li>
<li data-marpit-fragment="5">該模組很可能還潛伏著更多深層缺陷，應對其加大變異測試 (Mutation Testing) 與屬性測試力度！</li>
</ul>

<header>3.2 ISTQB 軟體測試 7 大經典原則</header>
<h2 id="%E5%8E%9F%E5%89%87-5%E5%B0%8F%E5%BF%83%E6%AE%BA%E8%9F%B2%E5%8A%91%E6%82%96%E8%AB%96-beware-of-pesticide-paradox">原則 5：小心殺蟲劑悖論 (Beware of Pesticide Paradox)</h2>
<ul>
<li data-marpit-fragment="1"><strong>核心意涵</strong>：
<ul>
<li data-marpit-fragment="2">同一種農藥噴久了，害蟲會產生抗藥性；</li>
<li data-marpit-fragment="3"><strong>同一套測試案例反覆跑久了，將無法再挖掘出任何新的 Bug！</strong></li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>SQA 2.0 的應對之道</strong>：
<ul>
<li data-marpit-fragment="5">測試案例必須定期審查、重構並動態演進。</li>
<li data-marpit-fragment="6">導入 <strong>屬性基礎測試 (Property-Based Testing / jqwik)</strong>：每次執行自動隨機生成萬組全新測資。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> <strong>AI 時代警示【自我印證的假綠燈】</strong>：
<ul>
<li data-marpit-fragment="8">若讓 AI 為自己生成的程式碼寫單元測試，AI 會<strong>依照自身錯誤的邏輯去設計測試</strong>，導致測試與程式碼「共同錯在同一個盲區」，產生極高強度的假安全感！</li>
</ul>
</li>
</ul>

<header>3.2 ISTQB 軟體測試 7 大經典原則</header>
<h2 id="%E5%8E%9F%E5%89%87-6%E6%B8%AC%E8%A9%A6%E5%8F%96%E6%B1%BA%E6%96%BC%E4%B8%8A%E4%B8%8B%E6%96%87-testing-is-context-dependent">原則 6：測試取決於上下文 (Testing is Context Dependent)</h2>
<ul>
<li data-marpit-fragment="1"><strong>核心意涵</strong>：
<ul>
<li data-marpit-fragment="2">世上沒有一套放之四海皆準的通用測試方法，測試策略必須依據領域風險客製化。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>實例對比</strong>：
<ul>

<header>3.2 ISTQB 軟體測試 7 大經典原則</header>
<h2 id="%E5%8E%9F%E5%89%87-7%E7%84%A1%E9%8C%AF%E8%AC%AC%E8%AA%A4-absence-of-errors-is-a-fallacy">原則 7：無錯謬誤 (Absence-of-Errors is a Fallacy)</h2>
<ul>
<li data-marpit-fragment="1"><strong>核心意涵</strong>：
<ul>
<li data-marpit-fragment="2"><strong>「零 Bug 的系統」並不等於「成功的系統」</strong>。</li>
<li data-marpit-fragment="3">即使團隊投入巨大資源修復了所有 Bug，但如果軟體<strong>根本沒有滿足使用者的真實業務需求</strong>，或者操作體驗極其反人類，這套軟體在商業與品質上依然是徹底失敗的。</li>
</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> <strong>AI 時代警示【Prompt 幻覺】</strong>：
<ul>
<li data-marpit-fragment="5">AI 產生的程式碼可能編譯 100% 通過且無語法錯誤，但若 Prompt 對領域規則（Domain Spec）理解有誤，產出的依然是「符合規格但無用的垃圾」。</li>
</ul>
</li>
</ul>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：某工程師使用 AI 秒速生成一套複雜利息計算演算法，隨即讓同一個 AI 幫忙生成單元測試。測試跑出 100% 覆蓋率全綠燈通過，但在實際上線後卻被金融主管機關判定年息公式違反法規。依據 ISTQB 測試原則，這最主要反映何種問題？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 測試工程師未安裝最新的 JDK 執行環境</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> AI 測試陷入「殺蟲劑悖論（自我印證盲區）」與「原則 7：無錯謬誤（程式碼無語法錯誤但偏離法規與真實業務需求）」</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 只要測試覆蓋率達 100%，系統必然在法律上具備合規性</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 這是硬體浮點數運算器的製造缺陷</p>
</div>

<h2 id="2-%E7%BC%BA%E5%A4%B1%E6%B8%AC%E8%A9%A6-vs-%E7%A2%BA%E8%AA%8D%E6%B8%AC%E8%A9%A6--3-%E9%9D%9C%E6%85%8B-vs-%E5%8B%95%E6%85%8B%E6%B8%AC%E8%A9%A6">2. 缺失測試 vs 確認測試 &amp; 3. 靜態 vs 動態測試</h2>
<ul>
<li data-marpit-fragment="1"><strong>缺失測試 (Defect Testing) vs 確認測試 (Validation Testing)</strong>：
<ul>
<li data-marpit-fragment="2"><strong>Defect Testing</strong>：目的在於「找出缺陷、搞壞系統」，採極端與破壞性邊界輸入。</li>
<li data-marpit-fragment="3"><strong>Validation Testing</strong>：目的在於「向客戶證明系統符合需求」，循序漸進驗證 Happy Path。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>靜態測試 (Static Testing) vs 動態測試 (Dynamic Testing)</strong>：
<ul>
<li data-marpit-fragment="5"><strong>靜態測試</strong>：<strong>不執行程式碼</strong>，透過人工審查、同行檢視、靜態語法樹分析（SonarQube, SpotBugs, PMD）。</li>
<li data-marpit-fragment="6"><strong>動態測試</strong>：<strong>實際執行程式碼</strong>，給定具體輸入並比對實際輸出與預期結果。</li>
</ul>
</li>
</ul>
<footer>Ch03 軟體測試基礎</footer>

<h2 id="4-%E5%8A%9F%E8%83%BD%E6%B8%AC%E8%A9%A6%E9%BB%91%E7%AE%B1-vs-%E7%B5%90%E6%A7%8B%E6%B8%AC%E8%A9%A6%E7%99%BD%E7%AE%B1">4. 功能測試（黑箱） vs 結構測試（白箱）</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4e6.svg" data-marp-twemoji=""/> <strong>黑箱測試 (Black-Box Testing - 規格導向)</strong>：
<ul>
<li data-marpit-fragment="2">受測系統為不透明的黑盒子，測試人員不檢視內部原始碼，僅依據需求規格 (SRS) 與邊界設計輸入，驗證輸出是否符合預期。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f52c.svg" data-marp-twemoji=""/> <strong>白箱測試 (White-Box Testing - 結構導向)</strong>：
<ul>
<li data-marpit-fragment="4">受測系統為透明的玻璃盒子，測試人員檢視內部程式邏輯，依據陳述句 (Statements)、分支 (Branches)、條件與路徑設計測資，追求高程式碼涵蓋率。</li>
</ul>
</li>
</ul>

<header>3.3 測試的多維度分類體系</header>
<h2 id="5-%E4%B8%89%E5%A4%A7%E6%A0%B8%E5%BF%83%E6%B8%AC%E8%A9%A6%E5%B1%A4%E7%B4%9A-testing-levels">5. 三大核心測試層級 (Testing Levels)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. Unit Testing (單元測試)</strong>：
<ul>
<li data-marpit-fragment="2">針對最小獨立模組或方法（Class / Method）進行隔離驗證，執行極快（毫秒級）。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>2. Integration Testing (整合測試)</strong>：
<ul>
<li data-marpit-fragment="4">驗證跨模組介面、微服務 API 與資料庫之間的通訊協定與資料傳遞。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>3. System Testing (系統測試)</strong>：
<ul>
<li data-marpit-fragment="6">在完整模擬或真實環境中執行端到端 (E2E) 使用者工作流程與非功能需求驗證。</li>
</ul>
</li>
</ul>

</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🔹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f539.svg" data-marp-twemoji=""/> <strong>中層：Integration / Service Tests (整合與服務測試)</strong>：

<header>3.4 V 開發模型與雙向追溯</header>
<h2 id="v-%E9%96%8B%E7%99%BC%E6%A8%A1%E5%9E%8B%E7%9A%84%E5%B0%8D%E7%A8%B1%E6%9E%B6%E6%A7%8B">V 開發模型的對稱架構</h2>
<ul>
<li data-marpit-fragment="1"><strong>左側下降臂（開發與規格階段）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>1. Requirements Analysis (需求分析 - SRS)</strong>：定義業務與使用者規格。</li>
<li data-marpit-fragment="3"><strong>2. High-Level Architecture (高階架構設計 - ADD)</strong>：定義子系統與介面協定。</li>
<li data-marpit-fragment="4"><strong>3. Detailed Component Design (詳細模組設計 - SDD)</strong>：定義單一類別與方法邏輯。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>底部頂點（程式實作 Coding）</strong>：
<ul>
<li data-marpit-fragment="6">將設計轉化為可執行的原始程式碼產物。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>右側上升臂（測試驗證階段）</strong>：
<ul>
<li data-marpit-fragment="8"><strong>Unit Testing (單元測試)</strong> ⟷ 對應驗證 <strong>詳細模組設計 (SDD)</strong>。</li>
<li data-marpit-fragment="9"><strong>Integration Testing (整合測試)</strong> ⟷ 對應驗證 <strong>高階架構設計 (ADD)</strong>。</li>
<li data-marpit-fragment="10"><strong>System / Acceptance Testing (驗收測試)</strong> ⟷ 對應驗證 <strong>需求規格 (SRS)</strong>。</li>
</ul>
</li>
</ul>

<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f517.svg" data-marp-twemoji=""/> <strong>水平雙向追溯線的價值</strong>：

</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4ca.svg" data-marp-twemoji=""/> <strong>雙向追溯矩陣 (Traceability Matrix)</strong>：

</li>

<h2 id="%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8B%E8%A6%8F%E6%A0%BC%E8%88%87%E7%A8%8B%E5%BC%8F%E8%A1%8C%E7%82%BA%E7%9A%84%E6%96%87%E6%B0%8F%E5%9C%96%E9%97%9C%E8%81%AF">測試案例、規格與程式行為的文氏圖關聯</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>規劃的行為 (Specified Behavior)</strong>：規格書明訂的預期行為。</li>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>程序化的行為 (Programmed Behavior)</strong>：實際被實作成 Code 的行為。</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>驗證的行為 (Verified Behavior)</strong>：測試案例實際涵蓋並驗證到的行為。</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>區域解析</strong>：
<ul>
<li data-marpit-fragment="5"><strong>區域 1 (黃金核心)</strong>：有規格、有實作、且有被測試驗證（健康目標！）。</li>
<li data-marpit-fragment="6"><strong>區域 2</strong>：規格有寫但工程師漏寫的未實作功能。</li>
<li data-marpit-fragment="7"><strong>區域 3</strong>：規格未要求，工程師擅自寫出但有被測到的功能。</li>
<li data-marpit-fragment="8"><strong>區域 6</strong>：規格未寫、未被測試、卻潛伏在程式中的**「未授權後門或隱蔽 Bug」**！</li>
</ul>
</li>
</ul>

<h2 id="%E9%9D%A2%E5%90%91%E4%B8%80who-%E8%AA%B0%E4%BE%86%E6%B8%AC%E8%A9%A6">面向一：Who 誰來測試？</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="👨‍💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f468-200d-1f4bb.svg" data-marp-twemoji=""/> <strong>開發工程師</strong>：單元測試 (Unit Test)、TDD、白箱路徑驗證。</li>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f465.svg" data-marp-twemoji=""/> <strong>結對夥伴 (Pair)</strong>：Pair Programming 即時程式碼審查與測試設計。</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <strong>專職 QA 團隊</strong>：Alpha Testing、自動化測試框架維護。</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="👔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f454.svg" data-marp-twemoji=""/> <strong>業務專家 (Domain Expert)</strong>：業務邏輯與驗收測試。</li>

<header>3.6 測試全景 3W2H 與 Test Oracle</header>
<h2 id="%E9%9D%A2%E5%90%91%E4%BA%8Cwhat-%E6%B8%AC%E4%BB%80%E9%BA%BC-%E9%9D%A2%E5%90%91%E4%B8%89why-%E7%82%BA%E4%BD%95%E6%B8%AC%E8%A9%A6">面向二：What 測什麼？&amp; 面向三：Why 為何測試？</h2>
<ul>
<li data-marpit-fragment="1"><strong>What 測什麼？</strong>
<ul>
<li data-marpit-fragment="2"><strong>功能測試</strong>：規格測試、等價劃分、邊界分析、欄位格式。</li>
<li data-marpit-fragment="3"><strong>結構測試</strong>：陳述句涵蓋、分支涵蓋、路徑涵蓋、MC/DC。</li>
<li data-marpit-fragment="4"><strong>情境測試 (Scenario)</strong>：模擬真實世界複雜連鎖使用者工作流程。</li>
<li data-marpit-fragment="5"><strong>非功能測試</strong>：負載 (Load)、耐力 (Soak)、資安 (Security)、相容性 (Compatibility)。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>Why 為何測試？</strong>
<ul>
<li data-marpit-fragment="7"><strong>風險驅動</strong>：變更風險、架構耦合風險、第三方依賴風險。</li>
<li data-marpit-fragment="8"><strong>合約與防禦驗證</strong>：確保狀態不變量與資源限制。</li>
<li data-marpit-fragment="9"><strong>迴歸測試 (Regression Testing)</strong>：確保新變更未破壞既有功能（Retest All, Selection, Prioritization）。</li>
</ul>
</li>
</ul>

<h2 id="%E9%9D%A2%E5%90%91%E5%9B%9Bhow-%E5%A6%82%E4%BD%95%E6%B8%AC%E8%A9%A6">面向四：How 如何測試？</h2>
<ul>
<li data-marpit-fragment="1"><strong>腳本測試 (Scripted Testing)</strong>：
<ul>
<li data-marpit-fragment="2">依預先定義之步驟與斷言自動化批量執行。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>探索性測試 (Exploratory Testing)</strong>：
<ul>
<li data-marpit-fragment="4">測試者邊學習系統邊動態設計測資，發揮工程直覺挖掘潛在弱點。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>猴子測試 / 隨機測試 (Monkey / Random Test)</strong>：
<ul>
<li data-marpit-fragment="6">注入大量隨機事件檢驗系統強固性與容錯力。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>錄製與回放 (Record &amp; Replay)</strong>：
<ul>
<li data-marpit-fragment="8">透過使用者操作軌跡錄製自動生成端到端測試腳本。</li>
</ul>
</li>
</ul>

<h2 id="%E9%9D%A2%E5%90%91%E4%BA%94how-to-evaluate-%E5%A6%82%E4%BD%95%E8%A9%95%E4%BC%B0%E9%80%9A%E9%81%8E%E8%88%87-test-oracle">面向五：How to Evaluate 如何評估通過？與 Test Oracle</h2>
<ul>
<li data-marpit-fragment="1"><strong>涵蓋率指標</strong>：語句、分支、路徑覆蓋率。</li>
<li data-marpit-fragment="2"><strong>變異分數 (Mutation Score)</strong>：使用 PIT 注入故障，檢驗測試套件殺死變異體的能力。</li>
<li data-marpit-fragment="3"><strong>什麼是 Test Oracle（測試預言機）？</strong>
<ul>
<li data-marpit-fragment="4">指<strong>能夠判斷受測程式輸出是否正確的機制或基準</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Test Oracle Comparator 比對架構</strong>：
<ul>
<li data-marpit-fragment="6">輸入同時餵入「受測程式 (PUT)」與「測試預言機 (Oracle)」，由斷言比對實際輸出與預期結果：
<ul>
<li data-marpit-fragment="7"><strong>Match (一致)</strong> ➔ 測試 <strong>PASS（通過 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/>）</strong></li>
<li data-marpit-fragment="8"><strong>Mismatch (不符)</strong> ➔ 測試 <strong>FAIL（缺陷判定 <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/>）</strong></li>
</ul>
</li>

</li>
</ul>

<h2 id="%E8%AA%B2%E5%A0%82%E4%BA%92%E5%8B%95%E5%8F%83%E8%80%83%E8%A7%A3%E7%AD%94">課堂互動參考解答</h2>
<ul>
<li data-marpit-fragment="1"><strong>CCQ 1（契約三要素之呼叫者責任）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>正確答案：A</strong></li>
<li data-marpit-fragment="3">前置條件 (Preconditions) 是呼叫者必須滿足的契約條件，用以保護被呼叫方法免於非法輸入；後置條件由被呼叫者保證；類別不變量為物件生命週期中必須維持之約束。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>CCQ 2（AI 測試全綠燈但違反法規）</strong>：
<ul>
<li data-marpit-fragment="5"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="6">AI 為自身生成之程式碼寫測試會陷入自我印證的殺蟲劑抗藥性；且程式碼無編譯錯誤不等於符合業務與法規需求（無錯謬誤）。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>CCQ 3（高階架構設計對應測試層級）</strong>：
<ul>
<li data-marpit-fragment="8"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="9">高階架構設計 (ADD) 定義子系統與模組間的 API 介面與資料傳遞協定，其直接對應的驗證層級為整合測試 (Integration Testing)。</li>
</ul>
</li>
<li data-marpit-fragment="10"><strong>short1（Test Oracle 難題破解）</strong>：
<ul>
<li data-marpit-fragment="11">利用變質關係（輸入微幅變換不變量）、差分比對（雙演算法對照）與裁判模型 (LLM-as-a-Judge) 突破無單一標準答案之瓶頸。</li>
</ul>
</li>
</ul>
