<header>2.1 臭蟲與錯誤</header>
<h2 id="211-%E8%87%AD%E8%9F%B2%E7%9A%84%E7%94%B1%E4%BE%86%E8%88%87-ieee-61012-%E5%AE%9A%E7%BE%A9">2.1.1 臭蟲的由來與 IEEE 610.12 定義</h2>
<ul>
<li data-marpit-fragment="1"><strong>歷史淵源</strong>：
<ul>
<li data-marpit-fragment="2">1947 年 9 月 9 日，<strong>Grace Murray Hopper</strong> 在 Harvard Mark II 繼電器中找到一隻飛蛾（Bug）。</li>
<li data-marpit-fragment="3">飛蛾被貼在工作筆記本上：「<em>First actual case of bug being found</em>」，從此確立了 Bug 在電腦界的地位。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>IEEE 610.12 臭蟲四階段嚴密因果鏈</strong>：
<ul>
<li data-marpit-fragment="5"><strong>1. Human Mistake / Error (人類犯錯)</strong>：工程師心智失誤、誤解需求或打錯程式碼。</li>
<li data-marpit-fragment="6"><strong>2. Code Fault / Defect / Bug (程式碼缺陷)</strong>：錯誤具體體現在產出物中（邏輯寫錯、邊界少等號）。</li>
<li data-marpit-fragment="7"><strong>3. Internal Error State (內部錯誤狀態)</strong>：執行時記憶體或系統狀態出現不一致（計數器變負數）。</li>
<li data-marpit-fragment="8"><strong>4. System Failure (系統對外失效)</strong>：系統對外可觀察行為偏離規格（拋出 500 Crash、ATM 吐錯金額）。</li>
</ul>
</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<header>2.1 臭蟲與錯誤</header>
<h2 id="%E5%9B%A0%E6%9E%9C%E9%8F%88%E9%97%9C%E9%8D%B5%E5%AE%9A%E7%90%86%E8%88%87%E9%98%B2%E9%8C%AF%E5%8E%9F%E5%89%87">因果鏈關鍵定理與防錯原則</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>關鍵定理一</strong>：
<ul>
<li data-marpit-fragment="2"><strong>系統中有 Fault（缺陷），不一定會馬上導致 Failure（失效）</strong>。</li>
<li data-marpit-fragment="3">若該行程式碼從未被執行（死碼 / 罕見分支），或內部錯誤狀態剛好被後續計算掩蓋，系統外觀看似正常，但這屬於<strong>潛伏缺陷 (Latent Fault)</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>關鍵定理二</strong>：
<ul>
<li data-marpit-fragment="5"><strong>只要觀察到 Failure（失效），系統中必然存在 Fault（缺陷）或環境異常！</strong></li>
</ul>
</li>
<li data-marpit-fragment="6"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>SQA 品質工程啟示</strong>：
<ul>
<li data-marpit-fragment="7">測試與品質保證不能只停留在觀察「系統有沒有 Crash」，更要透過<strong>單元測試、斷言 (Assertions) 與程式碼檢視</strong>，主動把潛伏的 Fault 逼出原形。</li>
</ul>
</li>
</ul>

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：工程師在撰寫銀行轉帳演算法時，誤將手續費計算公式的減號寫成加號，並部署至伺服器。當天日常營運中，所有客戶轉帳金額均未達扣除手續費門檻，無任何客戶發現異常。依據 IEEE 軟體工程定義，此時系統狀態為何？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 系統已發生失效 (Failure)</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 程式碼中存在缺陷 (Fault/Defect)，但尚未表現為系統失效 (Failure)</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 工程師並未犯錯 (Mistake)，因為系統正常運作</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 該程式碼完全符合軟體品質的正確性定義</p>
</div>

<header>2.1 臭蟲與錯誤</header>
<h2 id="212-%E8%A6%8F%E6%A0%BC%E5%B0%8E%E8%87%B4%E7%9A%84%E7%BC%BA%E9%99%B7-specification-bugs">2.1.2 規格導致的缺陷 (Specification Bugs)</h2>
<ul>
<li data-marpit-fragment="1"><strong>「我前方沒有規格，錯誤在我身後形成。」</strong></li>
<li data-marpit-fragment="2">並非所有錯誤都是因為「寫錯程式碼」，很多時候是<strong>規格本身有問題（Ambiguous or Missing Spec）</strong>：
<ul>
<li data-marpit-fragment="3">計算機 <code>5 / 2 = 2</code>（整數除法 vs 浮點除法？）</li>
<li data-marpit-fragment="4"><code>1/3 * 3 = 0.999999</code>（浮點數精度限制）</li>
<li data-marpit-fragment="5">輸入 <code>88888888 * 88888888</code> 發生整數溢位顯示負數</li>
<li data-marpit-fragment="6">輸入 <code>1 / 0</code> 產生未攔截的 Crash</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>除法器規格的演進對比</strong>：
<ul>
<li data-marpit-fragment="8"><em>規格一（陽春）</em>：使用者輸入被除數與除數，顯示小數點後兩位結果。</li>
<li data-marpit-fragment="9"><em>規格二（模糊）</em>：使用者不得輸入除數為 0。（<em>缺點：未規範輸入 0 時如何處置</em>）</li>
<li data-marpit-fragment="10"><em>規格三（優良契約）</em>：除數若為 0，系統應清除結果並回傳 HTTP 400 與友善錯誤訊息「除數不得為零」。</li>
</ul>
</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<ul>
<li data-marpit-fragment="1"><strong>Latent Fault (潛伏缺陷)</strong>：
<ul>
<li data-marpit-fragment="2">程式碼有 Bug（如記憶體洩漏或特定數值溢位），但在常規輸入下未觸發對外失效。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>Specification Gap / Missing Spec Bug (規格遺漏缺陷)</strong>：
<ul>
<li data-marpit-fragment="4">規格書未明確規範異常處理（如使用者輸入除數為 0 或負數年齡），導致系統直接崩潰。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Observable System Crash (可觀察系統失效)</strong>：
<ul>
<li data-marpit-fragment="6">缺陷被觸發並跨越系統邊界，產生對外可觀察到的功能異常或當機。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>工程素養</strong>：
<ul>
<li data-marpit-fragment="8">沒有失效不代表沒有缺陷；符合規格也不代表高品質。</li>
<li data-marpit-fragment="9">專業軟體工程師必須具備**「為規格補全邊界例外」**的主動防禦素養。</li>
</ul>
</li>
</ul>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：某專案經理向客戶抱怨：「使用者輸入負數年齡導致伺服器當機，這是使用者的操作錯誤，不是我們程式的 Bug，因為規格書上根本沒寫年齡可以是負數！」從現代軟體工程與 SQA 觀點，下列評述何者最為正確？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 專案經理說得完全正確，未在規格書載明的輸入，團隊不負責任</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 這是典型的「規格遺漏」與「缺乏防禦性設計」，專業軟體應主動對非法輸入進行驗證並優雅回傳錯誤，而非直接 Crash</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 只要資料庫欄位設為 Integer，任何數字輸入都不應該算是 Bug</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 只要客戶願意加錢，所有未明訂的規格才需要被修復</p>
</div>

<header>2.1 臭蟲與錯誤</header>
<h2 id="213-%E5%B8%B8%E8%A6%8B%E7%B7%A8%E7%A2%BC%E9%8C%AF%E8%AA%A4%E5%88%86%E9%A1%9E-12">2.1.3 常見編碼錯誤分類 (1/2)</h2>

<ul>
<li data-marpit-fragment="1"><strong>1. 算術與精度錯誤</strong>：
<ul>
<li data-marpit-fragment="2"><strong>除以零 (Divide by Zero)</strong>：未檢查分母合法性即進行運算。</li>
<li data-marpit-fragment="3"><strong>整數溢位 (Integer Overflow)</strong>：例如 <code>Integer.MAX_VALUE + 1</code> 悄悄溢位變成負數。</li>
<li data-marpit-fragment="4"><strong>浮點數捨入與累計誤差</strong>：二進位浮點數無法精準表示十進位小數（如 0.1 + 0.2 ≠ 0.3）。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>2. 邏輯與迴圈錯誤</strong>：
<ul>
<li data-marpit-fragment="6"><strong>無窮迴圈 (Infinite Loop)</strong>：終止條件永遠無法達成或計數器方向寫反。</li>
<li data-marpit-fragment="7"><strong>差一錯誤 (Off-by-one bug, OBOB)</strong>：邊界條件 <code>&lt;=</code> 誤寫或陣列索引越界：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 典型的差一錯誤：陣列長度為 length，索引最大為 length - 1</span>
<span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt;= array.length; i++) {
    System.out.println(array[i]); <span class="hljs-comment">// 拋出 ArrayIndexOutOfBoundsException</span>
}
</code></pre>
</li>
</ul>
</li>
</ul>

<header>2.1 臭蟲與錯誤</header>
<h2 id="213-%E5%B8%B8%E8%A6%8B%E7%B7%A8%E7%A2%BC%E9%8C%AF%E8%AA%A4%E5%88%86%E9%A1%9E-22">2.1.3 常見編碼錯誤分類 (2/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>3. 資源相關臭蟲 (Resource Leaks)</strong>：
<ul>
<li data-marpit-fragment="2"><strong><code>NullPointerException</code></strong>：未做空值防禦直接調用物件方法。</li>
<li data-marpit-fragment="3"><strong>資源與連線洩漏 (Resource / Connection Leaks)</strong>：開啟 <code>InputStream</code>、資料庫連線或 Socket 後未妥善釋放。</li>
<li data-marpit-fragment="4"><strong>釋放後使用 (Use-after-free error)</strong>：在底層語言中存取已釋放的記憶體指標。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>4. 多執行緒與並發臭蟲 (Concurrency Bugs)</strong>：
<ul>
<li data-marpit-fragment="6"><strong>死結 (Deadlock)</strong>：執行緒 A 持有鎖 1 等待鎖 2，執行緒 B 持有鎖 2 等待鎖 1，相互卡死。</li>
<li data-marpit-fragment="7"><strong>競爭條件 (Race Condition)</strong>：缺乏適當同步機制，共享資源的讀寫順序因執行緒調度隨機交錯而產生錯誤狀態。</li>
</ul>
</li>
</ul>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="221-%E8%B5%B7%E6%BA%90%E8%88%87%E6%8F%90%E5%87%BA%E8%80%85robert-c-martin-uncle-bob">2.2.1 起源與提出者：Robert C. Martin (Uncle Bob)</h2>
<ul>
<li data-marpit-fragment="1"><strong>現代專業軟體工藝奠基者</strong>：
<ul>
<li data-marpit-fragment="2"><strong>Robert C. Martin</strong>（業界尊稱為 <strong>Uncle Bob</strong>），2001 年敏捷宣言共同發起人。</li>
<li data-marpit-fragment="3">於 <strong>2008 年</strong>出版經典巨著 <strong>《Clean Code: A Handbook of Agile Software Craftsmanship》</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>核心洞察：10 比 1 的閱讀時間定律</strong>：
<ul>
<li data-marpit-fragment="5">「閱讀舊程式碼與撰寫新程式碼的時間比例<strong>往往超過 10 比 1</strong>。」</li>
<li data-marpit-fragment="6">軟體維護與除錯的時間佔據工程師日常 70% 以上。</li>
<li data-marpit-fragment="7"><strong>讓程式碼易讀，實質上就是讓撰寫與修改程式碼變得更容易、更安全！</strong></li>
</ul>
</li>
</ul>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="222-%E8%BB%9F%E9%AB%94%E5%A4%A7%E5%B8%AB%E7%9C%BC%E4%B8%AD%E7%9A%84-clean-code-%E5%AE%9A%E7%BE%A9">2.2.2 軟體大師眼中的 Clean Code 定義</h2>
<table>
<thead>
<tr>
<th style="text-align:left">大師</th>
<th style="text-align:left">經典定義</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Bjarne Stroustrup</strong><br />(C++ 之父)</td>
<td style="text-align:left">「邏輯應當直截了當，<strong>讓缺陷難以隱藏</strong>；依賴關係減至最低；並且有完整的錯誤處理。」</td>
</tr>
<tr>
<td style="text-align:left"><strong>Grady Booch</strong><br />(UML 奠基者)</td>
<td style="text-align:left">「Clean Code 簡潔且直接，讀起來就像結構優美的散文詩，從不會模糊作者的原意。」</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dave Thomas</strong><br />(《Pragmatic Programmer》)</td>
<td style="text-align:left">「不僅原作者能懂，<strong>團隊任何成員也能輕易閱讀與增修</strong>；且必然包含完整的自動化測試。」</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ward Cunningham</strong><br />(Wiki 發明人、XP 先驅)</td>
<td style="text-align:left">「當你閱讀程式碼時，發現每個方法執行的行為<strong>幾乎完全符合你的預期</strong>，那就是 Clean Code。」</td>
</tr>
<tr>
<td style="text-align:left"><strong>Michael Feathers</strong><br />(《修改程式碼的藝術》)</td>
<td style="text-align:left">「Clean Code 總是看起來像是出於一位<strong>深具關懷之心</strong>的工程師之手，沒有任何草率敷衍。」</td>
</tr>
</tbody>
</table>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="223-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81-clean-code">2.2.3 為什麼需要 Clean Code？</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 破窗效應 (Broken Window Theory)</strong>：
<ul>
<li data-marpit-fragment="2">建築物若有一扇破窗未即時修復，很快其他窗戶也會被砸破。</li>
<li data-marpit-fragment="3">程式庫中只要有一段「將就、醜陋」的拼湊寫法，後續維護者便會效仿，導致架構快速腐化。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. 生產力衰退與技術債 (Technical Debt)</strong>：
<ul>
<li data-marpit-fragment="5">為求短期快速交付而犧牲品質，會累積沈重的技術債。</li>
<li data-marpit-fragment="6">每次修改都可能引發未知副作用，團隊長期交付速度最終會趨近於零。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>3. 童子軍法則 (The Boy Scout Rule)</strong>：
<ul>
<li data-marpit-fragment="8"><strong>「離開營地時，讓它比你來的時候更乾淨 (Leave the campground cleaner than you found it).」</strong></li>
<li data-marpit-fragment="9">每次提交 Commit / PR 時，順手重命名一個模糊變數、萃取一小段過長函式。</li>
</ul>
</li>
</ul>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="224-clean-code-%E7%9A%84%E6%A0%B8%E5%BF%83%E5%BF%83%E6%B3%95">2.2.4 Clean Code 的核心心法</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>意圖清楚 (Intention-Revealing)</strong>：
<ul>
<li data-marpit-fragment="2">程式碼應當開門見山告訴讀者「它在做什麼」以及「為什麼這樣做」，無須在大腦中進行二次解碼。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>DRY 原則 (Don't Repeat Yourself)</strong>：
<ul>
<li data-marpit-fragment="4">避免重複的邏輯與樣板程式碼。重複是維護的夢魘，需求變更時若漏改一處便衍生 Bug。</li>
</ul>
</li>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="225-%E5%85%B7%E9%AB%94%E5%AF%A6%E5%8B%99%E4%BD%9C%E6%B3%95-1%E6%9C%89%E6%84%8F%E7%BE%A9%E7%9A%84%E5%91%BD%E5%90%8D-meaningful-names">2.2.5 具體實務作法 1：有意義的命名 (Meaningful Names)</h2>
<ul>
<li data-marpit-fragment="1"><strong>名符其實，杜絕魔術數字與神祕縮寫</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> 劣質命名：含義模糊、存在魔術數字 86400</span>
<span class="hljs-type">int</span> d; <span class="hljs-comment">// elapsed time in days</span>
<span class="hljs-type">int</span> <span class="hljs-variable">t</span> <span class="hljs-operator">=</span> d * <span class="hljs-number">86400</span>;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> 優良命名：意圖明確，具備自我解釋能力</span>
<span class="hljs-type">int</span> elapsedTimeInDays;
<span class="hljs-keyword">final</span> <span class="hljs-type">int</span> <span class="hljs-variable">SECONDS_PER_DAY</span> <span class="hljs-operator">=</span> <span class="hljs-number">86400</span>;
<span class="hljs-type">int</span> <span class="hljs-variable">totalElapsedTimeInSeconds</span> <span class="hljs-operator">=</span> elapsedTimeInDays * SECONDS_PER_DAY;
</code></pre>
</li>
<li data-marpit-fragment="2"><strong>類別用名詞，方法用動詞</strong>：
<ul>
<li data-marpit-fragment="3">類別：<code>Customer</code>, <code>Invoice</code>, <code>Account</code>（避免 <code>Info</code>, <code>Data</code> 等空洞贅詞）。</li>
<li data-marpit-fragment="4">方法：<code>postPayment()</code>, <code>calculateTax()</code>, <code>isEligibleForDiscount()</code>。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>概念一致性</strong>：同概念全專案保持統一（勿在 A 處用 <code>fetchUser</code>，B 處用 <code>getUser</code>，C 處用 <code>retrieveUser</code>）。</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>只做一件事 (Do One Thing Well)</strong>：
<ul>
<li data-marpit-fragment="2">函式應短小精悍（理想在 10~20 行內），專注於單一職責與單一抽象層級。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>限制參數數量</strong>：
<ul>
<li data-marpit-fragment="4">參數愈少愈好（0~2 個最理想；超過 3 個應封裝為物件或 DTO）。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>無隱蔽副作用 (No Side Effects)</strong>：
<ul>
<li data-marpit-fragment="6">函式不應暗中修改外部全域狀態或傳入的引數物件。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>提早回傳與衛語句 (Guard Clauses)</strong>：
<ul>
<li data-marpit-fragment="8">函式巢狀層級不應超過 1~2 層，善用衛語句消除過深的 Arrow Anti-Pattern。</li>

</li>
</ul>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="225-%E5%85%B7%E9%AB%94%E5%AF%A6%E5%8B%99%E4%BD%9C%E6%B3%95-3--4%E8%A8%BB%E8%A7%A3%E8%88%87%E9%8C%AF%E8%AA%A4%E8%99%95%E7%90%86">2.2.5 具體實務作法 3 &amp; 4：註解與錯誤處理</h2>
<ul>
<li data-marpit-fragment="1"><strong>程式碼即最佳文檔 (Self-Documenting Code)</strong>：
<ul>
<li data-marpit-fragment="2">不要用註解來粉飾糟糕的程式碼；花時間重構，讓程式碼自己說話。</li>
<li data-marpit-fragment="3"><strong>壞註解</strong>：廢話註解（<code>i++; // i 加 1</code>）、已被註解廢棄的死碼（應由 Git 歷史管理，直接刪除）。</li>
<li data-marpit-fragment="4"><strong>好註解</strong>：解釋**「為什麼 (Why)」**這麼做（特殊演算法選型、特殊業務法規限制），而非「做了什麼 (What)」。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>嚴謹的錯誤處理與防禦</strong>：
<ul>
<li data-marpit-fragment="6"><strong>使用例外 (Exceptions) 代替錯誤碼 (Error Codes)</strong>：主流程與異常處理邏輯清楚分離。</li>
<li data-marpit-fragment="7"><strong>杜絕 <code>null</code> 傳遞與回傳</strong>：善用 <code>Optional</code>、空集合（<code>Collections.emptyList()</code>）或 Null Object 模式，根除 <code>NullPointerException</code>。</li>
</ul>
</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：資深工程師在進行 Code Review 時，發現後輩寫了 150 行的付款結帳方法 <code>checkout()</code>，內含 5 層 if-else 巢狀判斷，旁邊寫了 40 行詳細註解解釋每層判斷用途。根據 Clean Code 原則，下列重構建議何者最恰當？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 只要註解詳細且測試有過，150 行與 5 層巢狀完全可接受</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 應利用「提早回傳 (Guard Clauses)」減少巢狀層級，並運用「萃取方法 (Extract Method)」將驗證、算折扣、扣款等子邏輯拆分為具備自我解釋能力的小函式，進而刪除冗餘解釋性註解</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 應將註解全部翻譯成英文以提升國際化品質，邏輯不變</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 應將 150 行壓縮成一行 Lambda 表達式以減少行數</p>
</div>

<header>2.2 整潔程式碼 (Clean Code)</header>
<h2 id="226-%E9%87%8D%E5%A4%A7%E8%BF%B7%E6%80%9Dclean-code-%E7%AD%89%E6%96%BC%E6%B2%92%E6%9C%89-bug-%E5%97%8E">2.2.6 重大迷思：Clean Code 等於沒有 Bug 嗎？</h2>

<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>「Clean Code ≠ Bug-Free Code（整潔的程式碼不等於沒有缺陷的程式碼）」</strong></li>
<li data-marpit-fragment="2">這是混淆了軟體品質的兩個不同層面：
<ul>
<li data-marpit-fragment="3"><strong>內部品質 (Internal Quality)</strong>：結構優雅、高可讀性、高模組化、好維護（Clean Code 所追求的目標）。</li>
<li data-marpit-fragment="4"><strong>外部品質 (External Quality)</strong>：執行時對外功能正確性 (Correctness)，是否 100% 符合業務規格與運算邏輯。</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>[Clean Code (內部品質優良)]  ≠必然  [Bug-Free (外部品質正確)]

但 Clean Code 具備巨大防錯價值：
├── 讓業務缺陷與邏輯漏洞「極易被肉眼與 Review 察覺（無處可藏）」
├── 讓自動化單元測試「極易撰寫與 Mock」
└── 讓修復 Bug 的代價與回歸風險「降至最低」
</code></pre>
<ul>
<li data-marpit-fragment="5"><strong>實例</strong>：命名極精準的結帳模組，若公式將減號寫成加號，它依然是一隻嚴重的商業邏輯 Bug！</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<header>2.2 整潔程式碼 (Clean Code)</header>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ 4)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：新進工程師報告：「這段金融交易模組經過徹底重構，完全符合 Clean Code 原則——變數命名精準、函式不超過 10 行、無深層巢狀且無重複程式碼。因此我保證上線後絕對不會有任何 Bug！」從 SQA 角度評述何者最精準？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 該工程師說法完全正確，Clean Code 定義就是無缺陷的程式碼</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 該工程師混淆了「內部品質」與「外部品質」；Clean Code 提升了可讀性與可維護性，但無法保證業務規則理解正確或算式無誤，仍需仰賴自動化測試與規格驗證</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 只要函式在 10 行內，編譯器就會自動進行形式化邏輯證明</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> Clean Code 僅適用於前端 UI，後端交易重構無實質品質效益</p>
</div>

<header>2.3 除錯思維與方法</header>
<h2 id="231-%E9%99%A4%E9%8C%AF%E7%9A%84%E6%A0%B8%E5%BF%83%E6%80%9D%E7%B6%AD">2.3.1 除錯的核心思維</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🕵️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f575.svg" data-marp-twemoji=""/> <strong>科學偵探思維</strong>：
<ul>
<li data-marpit-fragment="2">除錯是嚴謹的假設檢定過程，堅決拒絕「碰碰運氣胡亂修改（Shotgun Debugging / 霰彈槍除錯）」。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>不只改徵兆，探尋根本原因 (Root Cause)</strong>：
<ul>
<li data-marpit-fragment="4">治標不治本（如隨處加 <code>if (x != null)</code> 或包裹空的 <code>try-catch</code> 吞掉例外）只會引來更多難以排查的深層災難。</li>
</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>缺陷群聚效應 (Defect Clustering)</strong>：
<ul>
<li data-marpit-fragment="6">一處發現 Bug，往往意味著同一作者、同一模組的鄰近邏輯也有潛伏缺陷。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <strong>回歸測試保護 (Regression Defense)</strong>：
<ul>
<li data-marpit-fragment="8">修復 Bug 前先寫出重現測試；修復後確保所有自動化測試全綠燈。</li>
</ul>
</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<header>2.3 除錯思維與方法</header>
<h2 id="232-%E7%A7%91%E5%AD%B8%E9%99%A4%E9%8C%AF%E4%BA%94%E6%AD%A5%E9%A9%9F-scientific-debugging">2.3.2 科學除錯五步驟 (Scientific Debugging)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. Reproduce (穩定重現)</strong>：
<ul>
<li data-marpit-fragment="2">排除環境干擾，建立能 100% 穩定重現 Bug 的最小失敗測試案例 (Minimal Failing Test Case)。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>2. Hypothesize (假設形成)</strong>：
<ul>
<li data-marpit-fragment="4">依據錯誤訊息、日誌與 Call Stack 呼叫堆疊，提出 1~2 個根本原因的因果假設。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>3. Experiment (實驗驗證)</strong>：
<ul>
<li data-marpit-fragment="6">設定條件斷點或加入追蹤日誌，執行受測程式驗證或推翻假設。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>4. Fix (根因修復)</strong>：
<ul>
<li data-marpit-fragment="8">從核心演算法或架構層面進行乾淨修復與重構，杜絕表面敷衍。</li>
</ul>
</li>
<li data-marpit-fragment="9"><strong>5. Regression Test (回歸驗證)</strong>：
<ul>
<li data-marpit-fragment="10">執行完整測試套件，確認重現測試轉綠，且既有功能無任何回歸破壞。</li>
</ul>
</li>
</ul>

<header>2.3 除錯思維與方法</header>
<h2 id="234-%F0%9F%A4%96-ai-%E6%99%82%E4%BB%A3%E8%BC%94%E5%8A%A9%E9%99%A4%E9%8C%AF%E7%9A%84%E5%85%A9%E5%A4%A7%E9%99%B7%E9%98%B1">2.3.4 <img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f916.svg" data-marp-twemoji=""/> AI 時代輔助除錯的兩大陷阱</h2>
<ul>
<li data-marpit-fragment="1"><strong>陷阱 1：「膠帶式修復 (Band-aid / Patch Fix)」</strong>：
<ul>
<li data-marpit-fragment="2">當把 <code>NullPointerException</code> 報錯貼給 AI，AI 常直接給出 <code>if (obj != null) { ... }</code>。</li>
<li data-marpit-fragment="3"><strong>嚴重問題</strong>：這只是掩蓋了錯誤徵兆，<code>obj</code> 為 null 的根本原因（上游資料庫查詢為空、初始化流程失敗）未獲解決，將錯誤延遲引爆在更隱蔽之處！</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>陷阱 2：自我印證偏誤與回歸破壞</strong>：
<ul>
<li data-marpit-fragment="5">AI 聚焦修改當前函式時，極易破壞系統其他模組隱含的狀態不變量 (Invariants)，悄悄引入嚴重的<strong>回歸缺陷 (Regression Defect)</strong>。</li>
</ul>
</li>
</ul>

<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>1. 提供完整上下文 (Context)</strong>：
<ul>
<li data-marpit-fragment="2">絕不要只貼單行報錯；必須提供完整的 <strong>Stack Trace、相關方法原始碼、具體輸入資料與預期業務規格</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>2. 要求根因解釋，而非直接給程式碼</strong>：

</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>3. 先寫測試再修復 (Test-First Bug Fix)</strong>：
<ul>
<li data-marpit-fragment="6">讓 AI 協助生成一個**「專門重現該 Bug 的失敗單元測試」**；修復後見證紅燈轉綠，並執行 CI 全套測試確保零回歸。</li>
</ul>
</li>
</ul>

<header>2.3 除錯思維與方法</header>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ 5)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：生產環境拋出 <code>ConcurrentModificationException</code>，工程師將程式碼貼給 AI，AI 建議在迴圈外層直接包裹空的 <code>try-catch</code> 區塊將例外吞掉。關於這種做法，下列評價何者最為精準？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 這是絕佳快速修復方案，因為系統再也不會拋出例外中斷</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 這是危險的「治標不治本（Swallowing Exception）」，表面雖不報錯，但底層多執行緒並發衝突與資料不一致依然存在，日後會引發更嚴重的資料損壞</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 只要 AI 給出的程式碼能通過編譯，就代表通過軟體品質驗證</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 現代 Java 框架已全面由容器託管，不需要理會此例外</p>
</div>

<header>2.4 除錯工具實務</header>
<h2 id="%E7%8F%BE%E4%BB%A3-ide-%E6%A0%B8%E5%BF%83%E9%99%A4%E9%8C%AF%E5%88%A9%E5%88%83">現代 IDE 核心除錯利刃</h2>
<ul>
<li data-marpit-fragment="1"><strong>條件斷點 (Conditional Breakpoints)</strong>：
<ul>
<li data-marpit-fragment="2">設定求值條件（如 <code>i == 999</code> 或 <code>user.getBalance() &lt; 0</code>），僅在滿足特定情境時才暫停執行，大幅節省單步迴圈時間。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>例外斷點 (Exception Breakpoints)</strong>：
<ul>
<li data-marpit-fragment="4">設定特定例外類型（如 <code>NullPointerException</code>），系統只要拋出該例外立即自動暫停，精準定格第一現場與呼叫堆疊 (Call Stack)。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>即時表達式求值 (Evaluate Expression)</strong>：
<ul>
<li data-marpit-fragment="6">在程式定格時動態調用方法、驗證運算式結果與查看私有屬性狀態。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>實習演練</strong>：請參閱 <code>LabDemo/docs/u01_debug/debug.md</code> 進行動手實作。</li>
</ul>

<header>2.5 防禦性編程與契約式設計</header>
<h2 id="251-%E5%A5%91%E7%B4%84%E5%BC%8F%E8%A8%AD%E8%A8%88-dbc-%E7%9A%84%E8%B5%B7%E6%BA%90%E8%88%87%E6%A0%B8%E5%BF%83%E5%AE%9A%E7%BE%A9">2.5.1 契約式設計 (DbC) 的起源與核心定義</h2>
<ul>
<li data-marpit-fragment="1"><strong>提出者與理論背景</strong>：
<ul>
<li data-marpit-fragment="2">由物件導向權威、Eiffel 語言之父 <strong>Bertrand Meyer</strong> 於 1986 年提出。</li>
<li data-marpit-fragment="3"><strong>根本哲學</strong>：模組與方法之間的協作，就像商業世界中的**「法律契約 (Legal Contract)」**。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>雙方權利與義務對等原則 (Rights &amp; Obligations)</strong>：</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">角色</th>
<th style="text-align:left">義務 (Obligations)</th>
<th style="text-align:left">權利 (Rights)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>呼叫端 (Caller / Client)</strong></td>
<td style="text-align:left">必須嚴格滿足方法所要求的<strong>前置條件 (Preconditions)</strong></td>
<td style="text-align:left">若滿足前置條件，有權期望獲得正確的<strong>後置結果 (Postconditions)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>被呼叫端 (Supplier / Callee)</strong></td>
<td style="text-align:left">必須保證達成<strong>後置條件</strong>，且全程維護<strong>類別不變量 (Invariants)</strong></td>
<td style="text-align:left">若呼叫端未滿足前置條件，被呼叫端<strong>無義務處理，有權直接拒絕執行</strong></td>
</tr>
</tbody>
</table>

<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dc.svg" data-marp-twemoji=""/> <strong>Preconditions (前置條件 - <code>requires</code>)</strong>：
<ul>
<li data-marpit-fragment="2">呼叫者 (Caller) 進入方法前必須滿足的條件；若不滿足，責任在<strong>呼叫端 (Client Bug)</strong>，方法應直接拒絕執行。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Postconditions (後置條件 - <code>ensures</code>)</strong>：
<ul>

</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>Class Invariants (類別不變量 - <code>maintains</code>)</strong>：

</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>核心價值</strong>：
<ul>
<li data-marpit-fragment="8">契約界定清楚了**「誰該負責防禦什麼」**，杜絕無休止的冗餘檢查與責任踢皮球。</li>

<header>2.5 防禦性編程與契約式設計</header>
<h2 id="%E5%A5%91%E7%B4%84%E7%A0%B4%E8%A3%82%E7%9A%84%E6%AC%8A%E8%B2%AC%E5%88%A4%E5%AE%9A%E8%88%87-sqa-%E6%95%88%E7%9B%8A">契約破裂的權責判定與 SQA 效益</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6a8.svg" data-marp-twemoji=""/> <strong>若前置條件 (Precondition) 失敗</strong>（如傳入負數金額）：
<ul>
<li data-marpit-fragment="2"><strong>責任歸屬：呼叫者 (Caller)</strong>。</li>
<li data-marpit-fragment="3"><strong>處置</strong>：立即拋出 <code>IllegalArgumentException</code> 拒絕執行，防範髒輸入污染核心領域模型。</li>
</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6a8.svg" data-marp-twemoji=""/> <strong>若後置條件 (Postcondition) 失敗</strong>（如扣款未生效或金額計算偏差）：
<ul>
<li data-marpit-fragment="5"><strong>責任歸屬：被呼叫方法自身 (Supplier)</strong>。</li>
<li data-marpit-fragment="6"><strong>處置</strong>：觸發斷言，表示演算法實作存在缺陷 (Fault)，需立即修復。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6a8.svg" data-marp-twemoji=""/> <strong>若類別不變量 (Class Invariant) 破裂</strong>（如餘額透支變負數）：
<ul>
<li data-marpit-fragment="8"><strong>責任歸屬：內部狀態腐敗</strong>。</li>
<li data-marpit-fragment="9"><strong>處置</strong>：系統立即自我熔斷，杜絕將錯誤狀態寫入持久化資料庫！</li>
<li data-marpit-fragment="10"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 狀態不變量也是現代<strong>屬性基礎測試 (Property-Based Testing)</strong> 自動驗證的真理仲裁核心。</li>
</ul>
</li>
</ul>

<h2 id="252-%E6%96%B7%E8%A8%80%E6%A9%9F%E5%88%B6%E6%B7%B1%E7%A9%B6-java-assertions">2.5.2 斷言機制深究 (Java Assertions)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>語法結構</strong>：<code>assert condition : &quot;自訂錯誤訊息&quot;;</code>（若條件為 false 則拋出 <code>AssertionError</code>）</li>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <strong>斷言三大最佳使用時機 (LabDemo 實務)</strong>：
<ul>
<li data-marpit-fragment="3"><strong>1. 內部狀態不變量 (Internal Invariants)</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 邏輯上若 i 為正整數且餘數非 0、1，此處必定為 2</span>
<span class="hljs-keyword">assert</span> i % <span class="hljs-number">3</span> == <span class="hljs-number">2</span> : <span class="hljs-string">&quot;非預期的餘數狀態: &quot;</span> + (i % <span class="hljs-number">3</span>);
</code></pre>
</li>
<li data-marpit-fragment="4"><strong>2. 類別不變量 (Class Invariants)</strong>：
<ul>
<li data-marpit-fragment="5">物件生命週期中必須恆為真的黃金法則（如 <code>BoundedStack</code> 的 size、capacity 與陣列非空）：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">elements[size++] = val;
<span class="hljs-keyword">assert</span> <span class="hljs-title function_">invariant</span><span class="hljs-params">()</span> : <span class="hljs-string">&quot;Push 後違反 Stack 類別不變量！&quot;</span>;
</code></pre>
</li>
<li data-marpit-fragment="6"><strong>3. 控制流程不變量 (Control-Flow Invariants)</strong>：
<ul>
<li data-marpit-fragment="7">列舉所有 <code>switch-case</code> 分支後，理論上絕對不可執行的防禦哨兵：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">default</span>: <span class="hljs-keyword">assert</span> <span class="hljs-literal">false</span> : <span class="hljs-string">&quot;未知的 Status 列舉狀態: &quot;</span> + status;
</code></pre>
</li>
</ul>
</li>
</ul>

<h2 id="252-%E6%96%B7%E8%A8%80%E7%9A%84%E7%A6%81%E5%BF%8C%E8%88%87%E5%95%9F%E7%94%A8%E9%96%8B%E9%97%9C--ea">2.5.2 斷言的禁忌與啟用開關 (-ea)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>絕對禁忌 1：絕不可用斷言檢查公開 API (Public API) 參數</strong>！
<ul>
<li data-marpit-fragment="2">生產環境預設<strong>關閉斷言</strong> (<code>-da</code>)。若用斷言防禦外部非法輸入，生產環境將完全失守！</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>正確作法</strong>：公開 API 必須拋出顯式例外（如 <code>IllegalArgumentException</code>）。</li>
</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>絕對禁忌 2：斷言內部絕不可包含具副作用 (Side Effect) 的商業邏輯</strong>！
<ul>
<li data-marpit-fragment="5">例如 <code>assert list.remove(item);</code> ➔ 關閉斷言後，該行程式碼完全不執行，導致元素永遠未被移除！</li>
</ul>
</li>
<li data-marpit-fragment="6"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2699.svg" data-marp-twemoji=""/> <strong>如何啟用斷言 (<code>-ea</code>)</strong>：
<ul>
<li data-marpit-fragment="7"><strong>命令列執行</strong>：<code>java -ea -cp target/classes xdemo.BubbleSort</code>（<code>-ea</code> 代表 enableassertions）。</li>
<li data-marpit-fragment="8"><strong>IntelliJ IDEA</strong>：Run <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Edit Configurations... <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Add VM options 填入 <code>-ea</code>。</li>
<li data-marpit-fragment="9"><strong>Maven 測試</strong>：在 <code>pom.xml</code> 的 <code>maven-surefire-plugin</code> 設定 <code>&lt;enableAssertions&gt;true&lt;/enableAssertions&gt;</code>。</li>

<header>2.5 防禦性編程與契約式設計</header>
<h2 id="253-%E4%BE%8B%E5%A4%96%E8%99%95%E7%90%86%E6%A9%9F%E5%88%B6-exception-handling">2.5.3 例外處理機制 (Exception Handling)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="🌲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f332.svg" data-marp-twemoji=""/> <strong>Java <code>Throwable</code> 核心層次結構</strong>：
<ul>
<li data-marpit-fragment="2"><strong>1. Checked Exception (受檢例外)</strong>：
<ul>
<li data-marpit-fragment="3">繼承自 <code>Exception</code>（非 RuntimeException），如 <code>IOException</code>, <code>SQLException</code>。</li>
<li data-marpit-fragment="4">外部環境可能發生但程式無法完全預防；<strong>編譯器強制要求必須處理，否則編譯錯誤</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>2. Unchecked Exception (未檢例外 / 執行期例外)</strong>：
<ul>
<li data-marpit-fragment="6">繼承自 <code>RuntimeException</code>，如 <code>NullPointerException</code>, <code>IllegalArgumentException</code>。</li>
<li data-marpit-fragment="7">通常源於<strong>程式設計師的邏輯缺陷</strong>；編譯期不強制捕捉，但未處理會造成程式中斷。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>3. Error (嚴重錯誤)</strong>：
<ul>
<li data-marpit-fragment="9">如 <code>OutOfMemoryError</code>, <code>StackOverflowError</code>，代表 JVM 底層硬體或記憶體崩潰，應用層不應捕捉。</li>
</ul>
</li>
</ul>
</li>
<li data-marpit-fragment="10"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4dc.svg" data-marp-twemoji=""/> <strong>捕捉或宣告原則 (Catch or Declare Rule - CDR)</strong>：
<ul>
<li data-marpit-fragment="11">對於受檢例外只有兩種選擇：<strong>要嘛用 <code>try-catch</code> 妥善處理，要嘛用 <code>throws</code> 宣告交給呼叫者處理</strong>！</li>
</ul>
</li>
</ul>
<footer>Ch02 錯與除錯</footer>

<header>2.5 防禦性編程與契約式設計</header>
<h2 id="254-%E7%B3%BB%E7%B5%B1%E6%97%A5%E8%AA%8C%E6%A9%9F%E5%88%B6-logging-as-defense">2.5.4 系統日誌機制 (Logging as Defense)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>為什麼需要日誌框架？（日誌 vs <code>System.err.println</code>）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>1. 日誌等級過濾 (Level Filtering)</strong>：
<ul>
<li data-marpit-fragment="3">正式生產環境只記錄 <code>WARN</code> / <code>ERROR</code>，開發與除錯期動態開啟 <code>DEBUG</code>，無須改動任何程式碼。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. 多目標靈活輸出 (Appenders)</strong>：
<ul>
<li data-marpit-fragment="5">透過配置可同時輸出至 Console 控制台、滾動日誌檔案 (<code>logs/app.log</code>) 或遠端 ELK / Grafana 監控中心。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>3. 豐富結構化格式 (PatternLayout)</strong>：
<ul>
<li data-marpit-fragment="7">自動附加精確時間戳、執行緒名稱、來源類別與行號，事後排查一目了然。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>4. 外部動態設定</strong>：
<ul>
<li data-marpit-fragment="9">透過 <code>log4j2.xml</code> 配置文件熱更新日誌行為，免重新編譯部署。</li>
</ul>
</li>
</ul>
</li>
</ul>

<table>

<tr>
<th style="text-align:left">防禦維度</th>
<th style="text-align:left">核心機制</th>

<tr>
<td style="text-align:left"><strong>契約前置條件</strong></td>
<td style="text-align:left"><code>IllegalArgumentException</code></td>
<td style="text-align:left">外部呼叫者違反合約、輸入髒資料</td>
<td style="text-align:left">永遠啟用，直接阻擋非法請求</td>
</tr>
<tr>
<td style="text-align:left"><strong>斷言 (Assertion)</strong></td>
<td style="text-align:left"><code>assert cond : msg</code></td>
<td style="text-align:left">開發者自身的邏輯缺陷、內部狀態不變量</td>
<td style="text-align:left">預設關閉，可由 <code>-ea</code> 參數開啟</td>
</tr>
<tr>
<td style="text-align:left"><strong>受檢例外 (Checked)</strong></td>
<td style="text-align:left"><code>try-catch</code> / <code>throws</code></td>
<td style="text-align:left">外部環境可預期的異常（網路斷線、檔案遺失）</td>
<td style="text-align:left">永遠啟用，強制呼叫方提供容錯策略</td>
</tr>
<tr>
<td style="text-align:left"><strong>系統日誌 (Logging)</strong></td>
<td style="text-align:left">SLF4J / Log4j 2</td>
<td style="text-align:left">系統運作軌跡、稽核審查、事後根本原因追查</td>
<td style="text-align:left">透過設定檔動態調整輸出目標與等級</td>
</tr>

<h2 id="%E5%A4%A7%E6%A8%93%E7%9A%84%E7%87%88%E6%B7%B1%E5%88%BB%E9%9A%B1%E5%96%BB%E8%88%87-sqa-%E7%9C%81%E6%80%9D">「大樓的燈」深刻隱喻與 SQA 省思</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>隱喻 1：治標不治本的 Quick Fix ➔ 毀滅性的技術債 (Technical Debt)</strong>：
<ul>
<li data-marpit-fragment="2">「一刀剪斷電線」看似 5 分鐘快速解決當下工單，但問題本質從未被解決。</li>
<li data-marpit-fragment="3"><strong>地下室整面牆掛滿前人留下的雜亂電線</strong>，正是真實專案中無數「臨時 Patch / 拼湊修補」最後引發架構大崩壞的殘酷寫照！</li>
</ul>
</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>隱喻 2：模糊遺漏的規格 ➔ 「燈泡還是光」的無效內耗</strong>：
<ul>
<li data-marpit-fragment="5">缺陷回報若缺乏精確規格標準，開發與 QA 終將陷入無休止的爭吵（「燈泡明明滅了 vs. 房間還是很亮」）。</li>
<li data-marpit-fragment="6">真正的根因可能是「需要拉下百葉窗」，團隊卻在天花板剪電線。</li>
</ul>
</li>
<li data-marpit-fragment="7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>隱喻 3：高壓催促與治標文化</strong>：
<ul>
<li data-marpit-fragment="8">主管若只要求「明天不得再有 Bug」，只會逼出更多「地下室的隱藏電線」！</li>
</ul>
</li>
</ul>

<h2 id="262-%E5%AE%8C%E6%95%B4%E7%BC%BA%E9%99%B7%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F%E7%8B%80%E6%85%8B%E6%A9%9F-defect-lifecycle">2.6.2 完整缺陷生命週期狀態機 (Defect Lifecycle)</h2>
<ul>
<li data-marpit-fragment="1"><strong>主流程 (Main Flow)</strong>：
<ul>
<li data-marpit-fragment="2"><strong>New (新建)</strong> ➔ <strong>Assigned (已指派)</strong> ➔ <strong>In Progress (處理中)</strong> ➔ <strong>Fixed (已修復)</strong> ➔ <strong>QA Retest (QA 驗證)</strong> ➔ <strong>Closed (結案關閉)</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>分支流程 (Branch Flows)</strong>：
<ul>
<li data-marpit-fragment="4"><strong>Rejected / Duplicate (拒絕 / 重複)</strong>：非 Bug、環境問題或重複回報 ➔ 直接結案。</li>
<li data-marpit-fragment="5"><strong>Deferred (延期處理)</strong>：非當前 Release 關鍵阻礙 ➔ 移入 Backlog。</li>
<li data-marpit-fragment="6"><strong>Reopened (重新開啟)</strong>：QA 驗證失敗 ➔ 打回重新排查修復。</li>
</ul>
</li>
</ul>

<h2 id="263-%E5%9A%B4%E9%87%8D%E5%BA%A6-severity-vs-%E5%84%AA%E5%85%88%E7%B4%9A-priority">2.6.3 嚴重度 (Severity) vs 優先級 (Priority)</h2>
<ul>
<li data-marpit-fragment="1"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2699.svg" data-marp-twemoji=""/> <strong>嚴重度 (Severity - 技術衝擊維度)</strong>：
<ul>
<li data-marpit-fragment="2">缺陷對系統技術架構、功能運行與資料完整性的破壞程度（Critical, Major, Minor）。</li>
</ul>
</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="⏰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/23f0.svg" data-marp-twemoji=""/> <strong>優先級 (Priority - 業務急迫維度)</strong>：
<ul>
<li data-marpit-fragment="4">該缺陷需要被排程修復的商業急迫性（Urgent / Immediate, High, Normal, Low）。</li>
</ul>
</li>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>兩者為正交維度</strong>：
<ul>
<li data-marpit-fragment="6">嚴重度高的問題，優先級不必然最高；</li>
<li data-marpit-fragment="7">嚴重度低的問題，在特殊商業場景下優先級可能極高！</li>
</ul>
</li>
</ul>

<header>2.6 缺陷管理與議題追蹤</header>
<h2 id="2x2-%E6%B1%BA%E7%AD%96%E7%9F%A9%E9%99%A3%E5%9B%9B%E5%A4%A7%E8%B1%A1%E9%99%90%E5%AF%A6%E4%BE%8B%E5%88%86%E6%9E%90">2x2 決策矩陣四大象限實例分析</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 高嚴重度 + 高優先級 (Critical &amp; Urgent - 立即修復)</strong>：
<ul>
<li data-marpit-fragment="2"><em>實例</em>：核心金流交易崩潰、全站 500 Crash、重大 SQL Injection 漏洞。</li>
<li data-marpit-fragment="3"><em>處置</em>：阻斷 Release，立即發布緊急熱修復 (Hotfix)。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. 低嚴重度 + 高優先級 (Low Severity &amp; Urgent - 快速修復)</strong>：
<ul>
<li data-marpit-fragment="5"><em>實例</em>：公司首頁 Logo 拼寫錯誤（<code>Compnay</code>）、主按鈕文案誤導。</li>
<li data-marpit-fragment="6"><em>處置</em>：技術層面只是靜態文字修改，但嚴重損害企業商譽，優先排定當日修正。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>3. 高嚴重度 + 低優先級 (High Severity &amp; Low Priority - 排程修復)</strong>：
<ul>
<li data-marpit-fragment="8"><em>實例</em>：特定冷門作業系統（如 Win95）或極罕見複合邊界下的當機。</li>
<li data-marpit-fragment="9"><em>處置</em>：技術衝擊大但影響使用者趨近於零，排入後續迭代正常修復。</li>
</ul>
</li>
<li data-marpit-fragment="10"><strong>4. 低嚴重度 + 低優先級 (Low Severity &amp; Low Priority - 日後優化)</strong>：
<ul>
<li data-marpit-fragment="11"><em>實例</em>：內部管理後台冷門報表 1 像素對齊偏差。</li>
</ul>
</li>
</ul>

<li data-marpit-fragment="4">某系統已知：若（記憶體不足 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.509ex" height="1.403ex" role="img" focusable="false" viewBox="0 -598 667 620"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2228" d="M55 580Q56 587 61 592T75 598Q86 598 96 580L333 48L570 580Q579 596 586 597Q588 598 591 598Q609 598 611 580Q611 574 546 426T415 132T348 -15Q343 -22 333 -22T318 -15Q317 -14 252 131T121 425T55 580Z"></path></g></g></g></svg></mjx-container> 網路超時），則（交易會回滾 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.05ex;" xmlns="http://www.w3.org/2000/svg" width="1.509ex" height="1.403ex" role="img" focusable="false" viewBox="0 -598 667 620"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2227" d="M318 591Q325 598 333 598Q344 598 348 591Q349 590 414 445T545 151T611 -4Q609 -22 591 -22Q588 -22 586 -21T581 -20T577 -17T575 -13T572 -9T570 -4L333 528L96 -4Q87 -20 80 -21Q78 -22 75 -22Q57 -22 55 -4Q55 2 120 150T251 444T318 591Z"></path></g></g></g></svg></mjx-container> 記錄日誌）。</li>

<li data-marpit-fragment="1"><strong>CCQ 1（銀行轉帳公式與未觸發失效）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="3">工程師犯錯 (Mistake) 已將錯誤邏輯寫入程式碼形成缺陷 (Fault)。因當天未達手續費門檻，該分支未被觸發或未造成對外行為偏離，故尚未表現為可觀察之系統失效 (Failure)。</li>

</li>
<li data-marpit-fragment="4"><strong>CCQ 2（負數年齡與規格遺漏）</strong>：
<ul>
<li data-marpit-fragment="5"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="6">專業軟體強調防禦性架構（Input Validation）。即使規格未窮盡非法值，系統也絕不能因未受校驗的輸入而拋出未捕獲例外或崩潰。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>CCQ 3（150 行巢狀函式重構）</strong>：

<li data-marpit-fragment="8"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="9">Clean Code 核心是「程式碼即文件」。過長函式與深層巢狀應透過 Guard Clauses 扁平化，並抽取小函式讓意圖自明，而非靠 40 行註解粉飾。</li>
</ul>
</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>CCQ 4（Clean Code 是否等於無 Bug）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="3">Clean Code 保證的是「內部品質」（易讀、易改、模組化）；外部品質（業務正確性）仍可能因演算法理解錯誤而存在缺陷。Clean Code 的價值在於讓 Bug 無處可藏且極易測試。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>CCQ 5（空 try-catch 吞掉並發例外）</strong>：
<ul>
<li data-marpit-fragment="5"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="6">吞掉例外 (Swallowing Exceptions) 是嚴重的反模式。表面雖不報錯，但底層多執行緒並發衝突與資料不一致依然存在，日後會引發不可逆的資料損壞。</li>
</ul>
</li>
</ul>
