<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-4-%E7%AB%A0%E8%BB%9F%E9%AB%94%E6%AA%A2%E8%A6%96%E9%9D%9C%E6%85%8B%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%88%86%E6%9E%90%E8%88%87%E5%AE%89%E5%85%A8%E6%80%A7%E9%98%B2%E8%AD%B7">第 4 章：軟體檢視、靜態程式碼分析與安全性防護</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>到了測試階段才突然重視起品質，為時已晚。<br />
同儕找到錯誤，絕對比顧客在線上找到錯誤好上一萬倍。<br />
—— Michael Fagan (軟體檢視發明人)</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="[◄](#1) 本章大綱 (Outline) [►](#3)" data-footer="Ch04 軟體檢視" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:[◄](#1) 本章大綱 (Outline) [►](#3);--footer:Ch04 軟體檢視;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#1">◄</a> 本章大綱 (Outline) <a href="#3">►</a></header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%AD-%E6%AA%A2%E8%A6%96%E5%93%B2%E5%AD%B8%E8%88%87%E6%B5%81%E7%A8%8B%E6%A8%99%E6%BA%96"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 檢視哲學與流程標準</h3>
<ul>
<li><strong>4.1 軟體檢視概念與前置條件</strong>：
<ul>
<li>軟體測試的「冰山比喻」：靜態檢視 vs. 動態執行互補</li>
<li>檢視前置條件與組織品質社群文化</li>
</ul>
</li>
<li><strong>4.2 檢視方法與 AI 現代實踐</strong>：
<ul>
<li>IEEE 1028 審查體系：檢視 (Inspection) vs. 走查 (Walkthrough)</li>
<li>Fagan 檢視 6 大標準流程與 5 大核心角色分工</li>
<li>2026 AI PR 機器人先行 + 人類專家把關之典範轉移</li>
</ul>
</li>
<li><strong>4.3 需求與規格檢視 (SRS Review)</strong>：
<ul>
<li>SRS 8 大核心品質屬性（正確、無歧義、完整、可驗證等）</li>
<li>規格書 7 大撰寫準則與雙向追溯 (Bidirectional Traceability)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%90-%E6%A8%A1%E5%9E%8B%E5%AF%A9%E6%9F%A5%E8%88%87%E7%A8%8B%E5%BC%8F%E7%A2%BC%E9%98%B2%E7%A6%A6"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 模型審查與程式碼防禦</h3>
<ul>
<li><strong>4.4 軟體設計檢視 (Design Review)</strong>：
<ul>
<li>系統架構、介面契約與資料庫 Schema 審查</li>
<li>設計模型檢核：DFD 4 大核心元素與平衡規則</li>
<li>AI 威脅建模 (Threat Modeling) 與風險推演</li>
</ul>
</li>
<li><strong>4.5 程式碼檢視與安全漏洞 (Code Review)</strong>：
<ul>
<li>團隊 Clean Code 審查查核清單與程式錯誤 5 大分類</li>
<li>Martin Fowler 經典程式臭味 (Code Smells) 與重構手法</li>
<li>OWASP Top 10 核心資安漏洞防範與 PMD 靜態分析</li>
</ul>
</li>
<li><strong>4.6 檢視成效評估度量</strong>：
<ul>
<li>缺失偵測效率 (EDE)、成本效用比與缺陷移除率 (DRL)</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="[◄](#2) 4.1 基本概念 [►](#9)" data-footer="Ch04 軟體檢視" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="3" style="--paginate:true;--header:[◄](#2) 4.1 基本概念 [►](#9);--footer:Ch04 軟體檢視;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.1 基本概念 <a href="#9">►</a></header>

<h1 id="41-%E5%9F%BA%E6%9C%AC%E6%A6%82%E5%BF%B5"><strong>4.1 基本概念</strong></h1>
<blockquote>
<p>「動態測試只能看見浮出水面的冰山一角；<br />
唯有靜態檢視，能深入水下根除架構暗礁。」</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.1 基本概念 [►](#9)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:[◄](#2) 4.1 基本概念 [►](#9);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.1 基本概念 <a href="#9">►</a></header>

<h2 id="%E8%BB%9F%E9%AB%94%E6%B8%AC%E8%A9%A6%E7%9A%84%E5%86%B0%E5%B1%B1%E6%AF%94%E5%96%BB">軟體測試的「冰山比喻」</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 動態執行就像用手電筒照海面，每次只能照亮特定情境；靜態檢視則是抽乾海水，全面盤點結構問題。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A7%8A-%E7%82%BA%E4%BD%95%E5%8B%95%E6%85%8B%E6%B8%AC%E8%A9%A6%E5%8F%AA%E8%83%BD%E7%9C%8B%E5%88%B0%E5%86%B0%E5%B1%B1%E4%B8%80%E8%A7%92"><img class="emoji" draggable="false" alt="🧊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ca.svg" data-marp-twemoji=""/> 為何動態測試只能看到冰山一角？</h3>
<ul>
<li><strong>路徑覆蓋限制</strong>：現代系統狀態組合龐大，動態測試受限於測資與環境，很多邊界邏輯極難被觸發。</li>
<li><strong>錯誤遮蔽效應</strong>：前段發生的錯誤往往遮蔽後續邏輯，使多個致命缺陷無法在單次測試中被同時揭露。</li>
<li><strong>程式碼範例警示</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span>; i &lt; max; i++) { ... } <span class="hljs-comment">// 陣列下標從 1 開始？</span>
</code></pre>
資深工程師一眼就能看出 <code>i = 1</code> 漏掉索引 0，但動態測試若測資剛好沒驗證首個元素，錯誤便永遠沉入海底。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/testing_iceberg.jpg" alt="Testing Iceberg" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.1 基本概念 [►](#9)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:[◄](#2) 4.1 基本概念 [►](#9);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.1 基本概念 <a href="#9">►</a></header>

<h2 id="%E9%9D%9C%E6%85%8B%E6%AA%A2%E8%A6%96-vs-%E5%8B%95%E6%85%8B%E6%B8%AC%E8%A9%A6%E4%BA%92%E8%A3%9C%E8%80%8C%E9%9D%9E%E5%8F%96%E4%BB%A3">靜態檢視 vs. 動態測試：互補而非取代</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體檢視是技術活動，更是建立企業品質文化的「社群活動 (Social Activity)」。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%8D-%E9%9D%9C%E6%85%8B%E6%AA%A2%E8%A6%96%E7%9A%84%E6%A0%B8%E5%BF%83%E5%84%AA%E5%8B%A2"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 靜態檢視的核心優勢</h3>
<ul>
<li><strong>根源性除錯</strong>：單次檢視可同時揪出多個根本缺陷，不受錯誤遮蔽影響。</li>
<li><strong>全生命週期適用</strong>：不只看程式碼，需求規格書、架構圖、測試案例皆可檢視。</li>
<li><strong>知識傳承與文化沉澱</strong>：透過資深與新進工程師交流，建立統一工程標準。</li>
<li><strong>異常早期捕獲</strong>：識別風格不符、未沿用組織元件、資源洩漏等動態難察異常。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%96%EF%B8%8F-%E5%85%A9%E8%80%85%E7%9A%84%E4%BA%92%E8%A3%9C%E6%9C%AC%E8%B3%AA"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 兩者的互補本質</h3>
<ul>
<li><strong>動態測試不可或缺</strong>：效能瓶頸、記憶體抖動、高並發競爭條件等，必須靠動態執行驗證。</li>
<li><strong>不是取代，而是左移互補</strong>：檢視負責在編譯前清掃 70% 語意與架構壞味道，動態測試專注系統整合行為。</li>
<li><strong>反對冷冰冰的批鬥</strong>：檢視的目的是「審查產出物，非評判開發者個人」，營造信任共贏氛圍。</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.1 基本概念 [►](#9)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:[◄](#2) 4.1 基本概念 [►](#9);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.1 基本概念 <a href="#9">►</a></header>

<h2 id="%E8%BB%9F%E9%AB%94%E6%AA%A2%E8%A6%96%E7%9A%84%E5%BF%85%E8%A6%81%E5%89%8D%E7%BD%AE%E6%A2%9D%E4%BB%B6">軟體檢視的必要前置條件</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 沒有規格與準則的檢視只會淪為主觀爭執；成熟的檢視需要制度與資源的強力支撐。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8B-%E6%96%87%E4%BB%B6%E8%88%87%E5%B7%A5%E7%A8%8B%E5%9F%BA%E6%BA%96"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 文件與工程基準</h3>
<ul>
<li><strong>明確基準規格</strong>：必須備妥經確認的需求規格書或架構設計書作為客觀比對基準。</li>
<li><strong>統一組織標準</strong>：團隊成員必須熟知命名規則、架構模式與 Clean Code 守則。</li>
<li><strong>基準版本凍結</strong>：受檢程式碼必須是通過本地編譯與基礎單元測試之特定凍結版本。</li>
<li><strong>準備專業檢核表</strong>：使用結構化 Checklist 導引檢視方向，防止遺漏重要面向。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8F%A2-%E7%AE%A1%E7%90%86%E5%B1%A4%E7%9A%84%E6%89%BF%E8%AB%BE%E8%88%87%E6%96%87%E5%8C%96"><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> 管理層的承諾與文化</h3>
<ul>
<li><strong>接受初期成本投入</strong>：管理者需理解檢視在前期耗費時間，但能數倍節省後期除錯成本。</li>
<li><strong>嚴禁當成員工績效考核</strong>：若將發現的 Bug 數量作為懲處考核，工程師將隱瞞問題。</li>
<li><strong>提供充足準備時間</strong>：確保檢視者在會前有充裕時間研讀程式碼，杜絕倉促走過場。</li>
<li><strong>配置追蹤工具</strong>：配備問題追蹤（Issue Tracking）系統落實缺失修正閉環。</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="[◄](#2) 4.1 基本概念 [►](#9)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:[◄](#2) 4.1 基本概念 [►](#9);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.1 基本概念 <a href="#9">►</a></header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 1)</strong></h4>
<p><strong>問題情境</strong>：<br />
【是非題】靜態測試（如軟體檢視、規格檢視）可以在程式碼實際編譯執行之前，檢查需求、設計、程式碼甚至測試資料中的異常，以早期發現錯誤、大幅降低整體的軟體品質成本。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq1.png" alt="CCQ1 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch04-ccq1">課堂互動</a></p>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="8" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h1 id="42-%E6%AA%A2%E8%A6%96%E6%96%B9%E6%B3%95"><strong>4.2 檢視方法</strong></h1>
<blockquote>
<p>「正式檢視比非正式走查嚴謹數倍；<br />
讓 AI 先行掃雷，人類專家方能聚焦於全局智慧。」</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h2 id="ieee-1028-%E5%AF%A9%E6%9F%A5%E9%AB%94%E7%B3%BB%E6%AA%A2%E8%A6%96-vs-%E8%B5%B0%E6%9F%A5">IEEE 1028 審查體系：檢視 vs. 走查</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 依據 IEEE 1028 標準，不同審查形式在正規度、計畫性與主導角色上有著嚴格區分。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8A-%E5%AF%A9%E6%9F%A5%E5%BD%A2%E5%BC%8F%E5%B0%8D%E7%85%A7%E8%A1%A8"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 審查形式對照表</h3>
<table>
<thead>
<tr>
<th style="text-align:left">維度</th>
<th style="text-align:left">檢視 (Inspection)</th>
<th style="text-align:left">走查 (Walkthrough)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>形式</strong></td>
<td style="text-align:left"><strong>正式 (Formal)</strong></td>
<td style="text-align:left">非正式 (Informal)</td>
</tr>
<tr>
<td style="text-align:left"><strong>計畫</strong></td>
<td style="text-align:left">事先規劃成員角色</td>
<td style="text-align:left">彈性發起、無嚴密計畫</td>
</tr>
<tr>
<td style="text-align:left"><strong>導讀</strong></td>
<td style="text-align:left">獨立導讀者 (Reader)</td>
<td style="text-align:left"><strong>作者本人 (Author)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>記錄</strong></td>
<td style="text-align:left">專屬記錄者 (Scribe)</td>
<td style="text-align:left">通常由作者兼任</td>
</tr>
<tr>
<td style="text-align:left"><strong>主持</strong></td>
<td style="text-align:left"><strong>協調者 (Moderator)</strong></td>
<td style="text-align:left">無正式主持人</td>
</tr>
</tbody>
</table>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E9%81%A9%E7%94%A8%E5%A0%B4%E6%99%AF%E8%88%87%E6%B1%BA%E7%AD%96%E8%80%83%E9%87%8F"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 適用場景與決策考量</h3>
<ul>
<li><strong>檢視 (Inspection)</strong>：
<ul>
<li>核心關鍵模組、高風險規格、架構重大變更。</li>
<li>強調以客觀第三者角度找出缺陷，防範作者當局者迷。</li>
</ul>
</li>
<li><strong>走查 (Walkthrough)</strong>：
<ul>
<li>新人教育訓練、早期概念探索、團隊技術分享。</li>
<li>主要目的在於傳達設計思維，而非嚴格的品質把關。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h2 id="fagan-%E6%AA%A2%E8%A6%96-6-%E5%A4%A7%E6%A8%99%E6%BA%96%E6%AD%A5%E9%A9%9F">Fagan 檢視 6 大標準步驟</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 1976 年 IBM Michael Fagan 提出的經典檢視流程，被軟體工程界公認為最具實效的除錯典範。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%94%84-%E5%85%AD%E5%A4%A7%E6%A8%99%E6%BA%96%E6%AD%A5%E9%A9%9F%E6%8E%A8%E9%80%B2"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 六大標準步驟推進</h3>
<ul>
<li><strong>1. 計畫 (Planning)</strong>：指派角色、分配職責、排定時間表。</li>
<li><strong>2. 概述 (Overview)</strong>：由作者向小組簡報背景脈絡與規格規則。</li>
<li><strong>3. 個別準備 (Preparation)</strong>：檢視者會前獨立研讀材料，標記潛在缺陷。</li>
<li><strong>4. 檢視會議 (Meeting)</strong>：導讀者逐段朗讀，聚焦找錯、記錄，<strong>不辯論解法</strong>。</li>
<li><strong>5. 重做 (Rework)</strong>：作者依缺失清單修改文件或程式碼。</li>
<li><strong>6. 追蹤再檢 (Follow-up)</strong>：由主席確認所有修正通過驗收。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/inspection_flow.jpg" alt="Inspection Flow" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h2 id="%E6%AA%A2%E8%A6%96%E5%9C%98%E9%9A%8A-5-%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A7%92%E8%89%B2%E5%88%86%E5%B7%A5">檢視團隊 5 大核心角色分工</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 清楚的角色分工能避免「原作者自圓其說」與「會議淪為個人批鬥」的無效困境。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%91%A5-%E4%B8%BB%E6%8C%81%E5%B0%8E%E8%AE%80%E8%88%87%E8%A8%98%E9%8C%84"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> 主持、導讀與記錄</h3>
<ul>
<li><strong>主席/協調者 (Moderator)</strong>：
<ul>
<li>會議靈魂人物，嚴格控管時間、化解衝突、維持議程聚焦於「找錯而非爭辯解法」。</li>
</ul>
</li>
<li><strong>導讀者/報告者 (Reader)</strong>：
<ul>
<li>由非作者的資深同儕逐段朗讀並轉譯邏輯，藉由口頭轉述迅速暴露邏輯盲點。</li>
</ul>
</li>
<li><strong>記錄者 (Scribe)</strong>：
<ul>
<li>專注登錄缺陷類型、嚴重程度與修復負責人，產出結構化行動清單 (Action Items)。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E4%BD%9C%E8%80%85%E8%88%87%E6%AA%A2%E8%A6%96%E5%B0%88%E5%AE%B6"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 作者與檢視專家</h3>
<ul>
<li><strong>作者/擁有者 (Author)</strong>：
<ul>
<li>負責在 Overview 階段簡報背景，在會議中保持聆聽，會後負責缺陷修復。</li>
</ul>
</li>
<li><strong>檢視者 (Reviewer / Inspector)</strong>：
<ul>
<li>獨立審查員，從架構、效能、資安、邊界條件等多維度深入審查。</li>
</ul>
</li>
<li><strong>關鍵守則</strong>：
<ul>
<li>檢視速率應控制在 <strong>200 ~ 400 LOC/Hr</strong>，超過此速率遺漏率將急遽上升。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h2 id="2026-ai-%E8%BC%94%E5%8A%A9%E7%8F%BE%E4%BB%A3%E6%AA%A2%E8%A6%96%E5%85%B8%E7%AF%84%E8%BD%89%E7%A7%BB">2026 AI 輔助現代檢視：典範轉移</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 流程革命：從傳統「耗時耗力的純人工會議」，轉向「AI 機器人先行掃雷 + 人類專家深層把關」。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A4%96-ai-%E6%99%82%E4%BB%A3%E4%BA%BA%E6%A9%9F%E5%8D%94%E5%90%8C%E5%85%A9%E9%9A%8E%E6%AE%B5"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI 時代人機協同兩階段</h3>
<ul>
<li><strong>Stage 1: AI 第一道防線（靜態審查）</strong>：
<ul>
<li>開發者送出 Pull Request 時，AI PR 機器人（如 PR-Agent、Cursor）自動分析變更。</li>
<li>10 秒內掃除命名風格、未釋放資源、空指標風險與常見漏洞，並產出變更摘要。</li>
</ul>
</li>
<li><strong>Stage 2: 人類專家複審（聚焦智慧）</strong>：
<ul>
<li>人類審查員無需浪費精力看語法格式，全神貫注於 <strong>全局系統架構、商業領域邏輯正確性與高並發狀態不變量</strong>。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/ai_assisted_inspection.jpg" alt="AI-Assisted Inspection" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.2 檢視方法 [►](#18)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:[◄](#2) 4.2 檢視方法 [►](#18);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.2 檢視方法 <a href="#18">►</a></header>

<h2 id="%E6%AA%A2%E8%A6%96%E8%A7%92%E8%89%B2%E7%9A%84-ai-%E8%B3%A6%E8%83%BD%E8%88%87%E7%B5%82%E6%A5%B5%E9%98%B2%E7%B7%9A">檢視角色的 AI 賦能與終極防線</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 雖然強大但存在幻覺與上下文盲區；人類工程師的最終決策依然是系統品質的終極守門人。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A1-%E8%A7%92%E8%89%B2%E8%B3%A6%E8%83%BD%E5%8D%87%E7%B4%9A"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 角色賦能升級</h3>
<ul>
<li><strong>作者 (Author) ── 本地自檢預防</strong>：
<ul>
<li>在 IDE 內藉由 AI 進行 <code>/review</code>，在程式碼 Push 前掃除 80% 低階瑕疵。</li>
</ul>
</li>
<li><strong>記錄者 (Scribe) ── 語音即時轉文字</strong>：
<ul>
<li>會議中藉由 STT 工具自動分類缺陷，即時生成 Jira 任務與責任歸屬。</li>
</ul>
</li>
<li><strong>檢視者 (Reviewer) ── 智慧對話式審查</strong>：
<ul>
<li>讓 AI 模擬攻擊者視角或生成 10 組極端極限邊界測試案例輔助驗證。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A0%EF%B8%8F-ai-%E5%AF%A9%E6%9F%A5%E7%9A%84%E7%9B%B2%E9%BB%9E%E8%88%87%E8%AD%A6%E8%A8%8A"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> AI 審查的盲點與警訊</h3>
<ul>
<li><strong>上下文遺失 (Context Loss)</strong>：AI 往往只看局部 Diff，無法洞察微服務分散式架構下的漣漪效應。</li>
<li><strong>一本正經胡說八道 (Hallucination)</strong>：給出看似精美但引用過期或不存在套件的修改建議。</li>
<li><strong>工程結論</strong>：
<blockquote>
<p>AI 是極佳的初審助手，但絕不能省略人類專家的架構決策與業務邏輯驗證！</p>
</blockquote>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 2)</strong></h4>
<p><strong>問題情境</strong>：<br />
在 Fagan 提出的軟體檢視（Inspection）標準流程中，下列哪一個階段的主要目的是由作者向檢視小組說明系統背景資料、規格與業務規則，而非進行實際的程式碼除錯？</p>
<ul>
<li><strong>A)</strong> 準備 (Preparation)</li>
<li><strong>B)</strong> 概述 (Overview)</li>
<li><strong>C)</strong> 檢視會議 (Inspection Meeting)</li>
<li><strong>D)</strong> 重做 (Rework)</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq2.png" alt="CCQ2 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch04-ccq2">課堂互動</a></p>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="[◄](#2) 4.3 規格檢視 [►](#26)" data-footer="Ch04 軟體檢視" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="15" style="--paginate:true;--header:[◄](#2) 4.3 規格檢視 [►](#26);--footer:Ch04 軟體檢視;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h1 id="43-%E8%A6%8F%E6%A0%BC%E6%AA%A2%E8%A6%96"><strong>4.3 規格檢視</strong></h1>
<blockquote>
<p>「規格書寫錯一條，後續將以十倍工時重做；<br />
規格檢視是投資回報率最高的除錯手段。」</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.3 規格檢視 [►](#26)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:[◄](#2) 4.3 規格檢視 [►](#26);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h2 id="%E7%B3%BB%E7%B5%B1%E8%A6%8F%E6%A0%BC%E6%9B%B8-srs-8-%E5%A4%A7%E6%A0%B8%E5%BF%83%E5%93%81%E8%B3%AA%E5%B1%AC%E6%80%A7">系統規格書 (SRS) 8 大核心品質屬性</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體需求規格書 (SRS) 是整個系統工程的基石；好的規格必須兼具技術嚴謹度與客觀驗證性。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%8E%AF-%E8%A6%8F%E6%A0%BC%E6%AA%A2%E9%A9%97%E6%A0%B8%E5%BF%83%E7%B6%AD%E5%BA%A6"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 規格檢驗核心維度</h3>
<ul>
<li><strong>1. 正確性 (Correct)</strong>：每項要求皆準確代表系統真實建構目標。</li>
<li><strong>2. 無歧義 (Unambiguous)</strong>：敘述只有唯一解讀，杜絕模糊空間。</li>
<li><strong>3. 完整性 (Complete)</strong>：涵蓋所有功能、極端異常與邊界條件。</li>
<li><strong>4. 可驗證性 (Verifiable)</strong>：存在有限成本的客觀檢驗過程。</li>
<li><strong>5. 一致性 (Consistent)</strong>：內外部條款彼此不衝突、不矛盾。</li>
<li><strong>6. 雙向追溯 (Traceable)</strong>：具備前向與後向追溯性。</li>
<li><strong>7. 設計獨立 (Design-Independent)</strong>：只定義 What，不限制 How。</li>
<li><strong>8. 易理解性 (Understandable)</strong>：利害關係人皆能輕易讀懂。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/srs_quality_attributes.jpg" alt="SRS Quality Attributes" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.3 規格檢視 [►](#26)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:[◄](#2) 4.3 規格檢視 [►](#26);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h2 id="%E8%A6%8F%E6%A0%BC%E9%9B%99%E5%90%91%E8%BF%BD%E6%BA%AF%E6%80%A7-bidirectional-traceability">規格雙向追溯性 (Bidirectional Traceability)</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 雙向追溯能保證「不漏掉任何客戶需求」，同時杜絕工程師「憑空實作鍍金功能」。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%97-%E5%89%8D%E5%90%91%E8%BF%BD%E6%BA%AF-traceable-forward"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 前向追溯 (Traceable Forward)</h3>
<ul>
<li><strong>從需求向後看</strong>：
<ul>
<li>確保每一條「客戶需求 (User Need)」都能映射到具體的「系統規格 (SRS)」。</li>
<li>規格再進一步對應到架構模組、實作程式碼與測試案例。</li>
</ul>
</li>
<li><strong>工程效益</strong>：
<ul>
<li>避免需求流失，確保 100% 的客戶承諾都被落實與測試。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%99-%E5%BE%8C%E5%90%91%E5%9B%9E%E6%BA%AF-traced-backward"><img class="emoji" draggable="false" alt="🔙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f519.svg" data-marp-twemoji=""/> 後向回溯 (Traced Backward)</h3>
<ul>
<li><strong>從程式碼與測試往前看</strong>：
<ul>
<li>每一行程式碼、每一個 API、每一個測試案例都能回溯找到其來源需求。</li>
</ul>
</li>
<li><strong>工程效益</strong>：
<ul>
<li>杜絕<strong>鍍金行為 (Gold Plating)</strong>（實作未被授權且不必要的自嗨功能）。</li>
<li>當需求變更時，能立即進行「衝擊分析 (Impact Analysis)」。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.3 規格檢視 [►](#26)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:[◄](#2) 4.3 規格檢視 [►](#26);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h2 id="%E8%A6%8F%E6%A0%BC%E6%9B%B8-7-%E5%A4%A7%E6%92%B0%E5%AF%AB%E5%AF%A6%E6%88%B0%E6%BA%96%E5%89%87">規格書 7 大撰寫實戰準則</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 優秀的規格書能大幅降低工程溝通成本；掌握 7 大撰寫準則，消滅潛在需求模糊性。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%E2%9C%8D%EF%B8%8F-%E5%AF%A6%E5%8B%99%E6%AA%A2%E6%A0%B8%E6%B8%85%E5%96%AE-writing-tips">✍️ 實務檢核清單 (Writing Tips)</h3>
<ul>
<li><strong>1. 結構化排版 (Structured)</strong>：目錄、章節、術語縮寫定義表完整。</li>
<li><strong>2. 視覺架構圖 (Visual)</strong>：圖文並茂，圖形符號前後一致並附解說。</li>
<li><strong>3. 具體範例 (Concrete)</strong>：複雜算式附帶文字解釋與至少 2 個數據實例。</li>
<li><strong>4. 精確用詞 (Precise)</strong>：消滅「一些、通常、等等、依此類推」。</li>
<li><strong>5. 務實邊界 (Realistic)</strong>：慎用「總是、所有、絕不」，防極端失真。</li>
<li><strong>6. 主動語態 (Active Voice)</strong>：指明主體，避免「參數會被初始化」。</li>
<li><strong>7. 明確版本 (Explicit Versions)</strong>：精確標明支援的協定與套件版本。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/srs_writing_tips.jpg" alt="SRS Writing Tips" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.3 規格檢視 [►](#26)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:[◄](#2) 4.3 規格檢視 [►](#26);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h2 id="%E8%A6%8F%E6%A0%BC%E5%A5%BD%E5%A3%9E%E5%AF%A6%E6%88%B0%E7%AF%84%E4%BE%8B%E5%B0%8D%E6%8A%97">規格好壞實戰範例對抗</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 一個模糊的字眼，在實作階段會被解讀出十種不同版本；規格必須消除所有臆測空間。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%8C-%E5%8A%A3%E8%B3%AA%E8%A6%8F%E6%A0%BC%E6%95%98%E8%BF%B0-ambiguous--passive"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 劣質規格敘述 (Ambiguous &amp; Passive)</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 「系統應具備良好的回應速度，並適當支援行動裝置。」
<ul>
<li><em>問題：什麼叫「良好」？哪些行動裝置？</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 「使用者輸入錯誤時，參數會被重置，相關資訊將被記錄等等。」
<ul>
<li><em>問題：被動句、誰來重置？「等等」包含什麼？</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 「系統應總是防範所有惡意攻擊，絕不當機。」
<ul>
<li><em>問題：過度絕對、脫離現實且不可驗證。</em></li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9C%85-%E5%84%AA%E8%B3%AA%E8%A6%8F%E6%A0%BC%E6%95%98%E8%BF%B0-verifiable--precise"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 優質規格敘述 (Verifiable &amp; Precise)</h3>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 「在 1,000 並發使用者下，結帳 API 的 95 百分位響應時間需小於 1.2 秒；UI 需通過 iOS Safari 16+ 與 Android Chrome 110+ 渲染相容性測試。」</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 「若帳號密碼驗證失敗，認證模組 (AuthService) 需累計嘗試次數，超過 5 次時鎖定帳號 15 分鐘，並向 AuditLog 寫入安全事件紀錄。」</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>

<header><a href="#2">◄</a> 4.3 規格檢視 <a href="#26">►</a></header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3">概念核對問答 (CCQ 3)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 3)</strong></h4>
<p><strong>問題情境</strong>：<br />
為了在需求與系統規格階段落實「雙向追溯 (Bidirectional Traceability)」，規格書應該確保具備下列何種關係特性？</p>
<ul>
<li><strong>A)</strong> 每個使用者需求均可對應到特定的系統規格，且每個系統規格皆能回溯到其來源需求 (Traced &amp; Traceable)</li>
<li><strong>B)</strong> 規格書的字數與最終系統原始程式碼行數必須成固定正比關係</li>
<li><strong>C)</strong> 每一行程式碼都必須直接對應到 UML 類別圖的所有屬性</li>
<li><strong>D)</strong> 規格書必須僅由開發人員撰寫，完全不允許顧客檢閱以防模糊焦點</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq3.png" alt="CCQ3 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch04-ccq3">課堂互動</a></p>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>

<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h1 id="44-%E8%A8%AD%E8%A8%88%E6%AA%A2%E8%A6%96"><strong>4.4 設計檢視</strong></h1>
<blockquote>
<p>「程式碼是磚瓦，架構設計才是地基；<br />
挽救一個錯誤的架構，往往需要拆毀整棟大樓。」</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="[◄](#2) 4.4 設計檢視 [►](#34)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:[◄](#2) 4.4 設計檢視 [►](#34);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h2 id="%E8%A8%AD%E8%A8%88%E6%AA%A2%E8%A6%96%E7%9A%84%E6%A0%B8%E5%BF%83%E7%9B%AE%E7%9A%84%E8%88%87%E5%A4%9A%E7%B6%AD%E5%BA%A6%E6%B8%85%E5%96%AE">設計檢視的核心目的與多維度清單</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計檢視 (Design Review) 是在 Coding 之前，針對架構模組、介面協定與資料庫 Schema 的靜態審查。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%8F%9B%EF%B8%8F-%E4%BA%94%E5%A4%A7%E6%A0%B8%E5%BF%83%E6%AA%A2%E6%A0%B8%E7%B6%AD%E5%BA%A6"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 五大核心檢核維度</h3>
<ul>
<li><strong>1. 實體與介面完整性</strong>：
<ul>
<li>各模組具備唯一職責，介面契約（方法、參數、回傳值、前置/後置條件）精準無遺漏。</li>
</ul>
</li>
<li><strong>2. 高內聚與低耦合</strong>：
<ul>
<li>符合 High Cohesion, Low Coupling，杜絕循環依賴。</li>
</ul>
</li>
<li><strong>3. 需求追溯與功能完整</strong>：
<ul>
<li>逐一對照 SRS 需求，確保架構具備工程可行性。</li>
</ul>
</li>
<li><strong>4. 多維度架構視角</strong>：
<ul>
<li>涵蓋邏輯視角 (類別)、行程視角 (並行) 與實體部署視角。</li>
</ul>
</li>
<li><strong>5. 關鍵非功能議題</strong>：
<ul>
<li>例外復原、快取失效、單點故障 (SPOF) 與資源安全防護。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/design_review.jpg" alt="Design Review" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.4 設計檢視 [►](#34)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:[◄](#2) 4.4 設計檢視 [►](#34);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h2 id="%E8%A8%AD%E8%A8%88%E6%A8%A1%E5%9E%8B%E6%AA%A2%E6%A0%B8dfd-4-%E5%A4%A7%E6%A0%B8%E5%BF%83%E5%85%83%E7%B4%A0">設計模型檢核：DFD 4 大核心元素</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 資料流程圖 (DFD) 為結構化分析利器；利用語法嚴謹的模型特徵能進行高效率檢核。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%93%8A-dfd-%E5%9B%9B%E5%A4%A7%E8%A6%81%E7%B4%A0%E6%AA%A2%E6%A0%B8%E6%A8%99%E6%BA%96"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> DFD 四大要素檢核標準</h3>
<ul>
<li><strong>1. 外部實體 (External Entity)</strong>：
<ul>
<li>系統邊界外的發送或接收者（人員或外部系統），絕不能直接存取內部資料儲存。</li>
</ul>
</li>
<li><strong>2. 處理過程 (Process)</strong>：
<ul>
<li>執行資料轉換，名稱必須以「<strong>動詞 + 名詞</strong>」命名（如「計算折扣」）。</li>
<li><strong>平衡法則</strong>：每個 Process 必須至少有 1 個輸入與 1 個輸出（無輸入為黑洞，無輸出為奇蹟）。</li>
</ul>
</li>
<li><strong>3. 資料儲存 (Data Store)</strong>：
<ul>
<li>靜態儲存庫，必須至少有 1 個輸入（寫入）與 1 個輸出（讀取）。</li>
</ul>
</li>
<li><strong>4. 資料流 (Data Flow)</strong>：
<ul>
<li>有向箭頭，必須明確標註名詞資料標籤。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/dfd_core_elements.jpg" alt="DFD Elements" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.4 設計檢視 [►](#34)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:[◄](#2) 4.4 設計檢視 [►](#34);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h2 id="dfd-%E5%AF%A6%E6%88%B0%E6%AA%A2%E6%A0%B8%E8%A8%82%E5%96%AE%E8%99%95%E7%90%86%E6%B5%81%E7%A8%8B">DFD 實戰檢核：訂單處理流程</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過標準 DFD 流程圖檢驗：資料流向是否合規？處理過程與資料儲存是否皆維持平衡？</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%93%A6-%E8%A8%82%E5%96%AE%E8%99%95%E7%90%86%E6%AA%A2%E6%A0%B8%E9%8F%88%E6%A2%9D"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 訂單處理檢核鏈條</h3>
<ul>
<li><strong>流程步序對照</strong>：
<ul>
<li><code>1. 提交訂單 (Place Order)</code>：顧客 (Customer) ➔ P1 訂單處理。</li>
<li><code>2. 檢查庫存 (Check Stock)</code>：P1 ➔ D1 庫存資料庫（讀取查詢）。</li>
<li><code>3. 庫存狀態 (Stock Status)</code>：D1 ➔ P1（回傳即時狀態）。</li>
<li><code>4. 寫入訂單 (Save Order)</code>：P1 ➔ D2 訂單資料庫（寫入記錄）。</li>
<li><code>5. 出貨確認 (Order Confirmation)</code>：P1 ➔ 顧客（回傳通知）。</li>
</ul>
</li>
<li><strong>檢核合規性分析</strong>：
<ul>
<li>P1 具備 2 輸入、3 輸出 ➔ <strong>完全平衡</strong>。</li>
<li>D1/D2 皆具備讀寫機制 ➔ <strong>合乎邏輯</strong>。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/dfd_order_flow.jpg" alt="DFD Order Flow" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.4 設計檢視 [►](#34)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:[◄](#2) 4.4 設計檢視 [►](#34);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h2 id="ai-%E8%B3%A6%E8%83%BD%E7%8F%BE%E4%BB%A3%E8%A8%AD%E8%A8%88%E6%AA%A2%E8%A6%96%E5%A8%81%E8%84%85%E5%BB%BA%E6%A8%A1%E8%88%87%E5%A5%91%E7%B4%84%E6%AA%A2%E6%9F%A5">AI 賦能現代設計檢視：威脅建模與契約檢查</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 利用大型語言模型模擬駭客視角與極端情境，讓架構設計在動工前就接受震撼教育。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-ai-%E5%A8%81%E8%84%85%E5%BB%BA%E6%A8%A1%E8%88%87%E9%A2%A8%E9%9A%AA%E6%8E%A8%E6%BC%94"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> AI 威脅建模與風險推演</h3>
<ul>
<li><strong>架構輸入模擬</strong>：
<ul>
<li>將架構圖或 OpenAPI Spec 輸入 AI，讓 AI 代理以 STRIDE 模型進行威脅推演。</li>
</ul>
</li>
<li><strong>主動標記漏洞</strong>：
<ul>
<li>自動識別潛在風險：單點故障 (SPOF)、快取穿透/雪崩、資料庫連線池耗盡與分散式死結。</li>
</ul>
</li>
<li><strong>容錯與降級建議</strong>：
<ul>
<li>建議熔斷機制（Circuit Breaker）、限流（Rate Limiting）與重試指數退避策略。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%9C-api-%E5%A5%91%E7%B4%84%E8%88%87-db-schema-%E5%AF%A9%E6%9F%A5"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> API 契約與 DB Schema 審查</h3>
<ul>
<li><strong>OpenAPI 規範一致性</strong>：
<ul>
<li>自動比對 RESTful URI 命名規則、HTTP 方法語意、錯誤碼規格（如 400, 401, 403, 404, 500）。</li>
</ul>
</li>
<li><strong>資料庫 Schema 審查</strong>：
<ul>
<li>分析 DDL 腳本，檢查外鍵是否遺漏索引、評估高頻欄位資料型態過大問題、檢查關聯刪除風險。</li>
</ul>
</li>
<li><strong>合約測試生成</strong>：
<ul>
<li>依據審查後的介面設計自動產出 Pact 測試腳本。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="[◄](#2) 4.4 設計檢視 [►](#34)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:[◄](#2) 4.4 設計檢視 [►](#34);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.4 設計檢視 <a href="#34">►</a></header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4">概念核對問答 (CCQ 4)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 4)</strong></h4>
<p><strong>問題情境</strong>：<br />
【是非題】設計檢視（Design Review）最理想的執行時機，是在系統所有模組的單元測試與整合測試皆通過之後，以確保實際產出的系統程式碼與設計文件完全相符。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq4.png" alt="CCQ4 QR Code" />

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="27" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h1 id="45-%E7%A8%8B%E5%BC%8F%E7%A2%BC%E6%AA%A2%E8%A6%96"><strong>4.5 程式碼檢視</strong></h1>
<blockquote>
<p>「任何笨蛋都能寫出電腦看得懂的程式碼；<br />
優秀的工程師寫的是人類看得懂的程式碼。」<br />
—— Martin Fowler</p>
</blockquote>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E7%A8%8B%E5%BC%8F%E7%A2%BC%E6%AA%A2%E8%A6%96-5-%E5%A4%A7%E9%8C%AF%E8%AA%A4%E9%A1%9E%E5%9E%8B">程式碼檢視 5 大錯誤類型</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 呼應第二章 Clean Code 心法，程式碼檢視將開發者個人自律昇華為「團隊制度化防禦防線」。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%94%8D-%E9%9D%9C%E6%85%8B%E6%AA%A2%E8%A6%96-5-%E5%A4%A7%E8%87%B4%E5%91%BD%E7%BC%BA%E9%99%B7%E7%B6%AD%E5%BA%A6"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 靜態檢視 5 大致命缺陷維度</h3>
<ul>
<li><strong>1. 資料錯誤 (Data Faults)</strong>：
<ul>
<li>變數未初始化即讀取、重複賦值未讀取、陣列越界、浮點數精準度陷阱。</li>
</ul>
</li>
<li><strong>2. 控制流程錯誤 (Control Faults)</strong>：
<ul>
<li>無效死碼 (Unreachable Dead Code)、無窮迴圈、深層巢狀階梯。</li>
</ul>
</li>
<li><strong>3. 輸入/輸出錯誤 (I/O Faults)</strong>：
<ul>
<li>檔案串流或資料庫連線未關閉、緩衝區溢位、未處理 I/O 例外。</li>
</ul>
</li>
<li><strong>4. 介面錯誤 (Interface Faults)</strong>：
<ul>
<li>參數型態/數量不吻合、忽略回傳值、未被呼叫的孤立函式。</li>
</ul>
</li>
<li><strong>5. 編碼規範違反 (Coding Standards)</strong>：
<ul>
<li>違反安全規範、架構分層穿透、魔術數字濫用。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/code_inspection_categories.jpg" alt="Code Inspection Categories" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E5%9C%98%E9%9A%8A-clean-code-%E5%AF%A9%E6%9F%A5%E6%9F%A5%E6%A0%B8%E6%B8%85%E5%96%AE-checklist">團隊 Clean Code 審查查核清單 (Checklist)</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過團隊 Checklists 讓 Code Review 具備一致的客觀尺度，避免流於個人主觀風格偏好。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-%E7%B5%90%E6%A7%8B%E8%88%87%E6%8E%A7%E5%88%B6%E6%B5%81%E7%A8%8B%E6%AA%A2%E6%A0%B8"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 結構與控制流程檢核</h3>
<ul>
<li><strong>命名自明性</strong>：
<ul>
<li>名稱是否能精確表達意圖？杜絕 <code>temp</code>, <code>a1</code> 等神祕縮寫與魔術數字。</li>
</ul>
</li>
<li><strong>函式單一職責 (SRP)</strong>：
<ul>
<li>函式是否只做一件事？長度是否控制在 20 行以內？</li>
</ul>
</li>
<li><strong>控制流程複雜度</strong>：
<ul>
<li>是否運用<strong>衛語句 (Guard Clauses)</strong> 提早回傳？巢狀是否杜絕超過 2 層？</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E9%98%B2%E7%A6%A6%E6%80%A7%E8%88%87%E6%B8%AC%E8%A9%A6%E4%BF%9D%E8%AD%B7%E5%8A%9B"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 防禦性與測試保護力</h3>
<ul>
<li><strong>註解有效性</strong>：
<ul>
<li>註解是否只解釋「為什麼 (Why)」而非重複程式碼「做了什麼 (What)」？杜絕死碼殭屍註解。</li>
</ul>
</li>
<li><strong>健壯防禦性</strong>：
<ul>
<li>是否使用 Exception 取代錯誤碼？是否杜絕傳遞與回傳 <code>null</code>？杜絕空 catch 吞例外。</li>
</ul>
</li>
<li><strong>測試保護力</strong>：
<ul>
<li>提交的 PR 是否附帶單元測試？邊界案例是否具備對應驗證？</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="30" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E7%A8%8B%E5%BC%8F%E8%87%AD%E5%91%B3-code-smells-%E6%A6%82%E5%BF%B5%E8%88%87%E9%AB%94%E7%B3%BB">程式臭味 (Code Smells) 概念與體系</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Clean Code 是健康目標，Code Smells 是病徵警訊，Refactoring (重構) 則是處方藥。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A6%A8-%E4%BB%80%E9%BA%BC%E6%98%AF%E7%A8%8B%E5%BC%8F%E7%A2%BC%E8%87%AD%E5%91%B3"><img class="emoji" draggable="false" alt="🦨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9a8.svg" data-marp-twemoji=""/> 什麼是程式碼臭味？</h3>
<ul>
<li><strong>名詞起源</strong>：由 Kent Beck 與 Martin Fowler 提出，指程式碼表面看似能正確編譯執行，但結構上已顯露出腐化跡象。</li>
<li><strong>核心危害</strong>：
<ul>
<li>臭味大幅降低可讀性，大幅提高後續維護與擴充成本。</li>
<li>是系統缺陷、效能惡化與技術債 (Technical Debt) 的主要溫床。</li>
</ul>
</li>
<li><strong>重構手法 (Refactoring)</strong>：
<ul>
<li>在不改變軟體外部行為的前提下，逐步調整內部結構，消除臭味、重返 Clean Code。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/code_smells.jpg" alt="Code Smells" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="31" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E7%B6%93%E5%85%B8%E7%A8%8B%E5%BC%8F%E8%87%AD%E5%91%B3%E5%89%96%E6%9E%90-%E4%B8%80%E8%82%A5%E5%A4%A7%E8%88%87%E7%B5%90%E6%A7%8B%E5%A4%B1%E8%AA%BF">經典程式臭味剖析 (一)：肥大與結構失調</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當類別與函式承載過多責任時，系統將失去彈性並成為人人不敢觸碰的「巨石怪獸」。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%90%98-%E8%82%A5%E5%A4%A7%E9%A1%9E%E5%88%A5%E8%88%87%E5%86%97%E9%95%B7%E6%96%B9%E6%B3%95"><img class="emoji" draggable="false" alt="🐘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f418.svg" data-marp-twemoji=""/> 肥大類別與冗長方法</h3>
<ul>
<li><strong>重複程式碼 (Duplicated Code)</strong>：
<ul>
<li>罪惡之首！修復了一處卻遺漏另一處。</li>
<li><strong>解法</strong>：提煉方法 (Extract Method) 或提升至父類別。</li>
</ul>
</li>
<li><strong>冗長方法 (Long Method)</strong>：
<ul>
<li>超過 100 行甚至 1000 行的怪獸函式。</li>
<li><strong>解法</strong>：依處理邏輯提煉子方法，提高抽象層次。</li>
</ul>
</li>
<li><strong>大類別 (Large Class)</strong>：
<ul>
<li>包含數十個欄位與責任的大鍋菜。</li>
<li><strong>解法</strong>：依職責提煉新類別 (Extract Class)。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%92-%E5%8F%83%E6%95%B8%E5%88%97%E8%88%87%E5%9E%8B%E5%88%A5%E5%81%8F%E5%9F%B7"><img class="emoji" draggable="false" alt="🎒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f392.svg" data-marp-twemoji=""/> 參數列與型別偏執</h3>
<ul>
<li><strong>太長的參數列 (Long Parameter List)</strong>：
<ul>
<li>函式傳入 8~10 個參數，呼叫時極易傳錯位置。</li>
<li><strong>解法</strong>：將參數封裝為參數物件 (Introduce Parameter Object)。</li>
</ul>
</li>
<li><strong>基本型別偏執 (Primitive Obsession)</strong>：
<ul>
<li>堅持用 <code>String</code> 或 <code>int</code> 表達電話、幣別、經緯度。</li>
<li><strong>解法</strong>：建立微型值物件 (Value Object，如 <code>Money</code>, <code>Phone</code>)。</li>
</ul>
</li>
<li><strong>資料泥團 (Data Clumps)</strong>：
<ul>
<li>總是一起出現的欄位（如城市、街道、郵遞區號）。</li>
<li><strong>解法</strong>：抽取成 <code>Address</code> 物件類別。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E7%B6%93%E5%85%B8%E7%A8%8B%E5%BC%8F%E8%87%AD%E5%91%B3%E5%89%96%E6%9E%90-%E4%BA%8C%E8%80%A6%E5%90%88%E8%88%87%E8%81%B7%E8%B2%AC%E9%8C%AF%E7%BD%AE">經典程式臭味剖析 (二)：耦合與職責錯置</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 類別之間的關係應該是「相敬如賓」，過度依賴與親密將導致動一髮而動全身的骨牌效應。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%97-%E8%AE%8A%E6%9B%B4%E9%98%BB%E7%A4%99%E8%88%87%E6%95%A3%E5%BD%88%E6%89%8B%E8%A1%93"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 變更阻礙與散彈手術</h3>
<ul>
<li><strong>散彈槍手術 (Shotgun Surgery)</strong>：
<ul>
<li>改動一個業務邏輯，必須在 10 個不同檔案中各改一行。</li>
<li><strong>解法</strong>：將該變更概念搬移集中到單一模組 (Move Method / Field)。</li>
</ul>
</li>
<li><strong>發散變更 (Divergent Change)</strong>：
<ul>
<li>一個類別因為資料庫改動要修、因為報表格式改動也要修。</li>
<li><strong>解法</strong>：依變更軸心拆分類別，符合單一職責原則。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A4%9D-%E8%81%B7%E8%B2%AC%E9%8C%AF%E7%BD%AE%E8%88%87%E8%A6%AA%E5%AF%86%E9%97%9C%E4%BF%82"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f91d.svg" data-marp-twemoji=""/> 職責錯置與親密關係</h3>
<ul>
<li><strong>依戀情結 (Feature Envy)</strong>：
<ul>
<li>類別 A 的某個方法頻繁呼叫類別 B 的 getter 進行運算。</li>
<li><strong>解法</strong>：將該方法直接搬移至類別 B 中 (Move Method)。</li>
</ul>
</li>
<li><strong>過度的訊息串 (Message Chains)</strong>：
<ul>
<li>出現 <code>a.getB().getC().getD().doSomething()</code> 鏈條。</li>
<li><strong>解法</strong>：隱藏委託 (Hide Delegate)，遵循迪米特法則。</li>
</ul>
</li>
</ul>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="%E5%AE%89%E5%85%A8%E6%BC%8F%E6%B4%9E%E6%AA%A2%E8%A6%96owasp-top-10-%E5%85%A8%E6%99%AF">安全漏洞檢視：OWASP Top 10 全景</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 程式碼檢視不僅防範邏輯缺陷，更必須築起嚴密的資安防線；SAST 工具是落實安全的最佳盟友。</p>
</blockquote>
</li>
</ul>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E6%AC%8A%E5%A8%81%E8%B3%87%E5%AE%89%E6%8C%87%E9%87%9D-owasp-top-10"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 權威資安指針 (OWASP Top 10)</h3>
<ul>
<li><strong>A01 權限控制失效 (Broken Access Control)</strong>：
<ul>
<li>未經授權橫向越權存取他人敏感個資或管理者後台。</li>
</ul>
</li>
<li><strong>A02 加密機制失效 (Cryptographic Failures)</strong>：
<ul>
<li>密碼明文儲存、使用 MD5/SHA1 弱雜湊、配置硬編碼密鑰。</li>
</ul>
</li>
<li><strong>A03 注入攻擊 (Injection)</strong>：
<ul>
<li>SQL 注入、OS 指令注入、跨網站指令碼 (XSS)。</li>
</ul>
</li>
<li><strong>A04 不安全設計 (Insecure Design)</strong>：
<ul>
<li>架構初期缺乏威脅建模與縱深防禦機制。</li>
</ul>
</li>
<li><strong>A05 安全設定錯誤 (Security Misconfiguration)</strong>：
<ul>
<li>預設帳密未改、生產環境暴露詳細錯誤堆疊 (Stack Trace)。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch04/secure_coding.jpg" alt="Secure Coding" /></p>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.5 程式碼檢視 [►](#45)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:[◄](#2) 4.5 程式碼檢視 [►](#45);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.5 程式碼檢視 <a href="#45">►</a></header>

<h2 id="owasp-top-10-%E9%87%8D%E9%BB%9E%E9%98%B2%E8%AD%B7%E8%88%87%E9%9D%9C%E6%85%8B%E5%88%86%E6%9E%90">OWASP Top 10 重點防護與靜態分析</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過 PMD、SonarQube 與 Checkmarx 等靜態分析工具，在 CI/CD 流程中自動攔截惡意漏洞。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%92-%E9%97%9C%E9%8D%B5%E8%B3%87%E5%AE%89%E6%AA%A2%E8%A6%96%E8%A6%81%E9%BB%9E"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 關鍵資安檢視要點</h3>
<ul>
<li><strong>防範 SQL 注入 (A03)</strong>：
<ul>
<li>嚴格禁止字串拼接 SQL，一律採用<strong>參數化查詢 (PreparedStatement)</strong> 或 ORM 框架綁定。</li>
</ul>
</li>
<li><strong>安全錯誤處理 (A05)</strong>：
<ul>
<li>嚴禁直接向前端拋出 <code>e.printStackTrace()</code>；前端回傳通用錯誤代碼，詳細資訊僅寫入後端受保護日誌。</li>
</ul>
</li>
<li><strong>相依套件掃描 (A06)</strong>：
<ul>
<li>透過 OWASP Dependency-Check 盤點第三方 Maven 套件，及時修補 CVE 漏洞。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-pmd-%E9%9D%9C%E6%85%8B%E5%88%86%E6%9E%90%E5%B7%A5%E5%85%B7%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> PMD 靜態分析工具實戰</h3>
<ul>
<li><strong>自動化常規掃描</strong>：
<ul>
<li>自動偵測未使用的變數、未關閉的串流、空 catch 區塊與複雜度超標方法。</li>
</ul>
</li>
<li><strong>品質閘門 (Quality Gate)</strong>：
<ul>
<li>在 Git Commit 或 PR 合併前設定門檻，若存在 High 級別違規立即阻斷建置。</li>
</ul>
</li>
<li><strong>實習搭配</strong>：
<ul>
<li>配合 <strong>Lab 04 PMD 工具實作</strong>，掌握規則集（RuleSets）自訂與報告產出。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5">概念核對問答 (CCQ 5)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 5)</strong></h4>
<p><strong>問題情境</strong>：<br />
【是非題】在程式碼檢視中，若發現系統直接將詳細的例外錯誤堆疊資訊（如 <code>e.printStackTrace()</code>）輸出至前端頁面或公開日誌，這屬於 OWASP Top 10 中的「A05:2021-安全設定錯誤 (Security Misconfiguration)」漏洞範疇。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq5.png" alt="CCQ5 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch04-ccq5">課堂互動</a></p>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>

<h1 id="46-%E6%AA%A2%E8%A6%96%E7%9A%84%E8%A9%95%E4%BC%B0"><strong>4.6 檢視的評估</strong></h1>
<blockquote>
<p>「無法度量的東西，就無法改善；<br />
用數據證明檢視的價值，讓品質投資無懈可擊。」</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 4.6 檢視的評估 [►](#52)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:[◄](#2) 4.6 檢視的評估 [►](#52);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">

</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8A-%E6%A0%B8%E5%BF%83%E5%BA%A6%E9%87%8F%E6%8C%87%E6%A8%99%E5%85%AC%E5%BC%8F"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 核心度量指標公式</h3>

<li><strong>成本效用比 (Cost Effectiveness)</strong>：<p><mjx-container class="MathJax" jax="SVG" display="true" style="margin: 0;"><svg style="vertical-align: -2.059ex; display: block; width: 100%; height: auto; max-height: 5.285ex;" xmlns="http://www.w3.org/2000/svg" width="38.861ex" height="5.285ex" role="img" focusable="false" viewBox="0 -1426 17176.6 2336"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mtext"><path data-c="52" d="M130 622Q123 629 119 631T103 634T60 637H27V683H202H236H300Q376 683 417 677T500 648Q595 600 609 517Q610 512 610 501Q610 468 594 439T556 392T511 361T472 343L456 338Q459 335 467 332Q497 316 516 298T545 254T559 211T568 155T578 94Q588 46 602 31T640 16H645Q660 16 674 32T692 87Q692 98 696 101T712 105T728 103T732 90Q732 59 716 27T672 -16Q656 -22 630 -22Q481 -16 458 90Q456 101 456 163T449 246Q430 304 373 320L363 322L297 323H231V192L232 61Q238 51 249 49T301 46H334V0H323Q302 3 181 3Q59 3 38 0H27V46H60Q102 47 111 49T130 61V622ZM491 499V509Q491 527 490 539T481 570T462 601T424 623T362 636Q360 636 340 636T304 637H283Q238 637 234 628Q231 624 231 492V360H289Q390 360 434 378T489 456Q491 467 491 499Z"></path><path data-c="61" d="M137 305T115 305T78 320T63 359Q63 394 97 421T218 448Q291 448 336 416T396 340Q401 326 401 309T402 194V124Q402 76 407 58T428 40Q443 40 448 56T453 109V145H493V106Q492 66 490 59Q481 29 455 12T400 -6T353 12T329 54V58L327 55Q325 52 322 49T314 40T302 29T287 17T269 6T247 -2T221 -8T190 -11Q130 -11 82 20T34 107Q34 128 41 147T68 188T116 225T194 253T304 268H318V290Q318 324 312 340Q290 411 215 411Q197 411 181 410T156 406T148 403Q170 388 170 359Q170 334 154 320ZM126 106Q126 75 150 51T209 26Q247 26 276 49T315 109Q317 116 318 175Q318 233 317 233Q309 233 296 232T251 223T193 203T147 166T126 106Z" transform="translate(736,0)"></path><path data-c="74" d="M27 422Q80 426 109 478T141 600V615H181V431H316V385H181V241Q182 116 182 100T189 68Q203 29 238 29Q282 29 292 100Q293 108 293 ,0) scale(1,-1)" font-size="884px" font-family="serif">之</text><text data-variant="normal" transform="translate(11000,0) scale(1,-1)" font-size="884px" font-family="serif">成</text><text data-variant="normal" transform="translate(12000,0) scale(1,-1)" font-size="884px" font-family="serif">本</text></g><rect width="13200" height="60" x="120" y="220"></rect></g></g></g></svg></mjx-container></p></li>
<li><strong>缺陷移除率 (DRL, Defect Removal Leverage)</strong>：
<ul>
<li>比較兩不同階段（如檢視 vs. 系統測試）每工時移除缺陷的比率。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%88-%E6%8C%87%E6%A8%99%E5%BC%95%E5%B0%8E%E8%88%87%E5%B7%A5%E7%A8%8B%E6%B4%9E%E8%A6%8B"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 指標引導與工程洞見</h3>
<ul>
<li><strong>缺陷密度 (Defect Density)</strong>：
<ul>
<li>每千行程式碼 (KLOC) 發現的缺陷數，過高代表模組架構腐化需重構。</li>
</ul>
</li>
<li><strong>必要收集數據</strong>：
<ul>
<li>審查產出物大小 (LOC / Page)</li>
<li>準備與審查耗費工時</li>
<li>檢視發現缺陷數 vs. 後續外洩至測試或生產之缺陷數 (Leakage)</li>
</ul>
</li>
</ul>
</div>
</div>

<header><a href="#2">◄</a> 4.6 檢視的評估 <a href="#52">►</a></header>

<h2 id="%E6%AA%A2%E8%A6%96%E9%80%9F%E7%8E%87-review-rate-%E8%88%87%E6%BC%8F%E6%AA%A2%E7%8E%87%E7%9A%84%E6%AC%8A%E8%A1%A1">檢視速率 (Review Rate) 與漏檢率的權衡</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 貪快是檢視最大的敵人；維持健康的閱讀步調才能真正守護品質底線。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8F%83-%E6%AA%A2%E8%A6%96%E9%80%9F%E7%8E%87%E5%8F%8D%E6%A8%A3%E5%BC%8F-anti-pattern"><img class="emoji" draggable="false" alt="🏃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c3.svg" data-marp-twemoji=""/> 檢視速率反樣式 (Anti-Pattern)</h3>
<ul>
<li><strong>走馬看花</strong>：
<ul>
<li>若每小時審查超過 1,000 LOC，檢視者只能掃過排版，深層業務邏輯與並發漏洞完全被忽略。</li>
</ul>
</li>
<li><strong>缺陷遺漏率 (Defect Leakage) 飆升</strong>：
<ul>
<li>速率過快導致大量缺陷外洩至動態測試或生產環境，後續修復成本暴增數十倍。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E6%9C%80%E4%BD%B3%E5%AF%A6%E5%8B%99%E5%BB%BA%E8%AD%B0"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 最佳實務建議</h3>
<ul>
<li><strong>標準步調控制</strong>：
<ul>
<li>程式碼審查建議維持在 <strong>200 ~ 400 LOC/小時</strong>（每次會議以 1~2 小時為限，中場休息）。</li>
<li>規格文件審查建議維持在 <strong>5 ~ 10 頁/小時</strong>。</li>
</ul>
</li>
<li><strong>品質第一</strong>：
<ul>
<li>檢視指標是用來改善組織工程流程，絕不可用於懲處或績效競爭。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="[◄](#2) 4.6 檢視的評估 [►](#52)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:[◄](#2) 4.6 檢視的評估 [►](#52);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 4.6 檢視的評估 <a href="#52">►</a></header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-6">概念核對問答 (CCQ 6)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<h4 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-6"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> <strong>概念核對問答 (CCQ 6)</strong></h4>
<p><strong>問題情境</strong>：<br />
組織在推行軟體檢視與審查時，常會使用度量指標來評估其效率。下列關於「檢視速率 (Review Rate)」與「檢視品質」的敘述，何者最為正確？</p>
<ul>
<li><strong>A)</strong> 檢視速率愈快（如每小時檢視 2000 行），代表檢視品質愈高、找出的缺陷愈多</li>
<li><strong>B)</strong> 檢視速率過快通常會導致缺陷遺漏率（Defect Leakage）增高，因此應維持在建議的合理速率內</li>
<li><strong>C)</strong> 為了大幅提升開發速度，檢視會議應儘可能限制在 5 分鐘內結束</li>
<li><strong>D)</strong> 度量指標在軟體工程中的主要目的是用於懲罰寫出最多缺陷的工程師</li>
</ul>
</div>
<div class="ccq-logo">
<img src="../../img/ch04/sqa-ch04-ccq6.png" alt="CCQ6 QR Code" />
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch04-ccq6">課堂互動</a></p>
</div>
</div>
<footer>Ch04 軟體檢視</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="1" data-paginate="true" data-header="[◄](#2) 本章重點導讀 [►](#1)" data-footer="Ch04 軟體檢視" data-theme="sqa-theme" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:[◄](#2) 本章重點導讀 [►](#1);--footer:Ch04 軟體檢視;--theme:sqa-theme;" data-marpit-pagination-total="40">
<header><a href="#2">◄</a> 本章重點導讀 <a href="#1">►</a></header>

<h2 id="%E9%99%84%E9%8C%84%E8%AA%B2%E5%A0%82%E4%BA%92%E5%8B%95%E5%8F%83%E8%80%83%E8%A7%A3%E7%AD%94">附錄：課堂互動參考解答</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 本章課堂互動 (CCQ 1 ～ CCQ 6) 官方標準解答與核心觀念解析總整理。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%AD-ccq-1--3%E5%93%B2%E5%AD%B8%E6%B5%81%E7%A8%8B%E8%88%87%E8%A6%8F%E6%A0%BC"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> CCQ 1 ～ 3：哲學、流程與規格</h3>
<ul>
<li><strong>CCQ 1【正確 (A)】</strong>：靜態測試能在不執行程式下提早揪出規格、架構與程式碼異常，是降低品質成本最佳手段。</li>
<li><strong>CCQ 2【概述 (B)】</strong>：Overview 階段由作者向小組簡報背景脈絡與規格，而非正式找錯。</li>
<li><strong>CCQ 3【雙向追溯 (A)】</strong>：需求與系統規格需達成 Traced (回溯起源) 與 Traceable (前向導引實作與測試)。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-ccq-4--6%E8%A8%AD%E8%A8%88%E8%B3%87%E5%AE%89%E8%88%87%E5%BA%A6%E9%87%8F"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> CCQ 4 ～ 6：設計、資安與度量</h3>
<ul>
<li><strong>CCQ 4【錯誤 (B)】</strong>：設計檢視必須在 Coding 之前進行（左移原則），不可等到測試通過才做。</li>
<li><strong>CCQ 5【正確 (A)】</strong>：在生產環境輸出詳細 <code>printStackTrace()</code> 暴露內部架構，屬於 OWASP A05 安全設定錯誤。</li>
<li><strong>CCQ 6【合理的檢視速率 (B)】</strong>：檢視速率過快會導致缺陷遺漏率飆升，應控制在 200~400 LOC/小時。</li>
</ul>
</div>
</div>
</div>
<script>
(function() {
  function initHeaderDropdown() {
    const sections = [];
    const seenTitles = new Set();
    const slideSections = document.querySelectorAll("section[id]");
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(sec => {
      const header = sec.querySelector("header");
      if (!header) return;
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      const wrapper = document.createElement("span");
      wrapper.className = "header-nav-wrapper";
      
      const titleSpan = document.createElement("span");
      titleSpan.className = "header-nav-title";
      titleSpan.title = "點擊固定或懸停查看所有章節快速跳轉";
      titleSpan.innerHTML = currentTitle + "<span class=\"nav-caret\"> ▾</span>";
      
      titleSpan.addEventListener("click", function(e) {
        e.stopPropagation();
        const wasOpen = wrapper.classList.contains("is-open");
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(w => w.classList.remove("is-open"));
        if (!wasOpen) {
          wrapper.classList.add("is-open");
        }
      });
      
      const dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      dropdown.addEventListener("click", function(e) {
        e.stopPropagation();
      });
      
      const dropHeader = document.createElement("div");
      dropHeader.className = "nav-dropdown-header";
      dropHeader.innerHTML = "<span>📑 快速跳轉章節目錄</span><span style=\"font-size:11px;font-weight:normal;color:#64748b;\">共 " + sections.length + " 個章節</span>";
      dropdown.appendChild(dropHeader);
      
      const grid = document.createElement("div");
      grid.className = "nav-dropdown-grid";
      
      sections.forEach(s => {
        const item = document.createElement("a");
        const isActive = (s.title === currentTitle);
        item.className = "nav-dropdown-item" + (isActive ? " active" : "");
        item.href = "#" + s.id;
        item.innerHTML = "<span class=\"badge\">#" + s.id.padStart(2, "0") + "</span><span class=\"item-text\" title=\"" + s.title + "\">" + s.title + "</span>";
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(() => { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(w => w.classList.remove("is-open"));
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(sec => {
      const header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      const links = header.querySelectorAll("a");
      let prevLink = null;
      let nextLink = null;
      
      links.forEach(a => {
        const txt = a.textContent.trim();
        if (txt === "◄" || txt === "◀") prevLink = a;
        if (txt === "►" || txt === "▶") nextLink = a;
      });
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      if (prevLink) {
        prevLink.className = "header-nav-arrow";
        prevLink.title = "上一章節";
        header.appendChild(prevLink);
        header.appendChild(document.createTextNode(" "));
      }
      
      const wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
      
      if (nextLink) {
        header.appendChild(document.createTextNode(" "));
        nextLink.className = "header-nav-arrow";
        nextLink.title = "下一章節";
        header.appendChild(nextLink);
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
