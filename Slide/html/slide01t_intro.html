<ul>
<li data-marpit-fragment="1"><strong>1.1 軟體危機的歷史與 AI 時代的輪迴</strong>：愛國者、NASA、華航、迪士尼四大歷史慘劇與 1968 NATO 軟體危機根源。</li>
<li data-marpit-fragment="2"><strong>1.2 AI 能拯救軟體危機嗎？</strong>：程式碼維護債務、高錯誤率、安全弱點與 AI 寫程式引發的典型品質事件。</li>
<li data-marpit-fragment="3"><strong>1.3 軟體的本質與品質維度</strong>：IEEE 軟體四要素（程式、程序、文件、資料）＆ David Garvin 五大品質觀點。</li>
<li data-marpit-fragment="4"><strong>1.4 軟體品質工程核心概念</strong>：V&amp;V 驗證與確認、品質成本 (CoQ) ＆ 1:10:100 定律與測試左移。</li>
<li data-marpit-fragment="5"><strong>1.5 軟體生命週期中的品質把關</strong>：V 模型對稱性 ＆ 現代 DevOps CI/CD 6 大連續品質門檻。</li>
<li data-marpit-fragment="6"><strong>1.6 現代軟體品質模型 (ISO 25010)</strong>：ISO 25010 八大產品品質特性剖析 ＆ 10 題情境連環戰。</li>
<li data-marpit-fragment="7"><strong>1.7 綜合練習與思維激盪</strong>：課堂思維問題與數值精度累計實作。</li>
</ul>

<header>1.1 軟體危機的歷史與輪迴</header>
<h2 id="111-case-1%E6%84%9B%E5%9C%8B%E8%80%85%E5%8F%8D%E5%B0%8E%E5%BD%88%E4%BA%8B%E4%BB%B6-1991">1.1.1 Case 1：愛國者反導彈事件 (1991)</h2>
<ul>
<li data-marpit-fragment="1"><strong>事件背景</strong>：
<ul>
<li data-marpit-fragment="2">1991 年波斯灣戰爭，伊拉克飛毛腿飛彈擊中美軍沙烏地達蘭基地，造成 <strong>28 名美軍死亡、100+ 人受傷</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>致命軟體缺陷</strong>：
<ul>
<li data-marpit-fragment="4">愛國者系統時鐘暫存器採用 <strong>24-bit 浮點數</strong> 設計，將時間轉換為 0.1 秒單位時產生截斷誤差（約 0.000000095 秒）。</li>
<li data-marpit-fragment="5">系統連續開機運作超過 <strong>100 小時</strong> 未重啟，誤差累計達 <strong>0.33 秒</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>災難後果</strong>：
<ul>
<li data-marpit-fragment="7">飛毛腿飛彈速度達 4.2 馬赫（1.5 km/s），0.33 秒相當於 <strong>600 公尺距離偏差</strong>，雷達搜尋窗無法鎖定目標，攔截飛彈未發射。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>SQA 啟示</strong>：數值精度問題、浮點數累計誤差，以及**長時運行可靠度測試（Long-term Stress/Reliability Testing）**的重要性。</li>
</ul>

<header>1.1 軟體危機的歷史與輪迴</header>
<h2 id="112-case-2nasa-%E7%81%AB%E6%98%9F%E6%B0%A3%E5%80%99%E8%BB%8C%E9%81%93%E6%8E%A2%E6%B8%AC%E5%99%A8-1998">1.1.2 Case 2：NASA 火星氣候軌道探測器 (1998)</h2>
<ul>
<li data-marpit-fragment="1"><strong>事件背景</strong>：
<ul>
<li data-marpit-fragment="2">1998 年 NASA 發射「火星氣候軌道探測器」（造價近 2 億美元），抵達火星後失聯焚毀。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>致命缺陷：跨模組單位不一致</strong>
<ul>
<li data-marpit-fragment="4"><strong>承包商端（洛克希德馬丁）</strong>：地面控制程式以 <strong>英制單位（磅力·秒，lbf·s）</strong> 輸出推進器衝量數據。</li>
<li data-marpit-fragment="5"><strong>NASA JPL 導航接收端</strong>：太空船導航軟體預設以 <strong>公制單位（牛頓·秒，N·s）</strong> 解析數據（相差 4.45 倍）。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>災難後果</strong>：
<ul>
<li data-marpit-fragment="7">軌道高度預計 140 公里，實際暴跌至 <strong>57 公里</strong>，直接在火星大氣層中摩擦燃燒解體。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>SQA 啟示</strong>：<strong>跨模組介面契約（Interface Contract）</strong>、強型態檢驗與規格審查的重要性。</li>
</ul>
<footer>Ch01 軟體品質導論</footer>
</section>

<header>1.1 軟體危機的歷史與輪迴</header>
<h2 id="113-case-3%E8%8F%AF%E8%88%AA%E5%90%8D%E5%8F%A4%E5%B1%8B%E7%A9%BA%E9%9B%A3-1994">1.1.3 Case 3：華航名古屋空難 (1994)</h2>
<ul>
<li data-marpit-fragment="1"><strong>事件背景</strong>：
<ul>
<li data-marpit-fragment="2">1994 年華航 CI140 班機（A300-622R）在名古屋機場降落時墜毀，<strong>264 人罹難</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>人機介面衝突 (HMI Mode Confusion)</strong>：
<ul>
<li data-marpit-fragment="4"><strong>機師手動操作 (Manual Push)</strong>：副駕駛誤觸重飛模式後，正副駕駛試圖手動前推操縱桿強壓機首下降。</li>
<li data-marpit-fragment="5"><strong>飛控電腦自動配平 (Autopilot Climb)</strong>：電腦處於重飛狀態，強行將水平安定面向上配平抬高機首。</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>致命後果</strong>：
<ul>
<li data-marpit-fragment="7">駕駛員未察覺電腦仍在執行重飛，人機相互抵消；最終水平安定面達到極限仰角，飛機在低空<strong>氣動失速 (Aerodynamic Stall)</strong> 墜毀。</li>
</ul>
</li>
<li data-marpit-fragment="8"><strong>SQA 啟示</strong>：人機互動（HMI/UX）狀態透明度、異常操作回饋與自動化控制權限仲裁設計。</li>
</ul>

<header>1.1 軟體危機的歷史與輪迴</header>
<h2 id="114-case-4%E8%BF%AA%E5%A3%AB%E5%B0%BC%E7%8D%85%E5%AD%90%E7%8E%8B%E9%81%8A%E6%88%B2-1994">1.1.4 Case 4：迪士尼《獅子王》遊戲 (1994)</h2>
<ul>
<li data-marpit-fragment="1"><strong>事件背景</strong>：
<ul>
<li data-marpit-fragment="2">1994 年聖誕節迪士尼推出《獅子王》PC 遊戲，數以萬計家庭滿心期待安裝同樂。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>致命缺陷：缺乏相容性測試</strong>
<ul>
<li data-marpit-fragment="4">遊戲基於特定視訊驅動（WinG）開發，<strong>未在市場主流多樣硬體環境上進行充分相容性測試</strong>。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>災難後果</strong>：
<ul>
<li data-marpit-fragment="6">大量家用電腦開機即藍屏當機，客服專線被憤怒家長打爆，嚴重重創品牌聲譽。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>SQA 啟示</strong>：
<ul>
<li data-marpit-fragment="8">環境多樣性驗證與**相容性測試（Compatibility Testing）**的重要性。</li>
<li data-marpit-fragment="9">該事件促使微軟後來開發標準化 DirectX 遊戲架構。</li>
</ul>
</li>
</ul>

<h2 id="115-%E8%BB%9F%E9%AB%94%E5%8D%B1%E6%A9%9F%E7%9A%84%E5%AE%9A%E7%BE%A9%E8%88%87%E6%88%90%E5%9B%A0">1.1.5 軟體危機的定義與成因</h2>
<ul>
<li data-marpit-fragment="1">1968 年 NATO 會議首次提出「軟體危機（Software Crisis）」：</li>
</ul>
<div class="split55">
<div class="left">
<ol>
<li><strong>軟體規模與複雜性失控</strong>：
<ul>
<li data-marpit-fragment="2">硬體性能激增，軟體規模呈指數成長，超出傳統管理極限。</li>
</ul>
</li>
<li><strong>軟體開發效率低下</strong>：
<ul>
<li data-marpit-fragment="3">進度與成本難以預測，人月神話加劇溝通成本。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<ol start="3">
<li><strong>軟體品質低下</strong>：
<ul>
<li data-marpit-fragment="4">錯誤率高，缺乏系統化品質驗證手段。</li>
</ul>
</li>
<li><strong>軟體維護困難</strong>：
<ul>
<li data-marpit-fragment="5">架構腐化、缺乏文件，後期維護成本吞噬所有研發預算。</li>
</ul>
</li>
</ol>
</div>
</div>

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：愛國者反導彈系統（1991）在達蘭基地攔截失效的根本軟體原因為何？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 通訊網路中斷導致雷達無法傳送指令給飛彈發射架</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 24-bit 時鐘暫存器的浮點捨入誤差在連續運行 100 小時後累加達 0.33 秒</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 程式碼發生記憶體洩漏（Memory Leak）導致作業系統當機</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 雷達演算法誤將美軍戰機辨識為敵方飛毛腿飛彈</p>
</div>

<div class="discussion-columns">

<p><strong>主題：真實世界的軟體失敗案例與省思</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>討論任務</strong>：與鄰近同學組成雙人組，分享一件曾遇過、聽過或搜尋到的真實軟體事故（如 2024 CrowdStrike 藍屏、Knight Capital 交易虧損、搶票/遊戲當機等）。</p>
</li>
<li data-marpit-fragment="2">
<p><strong>討論重點</strong>：</p>
<ol>
<li><strong>影響</strong>：造成了什麼異常？帶來哪些具體損失？</li>
<li><strong>原因</strong>：為什麼會有這個錯誤？（邏輯缺陷、並行競爭、捨入誤差、流程缺失？）</li>
<li><strong>防範</strong>：SQA 與測試流程中該如何避免？</li>
</ol>
</div>

<header>1.2 AI 能拯救軟體危機嗎？</header>
<h2 id="12-ai-%E8%BC%94%E5%8A%A9%E9%96%8B%E7%99%BC%E7%9A%84%E5%AF%A6%E8%AD%89%E7%A0%94%E7%A9%B6%E6%95%B8%E6%93%9A">1.2 AI 輔助開發的實證研究數據</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 程式碼維護性惡化 (GitClear 1.5 億行研究, 2020-2026)</strong>：
<ul>
<li data-marpit-fragment="2"><strong>程式碼重複率 (Code Duplication)</strong> 呈指數級上升。</li>

<h2 id="121-ai-%E5%AF%AB%E7%A8%8B%E5%BC%8F%E5%BC%95%E7%99%BC%E7%9A%84%E5%85%B8%E5%9E%8B%E5%93%81%E8%B3%AA%E4%BA%8B%E4%BB%B6-22">1.2.1 AI 寫程式引發的典型品質事件 (2/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>3. Vibe Coding 帶來的漏洞大爆發（以 Lovable/No-code 平台為例）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>機制</strong>：非工程人員憑 Prompt 快速產出 Web 服務，缺乏 Code Review 與安全概念。</li>
<li data-marpit-fragment="3"><strong>災難</strong>：抽查 1,600+ 個上線應用，高達 10%+ 存在嚴重 SQLi 或越權存取（BOLA）漏洞，可直接繞過驗證進後台。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>4. 敏感金鑰與憑證直接寫死（Hardcoded Secrets）外洩</strong>：
<ul>
<li data-marpit-fragment="5"><strong>機制</strong>：AI 範例常把 API Key、資料庫密碼寫死在程式碼中。</li>
<li data-marpit-fragment="6"><strong>災難</strong>：開發者直接推送到公開 GitHub Repo，雲端帳號 1 小時內被爬蟲盜用並產生數萬美元帳單。</li>
</ul>
</li>
</ul>

<header>1.2 AI 能拯救軟體危機嗎？</header>

<h2 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：在評估生成式 AI 對專案品質的影響時，軟體工程度量研究常使用 <strong>「程式碼流失率（Code Churn）」</strong> 作為關鍵指標。關於 Code Churn 的定義及其在 AI 時代所反映的品質現象，下列敘述何者最為精準？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 指專案跨語言遷移時因語法不相容遺失的行數比例</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 指新 Commit 程式碼在極短時間內被刪除或重寫的比例；反映出 AI 程式碼看似快速但本質脆弱、未經深思熟慮</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 指建置工具自動剔除死碼 (Dead Code) 的效率</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 指自動化測試案例因版本迭代自然失效的比率</p>
</div>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="131-%E8%BB%9F%E9%AB%94%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E7%B4%A0-ieee-61012">1.3.1 軟體四大核心要素 (IEEE 610.12)</h2>
<blockquote>
<p><strong>Software (軟體)</strong>:<br />
Computer <strong>programs</strong> (程式), <strong>procedures</strong> (程序), and possibly associated <strong>documentation</strong> (文件) and <strong>data</strong> (資料) pertaining to the operation of a computer system.</p>
</blockquote>
<ul>
<li data-marpit-fragment="1">軟體不是只有「能跑的原始程式碼」，而是一個完整的系統化工程有機體。</li>
<li data-marpit-fragment="2">就像一部高速高鐵列車，四大要素各自扮演不可或缺的關鍵角色：
<ul>
<li data-marpit-fragment="3"><strong>Programs</strong>：引擎動力與神經網路</li>
<li data-marpit-fragment="4"><strong>Procedures</strong>：標準作業流程 SOP 與發布軌道</li>
<li data-marpit-fragment="5"><strong>Documentation</strong>：設計藍圖與通訊法典</li>
<li data-marpit-fragment="6"><strong>Data</strong>：血液、燃料與環境配置</li>
</ul>
</li>
</ul>
<footer>Ch01 軟體品質導論</footer>

<h2 id="%E8%BB%9F%E9%AB%94%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E7%B4%A0%E6%B7%B1%E5%BA%A6%E5%89%96%E6%9E%90-12">軟體四大核心要素深度剖析 (1/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. Programs (程式 / 原始程式碼) ——「引擎動力與神經網路」</strong>：
<ul>
<li data-marpit-fragment="2"><strong>內涵</strong>：原始碼 (Source Code)、編譯 Bytecode/二進位檔、演算法函式庫與微服務 API，負責承載核心業務邏輯。</li>
<li data-marpit-fragment="3"><strong>實例</strong>：外送平台中計算「外送員最佳派單路徑」與「尖峰動態加價」的核心演算法。</li>
<li data-marpit-fragment="4"><strong>SQA 啟示</strong>：光有程式碼就像只有引擎卻無軌道與汽油的幽靈車，無法安全交付。</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>2. Procedures (作業程序與維運規程) ——「標準作業流程 SOP 與軌道」</strong>：
<ul>
<li data-marpit-fragment="6"><strong>內涵</strong>：CI/CD 流水線、灰度/金絲雀發布規程、災難復原演練 (DR)、備份排程與 Runbooks。</li>
<li data-marpit-fragment="7"><strong>實例</strong>：2024 年 <strong>CrowdStrike 全球大當機</strong>導致 850 萬台電腦藍屏癱瘓。事故根本原因正是發布程序漏洞——更新檔未經分階段逐步驗證，一次性推送全球。</li>
</ul>
</li>
</ul>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="%E8%BB%9F%E9%AB%94%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E7%B4%A0%E6%B7%B1%E5%BA%A6%E5%89%96%E6%9E%90-22">軟體四大核心要素深度剖析 (2/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>3. Documentation (文件、規格與契約) ——「設計藍圖與通訊法典」</strong>：
<ul>
<li data-marpit-fragment="2"><strong>內涵</strong>：需求規格書 (SRS)、OpenAPI 介面契約、架構設計圖、驗收準則與使用者手冊；現代工程中更是自動化測試基石（規格即活文件）。</li>
<li data-marpit-fragment="3"><strong>實例</strong>：<strong>NASA 火星探測器</strong>因地面端「英制」與導航端「公制」契約斷裂，直接燒掉兩億美元！</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>4. Data (資料、設定檔與測試基準) ——「血液、燃料與環境配置」</strong>：
<ul>
<li data-marpit-fragment="5"><strong>內涵</strong>：資料庫遷移腳本 (Migration)、設定檔 (<code>application.yml</code>)、環境變數與測試測資集 (Test Fixtures)。</li>
<li data-marpit-fragment="6"><strong>實例</strong>：程式碼完全沒變，但部署時將連線逾時誤設為 <code>30ms</code>（原 30s），整座系統上線瞬間雪崩。「組態即程式碼 (Config as Code)」的驗證同樣是測試核心。</li>
</ul>
</li>
</ul>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="132-david-garvin-%E4%BA%94%E5%A4%A7%E5%93%81%E8%B3%AA%E8%A7%80%E9%BB%9E">1.3.2 David Garvin 五大品質觀點</h2>
<ul>
<li data-marpit-fragment="1">
<p>哈佛商學院教授 David Garvin 指出，品質是由多重視角交織而成的立體概念：</p>
</li>
<li data-marpit-fragment="2">
<p><strong>1. 超自然觀點 (Transcendental View)</strong>：</p>
<ul>
<li data-marpit-fragment="3">無法量化，但一體驗就能感受其極致優雅與美感（如流暢的 UI/UX 微互動）。</li>
</ul>
</li>
<li data-marpit-fragment="4">
<p><strong>2. 使用者觀點 (User View - Fitness for Use)</strong>：</p>
<ul>
<li data-marpit-fragment="5">是否切中真實使用者痛點、操作直覺並帶來實質效益（合用性）。</li>
</ul>
</li>
<li data-marpit-fragment="6">
<p><strong>3. 製造觀點 (Manufacturing View - Conformance)</strong>：</p>
<ul>
<li data-marpit-fragment="7">是否 100% 符合工程規格書、通過靜態檢測與 Quality Gate（符合度）。</li>
</ul>
</li>
<li data-marpit-fragment="8">
<p><strong>4. 產品觀點 (Product View - Architecture)</strong>：</p>
<ul>
<li data-marpit-fragment="9">產品內在技術特性，如高內聚低耦合、強固型態、可測試性與可維護性。</li>
</ul>
</li>
<li data-marpit-fragment="10">
<p><strong>5. 價值觀點 (Value-based View - ROI)</strong>：</p>
<ul>
<li data-marpit-fragment="11">軟體商業效益是否顯著高於開發、測試與維運之總成本（投資報酬率）。</li>
</ul>
</li>
</ul>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="garvin-%E4%BA%94%E5%A4%A7%E5%93%81%E8%B3%AA%E8%A7%80%E9%BB%9E%E6%B7%B1%E5%BA%A6%E5%AF%A6%E4%BE%8B-12">Garvin 五大品質觀點深度實例 (1/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. 超自然觀點 (Transcendental View)</strong>：
<ul>
<li data-marpit-fragment="2">例如：<strong>Apple iOS</strong> 手勢滑動物理慣性阻尼、<strong>Notion</strong> 極簡斜線指令 (<code>/</code>)，絲滑精緻的微互動讓人發自內心讚嘆。</li>
<li data-marpit-fragment="3">反之：早期報稅系統，功能齊全但介面如同 90 年代老舊表格，按鍵延遲排版擁擠，令人挫折。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. 使用者觀點 (User View)</strong>：
<ul>
<li data-marpit-fragment="5">例如：<strong>Zoom</strong> 在疫情期間擊敗視訊巨頭，因「點連結 3 秒開會」，連長輩學童都能無障礙上手。</li>
<li data-marpit-fragment="6">反之：耗時研發支援 50 種冷門格式的播放器，但使用者只想一鍵播 MP4，淪為陳列品 (Shelfware)。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>3. 製造觀點 (Manufacturing View)</strong>：
<ul>
<li data-marpit-fragment="8">例如：<strong>航太飛控</strong>或<strong>銀行核心帳務</strong>，規格書定義精確至小數後 4 位，實作 100% 符合規格零偏差。</li>
<li data-marpit-fragment="9">盲點：若需求規格本身就有盲點，製造觀點拿下 100 分，也只是「分毫不差造出一套合規廢品」。</li>
</ul>
</li>
</ul>
<footer>Ch01 軟體品質導論</footer>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="garvin-%E4%BA%94%E5%A4%A7%E5%93%81%E8%B3%AA%E8%A7%80%E9%BB%9E%E6%B7%B1%E5%BA%A6%E5%AF%A6%E4%BE%8B-22">Garvin 五大品質觀點深度實例 (2/2)</h2>
<ul>
<li data-marpit-fragment="1"><strong>4. 產品觀點 (Product View)</strong>：
<ul>
<li data-marpit-fragment="2">例如：<strong>Linux 核心</strong>或 <strong>Spring Framework</strong> 架構設計，模組高內聚低耦合，圈複雜度低，具備 90% 以上自動化測試保護，歷經十餘年依然穩健重構擴展。</li>
<li data-marpit-fragment="3">反之：<strong>義大利麵程式碼 (Spaghetti Code)</strong>，外表堪用但原始碼無分層且複製貼上，改動一個按鈕竟引發會員登入全面崩潰。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>5. 價值觀點 (Value-based View)</strong>：
<ul>
<li data-marpit-fragment="5">例如：新創以 Serverless 與開源元件在兩週內打造出 <strong>MVP（最小可行產品）</strong> 搶佔市場，以最低成本取得最大商業回饋。</li>
<li data-marpit-fragment="6">反之：在商業模式未驗證前，執意耗資數百萬引進複雜分散式架構與自建機房，產品上線前資金耗盡宣告破產。</li>
</ul>
</li>
</ul>

<header>1.3 軟體的本質與品質維度</header>
<h2 id="garvin-%E4%BA%94%E5%A4%A7%E5%93%81%E8%B3%AA%E8%A7%80%E9%BB%9E%E5%B0%8D%E7%85%A7%E8%A1%A8">Garvin 五大品質觀點對照表</h2>
<table>
<thead>
<tr>
<th style="text-align:left">品質觀點</th>
<th style="text-align:left">核心定義</th>
<th style="text-align:left">軟體工程實例</th>
<th style="text-align:left">忽略該觀點的後果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>超自然觀點</strong></td>
<td style="text-align:left">無法精確量化，體驗感受極致美感</td>
<td style="text-align:left">流暢 UI/UX、細膩微互動 (iOS)</td>
<td style="text-align:left">軟體感覺粗製濫造、冰冷卡頓</td>
</tr>
<tr>
<td style="text-align:left"><strong>使用者觀點</strong></td>
<td style="text-align:left">符合真實需求 (Fitness for Use)</td>
<td style="text-align:left">解決痛點、操作直覺 (Zoom)</td>
<td style="text-align:left">功能很強但無人想用 (Shelfware)</td>
</tr>
<tr>
<td style="text-align:left"><strong>製造觀點</strong></td>
<td style="text-align:left">符合規格流程 (Conformance)</td>
<td style="text-align:left">遵循 Clean Code、通過 Gate</td>
<td style="text-align:left">規格有漏洞時做出一套合規廢品</td>
</tr>
<tr>
<td style="text-align:left"><strong>產品觀點</strong></td>
<td style="text-align:left">產品內在技術特性與架構</td>
<td style="text-align:left">高內聚低耦合、強固型態 (Spring)</td>
<td style="text-align:left">架構腐化，改動引發全面崩潰</td>
</tr>
<tr>
<td style="text-align:left"><strong>價值觀點</strong></td>
<td style="text-align:left">商業價值與性價比 (ROI)</td>
<td style="text-align:left">商業產出 &gt; 開發維運成本 (MVP)</td>
<td style="text-align:left">開發成本失控超支，商業不可行</td>
</tr>
</tbody>
</table>

<p><strong>D.</strong> 超自然觀點 (Transcendental View)</p>
</div>

<header>1.4 V&amp;V、品質成本與測試左移</header>
<h2 id="141-%E9%A9%97%E8%AD%89%E8%88%87%E7%A2%BA%E8%AA%8D-verification-vs-validation">1.4.1 驗證與確認 (Verification vs. Validation)</h2>
<ul>
<li data-marpit-fragment="1">軟體品質工程的兩大靈魂叩問：</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>Verification (驗證)</strong>：<br />
<em>Are we building the product <strong>right</strong>?</em>（我們是否有正確地建造軟體？）<br />
確保產出物符合設定的規格（程式碼是否符合設計圖、單元測試是否符合規格）。</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Validation (確認)</strong>：<br />
<em>Are we building the <strong>right</strong> product?</em>（我們建造的是否是正確的軟體？）<br />
確保軟體真正滿足使用者的真實業務需求（驗收測試、易用性測試、臨床/現場試用）。</p>
</blockquote>

<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>問題</strong>：某軟體團隊為醫院開發急診分流系統，嚴格按照規格書完成實作，單元測試與 Code Review 皆 100% 通過無 Bug。但實際上線在急診室臨床試用時，醫護人員發現分流操作流程完全不符合急救現場真實節奏，無法在實務中使用。根據定義，此系統在下列哪一項做得很好，但在哪一項嚴重失敗？</p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> Verification 做得很好，但 Validation 嚴重失敗</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> Validation 做得很好，但 Verification 嚴重失敗</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> Verification 與 Validation 兩者皆成功</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> Verification 與 Validation 兩者皆失敗</p>
</div>

<header>1.4 V&amp;V、品質成本與測試左移</header>
<h2 id="142-%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E6%88%90%E6%9C%AC-cost-of-quality-coq">1.4.2 軟體品質成本 (Cost of Quality, CoQ)</h2>
<ul>
<li data-marpit-fragment="1"><strong>一致性成本 (Conformance Costs - 主動投資品質)</strong>：
<ul>
<li data-marpit-fragment="2"><strong>預防成本 (Prevention)</strong>：架構審查、契約設計 (DbC)、工程培訓與靜態規範。</li>
<li data-marpit-fragment="3"><strong>評估成本 (Appraisal)</strong>：單元測試、靜態程式碼分析 (SonarQube) 與 Code Review。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>非一致性成本 (Non-Conformance Costs - 忽視品質的代價)</strong>：
<ul>
<li data-marpit-fragment="5"><strong>內部失敗成本 (Internal Failure)</strong>：上線前發現 Bug 的除錯 (Debugging)、重構與重測返工。</li>
<li data-marpit-fragment="6"><strong>外部失敗成本 (External Failure)</strong>：生產環境崩潰、客戶求償、緊急 Hotfix 與商譽損失。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>1:10:100 定律 (The Rule of Tens)</strong>：
<ul>
<li data-marpit-fragment="8">需求階段修復缺陷代價 <strong>$1</strong> ➔ 開發測試階段暴增至 <strong>$10</strong> ➔ 上線後災難損失高達 <strong>$100 ～ $1000+</strong>！</li>
</ul>
</li>
</ul>

<li data-marpit-fragment="1"><strong>V 模型 (V-Model)</strong> 建立了開發階段與測試層級的嚴密對稱與平行規劃：
<ul>
<li data-marpit-fragment="2"><strong>需求分析 (Requirements)</strong> ➔ 平行規劃 <strong>驗收測試 (Acceptance Testing)</strong></li>
<li data-marpit-fragment="3"><strong>系統架構 (System Architecture)</strong> ➔ 平行規劃 <strong>系統測試 (System Testing)</strong></li>
<li data-marpit-fragment="4"><strong>元件設計 (Component Design)</strong> ➔ 平行規劃 <strong>整合測試 (Integration Testing)</strong></li>
<li data-marpit-fragment="5"><strong>編寫程式碼 (Coding)</strong> ➔ 實作並執行 <strong>單元測試 (Unit Testing)</strong></li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>核心價值</strong>：
<ul>
<li data-marpit-fragment="7">「品質是建構出來的，不是測出來的 (Quality is built-in, not tested-in)」。</li>
<li data-marpit-fragment="8">在寫下第一行業務程式碼前，各層級測試規格就已隨同架構確立完成。</li>
</ul>
</li>
</ul>
<footer>Ch01 軟體品質導論</footer>

<header>1.5 生命週期品質把關與 CI/CD</header>
<h2 id="152-devops-cicd-%E9%80%A3%E7%BA%8C%E5%93%81%E8%B3%AA%E9%96%80%E6%AA%BB-quality-gates">1.5.2 DevOps CI/CD 連續品質門檻 (Quality Gates)</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. Commit 門檻</strong>：本地 Git Pre-commit Hook 格式化與快速靜態語法檢查。</li>
<li data-marpit-fragment="2"><strong>2. SAST 靜態程式碼品質門檻</strong>：SonarQube / SpotBugs 掃描程式碼異味與安全弱點。</li>
<li data-marpit-fragment="3"><strong>3. Unit Tests &amp; 覆蓋率門檻</strong>：JUnit 5 單元測試，JaCoCo 驗證覆蓋率 (&gt; 80%)。</li>
<li data-marpit-fragment="4"><strong>4. Integration Tests 容器整合門檻</strong>：Testcontainers 拉起真實 Docker 驗證 DB 與 API。</li>
<li data-marpit-fragment="5"><strong>5. E2E &amp; Security 驗收門檻</strong>：Playwright 自動化使用者流程 + OWASP ZAP 動態掃描。</li>
<li data-marpit-fragment="6"><strong>6. Production &amp; Observability 門檻</strong>：金絲雀部署 + 可觀測性監控 P99 延遲告警。</li>
</ul>

<header>1.6 現代軟體品質模型 ISO 25010</header>
<h2 id="%F0%9F%8E%AE-%E8%AA%B2%E5%A0%82%E6%8C%91%E6%88%B0iso-25010-%E5%85%AB%E5%A4%A7%E7%89%B9%E6%80%A7%E9%80%A3%E7%92%B0%E6%88%B0-%E6%83%85%E5%A2%83-15"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 課堂挑戰：ISO 25010 八大特性連環戰 (情境 1~5)</h2>
<ul>
<li data-marpit-fragment="1">
<p><strong>八大選項池</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>A. 功能適合性</code> ｜ <code>B. 可靠性</code> ｜ <code>C. 效能效率</code> ｜ <code>D. 易用性</code></li>
<li data-marpit-fragment="3"><code>E. 安全性</code> ｜ <code>F. 可維護性</code> ｜ <code>G. 可移植性</code> ｜ <code>H. 相容性</code></li>
</ul>
</li>
<li data-marpit-fragment="4">
<p><strong>第 1 題【吐鈔卡死危機】</strong>：ATM 提款扣款成功並印明細，但吐鈔口卡死分文未出。</p>
</li>
<li data-marpit-fragment="5">
<p><strong>第 2 題【雙十一流量海嘯】</strong>：午夜 50 萬人搶購，CPU 飆到 100%，API 延遲暴增至 40 秒。</p>
</li>
<li data-marpit-fragment="6">
<p><strong>第 3 題【致命的相鄰按鈕】</strong>：「重啟伺服器」與「永久銷毀主機」按鈕相鄰且顏色相同無二次防呆。</p>
</li>
<li data-marpit-fragment="7">
<p><strong>第 4 題【牽一髮動全身的義大利麵】</strong>：新增會員「暱稱」欄位引發 8 個模組連鎖編譯錯誤。</p>
</li>
<li data-marpit-fragment="8">
<p><strong>第 5 題【斷電重啟秒級自癒】</strong>：DB 突發斷電，備援機制 3 秒內自動 Failover 重放 WAL 零遺失。</p>
</li>
</ul>

<ul>
<li data-marpit-fragment="1">
<p><strong>八大選項池</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>A. 功能適合性</code> ｜ <code>B. 可靠性</code> ｜ <code>C. 效能效率</code> ｜ <code>D. 易用性</code></li>
<li data-marpit-fragment="3"><code>E. 安全性</code> ｜ <code>F. 可維護性</code> ｜ <code>G. 可移植性</code> ｜ <code>H. 相容性</code></li>
</ul>
</li>
<li data-marpit-fragment="4">
<p><strong>第 6 題【跨系統托運單格式打架】</strong>：電商與物流 API 日期協定不符（<code>YYYY-MM-DD</code> vs <code>DD/MM/YYYY</code>）導致批次失敗。</p>
</li>
<li data-marpit-fragment="5">
<p><strong>第 7 題【URL 改個數字看光他人隱私】</strong>：將 URL <code>userId=1001</code> 改為 <code>1002</code>，直接秀出他人信用卡號。</p>
</li>
<li data-marpit-fragment="6">
<p><strong>第 8 題【Mac 開發很順，推上 Linux 容器全掛】</strong>：macOS 測試正常，上 Linux 因大小寫嚴格區分找不到檔案。</p>
</li>
<li data-marpit-fragment="7">
<p><strong>第 9 題【地下室離線暫存與自動重送】</strong>：外送員進地下室 App 自動離線快取，回地面 5G 自動重送。</p>
</li>
<li data-marpit-fragment="8">
<p><strong>第 10 題【容器映像檔一鍵秒級部署】</strong>：Docker 映像檔在 AWS、GCP 或 K8s 皆能在 10 秒內一鍵拉起。</p>
</li>
</ul>

<header>1.7 綜合練習與思維激盪</header>
<h2 id="17-%E8%AA%B2%E5%A0%82%E6%80%9D%E7%B6%AD%E6%BF%80%E7%9B%AA%E8%88%87%E5%95%8F%E9%A1%8C%E8%A8%8E%E8%AB%96">1.7 課堂思維激盪與問題討論</h2>
<ul>
<li data-marpit-fragment="1"><strong>1. AI 時代的品質反思</strong>：
<ul>
<li data-marpit-fragment="2">當生成式 AI 可在幾秒內產生程式碼時，為什麼軟體測試工程師的價值反而大幅提升？</li>
<li data-marpit-fragment="3">請從「<strong>Test Oracle 問題</strong>」與「<strong>自我印證偏誤</strong>」兩方面進行思考。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>2. ISO 25010 維度分析</strong>：
<ul>
<li data-marpit-fragment="5">「微服務系統在資料庫當機重啟後，能在 5 秒內自動重連並重試訊息，完全不丟失交易。」</li>
<li data-marpit-fragment="6">這體現了 ISO 25010 中的哪些品質特性？（提示：容錯度、可回復性、資料完整性）。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>3. 數值精度與累計誤差實證</strong>：
<ul>
<li data-marpit-fragment="8">試寫一段 Java 程式碼，連續將 <code>0.1</code> 累加 1,000,000 次，比較其結果與 <code>100000.0</code> 的差異。觀察浮點數在長時間累計下的偏差現象。</li>
</ul>
</li>
</ul>

<ul>
<li data-marpit-fragment="1"><strong>CCQ 1（愛國者反導彈事件）</strong>：
<ul>
<li data-marpit-fragment="2"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="3">愛國者系統採用 24-bit 浮點數記錄時間，連開 100 小時累積 0.33 秒誤差，對 4.2 馬赫飛彈造成約 600 公尺偏差，無法鎖定。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>CCQ 2（程式碼流失率 Code Churn）</strong>：
<ul>
<li data-marpit-fragment="5"><strong>正確答案：B</strong></li>
<li data-marpit-fragment="6">衡量新 Commit 程式碼在短時間（2 週）內被刪除或修改的比例；反映 AI 程式碼看似快速但脆弱，帶來長期維護債。</li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>CCQ 3（Garvin 品質觀點）</strong>：
<ul>
<li data-marpit-fragment="8"><strong>正確答案：A</strong></li>
<li data-marpit-fragment="9">產品觀點著重於內在架構（高內聚低耦合、可維護性）。雖符合合約規格（製造觀點），但架構腐敗。</li>
</ul>
</li>

<ul>
<li data-marpit-fragment="11"><strong>正確答案：A</strong></li>

</ul>
</li>
</ul>

<li data-marpit-fragment="3">需求分析 ➔ 系統架構 ➔ 元件設計 ➔ 編寫程式碼 ➔ 單元測試 ➔ 整合測試 ➔ 系統測試 ➔ 驗收測試。</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>ISO 25010 情境連連看（10 題連環戰）</strong>：
<ul>
<li data-marpit-fragment="5"><strong>1. ATM 吐鈔卡死</strong> ➔ <strong>A. 功能適合性</strong>（功能正確性與完備性）</li>
<li data-marpit-fragment="6"><strong>2. 雙十一延遲 40 秒</strong> ➔ <strong>C. 效能效率</strong>（時間行為與容量）</li>
<li data-marpit-fragment="7"><strong>3. 相鄰毀滅按鈕無防呆</strong> ➔ <strong>D. 易用性</strong>（使用者錯誤防護）</li>
<li data-marpit-fragment="8"><strong>4. 改欄位 8 模組連鎖破裂</strong> ➔ <strong>F. 可維護性</strong>（模組化與可修改性）</li>
<li data-marpit-fragment="9"><strong>5. 斷電 3 秒自癒零遺失</strong> ➔ <strong>B. 可靠性</strong>（容錯度與可回復性）</li>
<li data-marpit-fragment="10"><strong>6. 物流 API 日期格式打架</strong> ➔ <strong>H. 相容性</strong>（互通性 Interoperability）</li>
<li data-marpit-fragment="11"><strong>7. URL 改 ID 偷窺信用卡</strong> ➔ <strong>E. 安全性</strong>（機密性與授權能力）</li>
<li data-marpit-fragment="12"><strong>8. Linux 容器大小寫崩潰</strong> ➔ <strong>G. 可移植性</strong>（適應性 Adaptability）</li>
<li data-marpit-fragment="13"><strong>9. 地下室離線暫存自動重送</strong> ➔ <strong>B. 可靠性</strong>（成熟度與容錯度）</li>
<li data-marpit-fragment="14"><strong>10. Docker 映像檔秒級部署</strong> ➔ <strong>G. 可移植性</strong>（易安裝性與易置換性）</li>
</ul>
